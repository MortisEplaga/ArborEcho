          <p class="txt">Если книга правил прочитана, а персонаж нужен сегодня — этого списка достаточно.

          <ol class="nl">
            <li><b>Спросите у Мастера режим партии<\/b> (спринт или марафон) и берёт ли он магию в игру.

            <li><b>Сформулируйте концепцию одной фразой<\/b> и назовите 2–3 события, которые привели героя
        к первой сцене. → шаг 1<\/li>
            <li><b>Выберите точный возраст<\/b> и выпишите из Приложения 2 два числа: свободные очки
        и очки Здоровья. → шаг 2<\/li>
            <li><b>Заполните лист<\/b>: 2–3 несущих аспекта по 3–5 очков в навык, поддержка по 1–3,
        ни одного первичного значения выше 5. Здоровье — из своего пула. Изнанку не трогайте. → шаги 3–4<\/li>
            <li><b>Пусть лист посчитает сам<\/b>: введите только первичные значения, остальное

            <li><b>Добавьте следы, если требует возраст<\/b>: от 35 лет — вероятны, от 51 — обязательны.

            <li><b>Если Мастер дал одаренность<\/b> — распределите отдельный пул Изнанки (2–6 очков,

            <li><b>Заготовьте 3–5 типовых заявок<\/b> со навыками и стоимостью в ОД, чтобы не считать их за столом. → шаг 8<\/li>
            <li><b>Пройдите чек-лист<\/b> из шага 9 и проговорите связи с другими персонажами.<\/li>

          <div class="note">Гайд не заменяет Книгу правил: он собирает разбросанное по шести разделам

  помечены явно и вынесены в вопросы Мастеру.<\/div>

              <td class="L"><b>Спринт<\/b>: патологии не используются, последствия травм не используются, лечение и установка модификаций ускорены. <b>Марафон<\/b>: всё работает полноценно, лечение требует времени и средств, тайм-скипы пересчитывают пул навыков по возрастной таблице. Если режим спринтовый, карточки патологий и модификаций можно не делать вовсе.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Магия в партии<\/td>
              <td class="L">Есть ли одаренные персонажи вообще, сколько их, какого направления. Одаренность — врожденная особенность, и решение по ней принимает Мастер. Без этого ответа нельзя планировать Изнанку.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Модификации<\/td>
              <td class="L">Доступны ли био- и кибермодификации, кто их оплачивает (артель, армия, Дом, личные средства). Книга прямо советует не совмещать модификации и магию на одном персонаже в первой игре.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Канон партии<\/td>
              <td class="L">Какие регионы, Великие Дома, Храмы и тайные организации в игре; какие события мира уже произошли. Предыстория, противоречащая канону, переписывается позже и дороже.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Опциональные правила<\/td>
              <td class="L">Модификатор экипировки (примечание [12]) — используется или влияние снаряжения остаётся частью модификатора условий; правило [6] — «подготовка сверх ступени даёт +1 к броску за каждые 2 полных единицы среднего опорного навыка, максимум +2». Оба вводятся только по общему согласию.<\/td>
            <\/tr>

              <td class="rh">Связи между персонажами<\/td>
              <td class="L">Общее прошлое, служба, родство, долги. Книга рекомендует проговорить их на создании: это даёт готовые поводы для сцен и сильно удешевляет вход в Изнанку по модификатору моста (общая биография −2).<\/td>

          <div class="sh3">Открытые вопросы, которые книга не закрывает<\/div>
          <div class="cards">

              <div class="cn">Аура без одаренности<\/div>
              <div class="cr"><i>Суть<\/i><span>У заклинаний Материи и Менталистики ведущий навык берётся из аспекта Изнанка: магию Материи ведёт Материя, магию Менталистики — Менталистика. То есть нужна одаренность. У заклинаний Ауры ведущий — обычный навык из шаблона: Концентрация, Запугивание, Проприоцепция.<\/span><\/div>

        <section class="page" id="s1">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Образ<\/span><span class="title long">Шаг 1 · Концепция одной фразой<\/span>
  <\/div>
            <span class="pgn">2 / 14<\/span>
          <\/div>
          <p class="txt">Книга предлагает метод «от концепции к деталям», и порядок здесь важен: цифры в Arbor Echo
  лучше ложатся на уже придуманного человека, чем наоборот. Начните с сути вроде
  «разочарованный исследователь» или «наследник обедневшего рода» — и только потом решайте,
  сколько очков уйдёт в Анатомию.<\/p>
          <div class="sh3">Порядок работы<\/div>
          <ol class="nl">
            <li><b>Базовая идея.<\/b> Одна фраза: кем персонаж был до первой сцены и чего он хочет теперь.<\/li>
            <li><b>Ключевые события.<\/b> Два-три события, кардинально повлиявших на жизнь и приведших к текущему моменту.
        Книга прямо советует связать их с возможными начальными следами или сильными убеждениями —
        это самый дешёвый способ получить персонажа, у которого механика и биография не спорят.<\/li>
            <li><b>Характерные детали.<\/b> Манеры, привычки, детали внешности. Одна точная деталь работает лучше пяти общих.<\/li>
            <li><b>Незакрытые места.<\/b> Оставьте пару явных пробелов: предыстория не должна отвечать на все вопросы.
        Это пространство, которое Мастер будет заполнять сюжетом.<\/li>
          <\/ol>
          <div class="sh3">Чек-лист предыстории<\/div>
          <div class="grid2">
            <div class="col">
              <div class="sh3" style="margin-top:2px">Идентичность и происхождение<\/div>
              <ul class="bl">
                <li>Имя и профессия — как персонажа знают в мире и чем он занимается в альтернативном начале XX века.<\/li>
                <li>Внешность и возраст (возраст влияет на бюджет очков и на вероятность стартовых следов).<\/li>
                <li>Отличительные черты.<\/li>
                <li>Происхождение: место рождения, социальный статус, культурная и национальная принадлежность.<\/li>
              <\/ul>
              <div class="sh3">Формирующий опыт<\/div>
              <ul class="bl">
                <li>Ключевые события: служба, конфликты, научные открытия, утраты, находки, встречи с влиятельными людьми.<\/li>
                <li>Текущая ситуация: что привело к моменту начала игры, каковы обстоятельства, ресурсы и ближайшие устремления.<\/li>
              <\/ul>
            <\/div>
            <div class="col">
              <div class="sh3" style="margin-top:2px">Сеть связей<\/div>
              <ul class="bl">
                <li>Личные отношения: друзья, семья, наставники, соперники, враги — и что они значат для персонажа.<\/li>
                <li>Организации: Великие Дома, академии, тайные общества, гильдии, Храмы, криминальные группы.<\/li>
              <\/ul>
              <div class="sh3">Мотивация и конфликты<\/div>
              <ul class="bl">
                <li>Цели и долгосрочные амбиции: власть, знание, искупление, богатство, защита близких, изменение мира.<\/li>
                <li>Страхи и ограничения: что вызывает глубокий страх и какие факторы сдерживают героя.<\/li>
              <\/ul>
              <div class="sh3">Согласование<\/div>
              <ul class="bl">
                <li>Места, организации и события соответствуют канону партии или версии Мастера.<\/li>
                <li>Проговорены связи с другими персонажами.<\/li>
              <\/ul>
            <\/div>
          <\/div>
          <div class="note"><b>Биография — рабочий инструмент.<\/b> Она даёт конкретные числа:
  общий эпизод с целью даёт −2 к сложности входа в Изнанку; общая среда (школа, Храм, Дом, полк, цех) — −1;
  общий язык — 0. Персонаж без связей платит за ту же работу больше. Тёмный стигмат вообще невозможно получить
  без действующей патологии, а светлый — без фундаментального просветления, то есть без пережитого перелома.<\/div>

        <\/section>
        <section class="page" id="s2">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Бюджет<\/span><span class="title long">Шаг 2 · Возраст: очки и обязательные следы<\/span>

            <span class="pgn">3 / 14<\/span>
          <\/div>
          <p class="txt">Возраст — единственное решение на этом шаге, но оно задаёт сразу три вещи: сколько очков
  можно вложить, сколько из них уходит в Здоровье, и обязан ли персонаж прийти в игру со следами прожитых лет.
  Точный возраст лучше назвать сразу: границы в двух таблицах книги не совпадают.<\/p>

          <div class="sh3">Как читать эту таблицу<\/div>
          <ul class="bl">
            <li><b>Свободные очки<\/b> распределяются куда угодно, кроме навыков аспекта Здоровья.<\/li>
            <li><b>Очки Здоровья<\/b> — отдельный пул: Нейромоторика, Гомеостаз, Метаболизм. Они же входят
        в Порог биоагрессивности, поэтому модифицированному персонажу нужен запас именно здесь.<\/li>
            <li><b>Диапазон<\/b> («19–26», «42–51») — не случайность: конкретное число в пределах строки
        назначает Мастер либо группа, обычно исходя из того, насколько насыщенным было прошлое героя.
        Если решения нет, берите середину и не спорьте.<\/li>
            <li><b>Обязательные следы Пожилого<\/b> должны отражать уникальный жизненный путь, профессию и пережитые
        испытания. Если Игрок не отметил их при создании, Мастер вправе добавить их до начала игры.<\/li>
            <li><b>Пулы Изнанки в этой таблице нет.<\/b> Он появляется только если Мастер признал персонажа одаренным
        и считается отдельно. → шаг 7<\/li>

          <div class="note"><b>Практический вывод.<\/b> Молодой персонаж (25–34) с 42–51 очком — самая удобная точка старта:
  бюджета уже хватает на два-три сильных аспекта, при этом следы ещё не обязательны, а Просветления берутся
  в нормальном темпе. Пожилой персонаж сильнее на бумаге (57–59 очков), но приходит в игру с обязательными
  штрафами и почти закрытым доступом к Просветлениям — то есть его развитие идёт медленнее.<\/div>

        <section class="page" id="s3">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Устройство<\/span><span class="title long">Шаг 3 · Как устроен лист: 5 → 16 → 48<\/span>
  <\/div>
            <span class="pgn">4 / 14<\/span>
          <\/div>
          <p class="txt">Прежде чем распределять очки, нужно понять форму сосуда. В Arbor Echo пять характеристик,
  они делятся на шестнадцать аспектов, в каждом аспекте ровно три навыка — всего сорок восемь навыков.
  Очки вкладываются только в навыки; аспекты и характеристики не заполняются, а вычисляются.<\/p>
          <table class="tb">

            <\/tr>

          <div class="sh3">Три колонки листа<\/div>
          <div class="cards c3">
            <div class="card">
              <div class="cn">ИЗН<\/div>
              <div class="cr"><i>Что это<\/i><span>Первичное значение — то, во что вы вкладываете очки.<\/span><\/div>
              <div class="cr"><i>Потолок<\/i><span>5 при создании, 10 по ходу игры. Потолок считается до бонусов: аспект, характеристика, модификации, Просветления и Гейсы добавляются поверх него.<\/span><\/div>
              <div class="cr"><i>Особенность<\/i><span>Лист подсвечивает значение выше 5 оранжевым — это сигнал, что цифра вне стартового потолка.<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">ЗС<\/div>
              <div class="cr"><i>Что это<\/i><span>Значение следа: бонусы и штрафы от Просветлений, Гейсов, модификаций и травм.<\/span><\/div>
              <div class="cr"><i>Как работает<\/i><span>Прибавляется к итогу и влияет ровно на один навык: аспект и характеристику не пересчитывает.<\/span><\/div>
              <div class="cr"><i>Нюанс<\/i><span>Некоторые следы по правилам применяются к первичному значению — тогда их пишут в ИЗН. → шаг 6<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">РЗН<\/div>
              <div class="cr"><i>Что это<\/i><span>Результирующее значение — то, что реально идёт в бросок.<\/span><\/div>
              <div class="cr"><i>Формула<\/i><span>ИЗН + аспект + характеристика + ЗС, округление один раз.<\/span><\/div>
              <div class="cr"><i>Итог<\/i><span>Бросок проверки: 2d6 + сумма РЗН всех навыков, участвующих в проверке, против сложности.<\/span><\/div>
            <\/div>
          <\/div>
          <div class="f"><span class="fl">Порядок вычисления<\/span><br>
    <span class="fe">аспект<\/span> = среднее арифметическое трёх его навыков<br>
    <span class="fe">характеристика<\/span> = среднее арифметическое входящих в неё аспектов<br>
    <span class="fe">РЗН навыка<\/span> = первичное + аспект + характеристика + ЗС<br>
    <span class="fd">Округления по дороге нет: величина аспекта идёт в характеристику как есть, величина характеристики —
    в РЗН как есть. Округляются один раз РЗН навыков и все вторичные характеристики (0,5 и выше — вверх).
    В интерфейсе аспекты и характеристики показываются с точностью до двух знаков — для справки, в расчёт идёт полное значение.<\/span><\/div>
          <div class="sh3">Два изолированных пула<\/div>
          <ul class="bl">
            <li><b>Здоровье<\/b> (Нейромоторика, Гомеостаз, Метаболизм) заполняется из отдельного пула очков,
        а не из свободных. Этот же аспект входит в Порог биоагрессивности и в Лимит Платонов.<\/li>
            <li><b>Изнанка<\/b> (Материя, Менталистика, Архитектоника) свободными очками не заполняется вообще.
        Единственные два пути: Просветления по ходу игры или стартовая одаренность, которую выдаёт Мастер. → шаг 7<\/li>
            <li><b>Все остальные 42 навыка<\/b> — куда угодно в пределах бюджета и потолка 5.<\/li>
          <\/ul>
          <div class="note"><b>Следствие, о котором часто забывают.<\/b> Навык с нулевым первичным значением не равен нулю
  в броске: он получает аспект и характеристику. У «Инженера-практика» из примера Менталистика с ИЗН 0
  имеет РЗН 4, а Атлетика с ИЗН 0 — РЗН 3. Поэтому пустые навыки в прокачанной характеристике —
  не дыра, а дешёвый фон: персонаж «немного понимает» во всём, что относится к его ремеслу.<\/div>
          <div class="pg-foot">Arbor Echo · Создание персонажа · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s4">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Распределение<\/span><span class="title long">Шаг 4 · Куда вложить очки<\/span>
  <\/div>
            <span class="pgn">5 / 14<\/span>
          <\/div>
          <div class="sh3">Порядок действий<\/div>
          <ol class="nl">
            <li><b>Выпишите бюджет<\/b> из шага 2: свободные очки и очки Здоровья отдельно.<\/li>
            <li><b>Назначьте 2–3 несущих аспекта<\/b> — то, чем персонаж зарабатывает на жизнь.
        В каждый навык такого аспекта кладите 3–5 очков.<\/li>
            <li><b>Добавьте один-два поддерживающих аспекта<\/b> по 1–3 очка в навык: это то, чем герой
        занимается попутно (восприятие для наблюдателя, моторика для хирурга, самоконтроль для мага).<\/li>
            <li><b>Заполните Здоровье<\/b> из своего пула. Ориентир: 4–6 очков, если модификаций не планируется,
        и столько, сколько получится, если планируются — порог биоагрессивности считается именно отсюда.<\/li>
            <li><b>Потратьте 1–2 очка на характерную деталь<\/b>: Вкус, Обоняние, Обман, История, Визуальная культура.
        Это самые дешёвые очки в игре — они почти ничего не решают в бою, но делают персонажа живым
        и регулярно дают легальный повод для проверки.<\/li>
            <li><b>Проверьте потолок<\/b>: ни одного первичного значения выше 5, Изнанка пуста (или заполнена
        только из пула одаренности).<\/li>
          <\/ol>
          <div class="sh3">Арифметика вложений: одинаковые очки дают разный результат<\/div>
          <p class="txt">Характеристика — среднее её аспектов, поэтому вклад одного аспекта размазывается тем сильнее,
  чем аспектов больше. Пятнадцать очков, вложенные в один аспект, дают навыкам этого аспекта разное РЗН
  в зависимости от того, в какой характеристике он живёт:<\/p>
          <table class="tb">
            <tr>
              <th>Характеристика<\/th>
              <th>Аспектов в ней<\/th>
              <th>Аспект после 15 очков<\/th>
              <th>Характеристика<\/th>
              <th>РЗН каждого навыка<\/th>
            <\/tr>
            <tr>
              <td class="rh">Воля<\/td>
              <td>2<\/td>
              <td>5,00<\/td>
              <td>2,50<\/td>
              <td class="g"><b>13<\/b><\/td>
            <\/tr>
            <tr>
              <td class="rh">Восприятие<\/td>
              <td>2<\/td>
              <td>5,00<\/td>
              <td>2,50<\/td>
              <td class="g"><b>13<\/b><\/td>
            <\/tr>
            <tr>
              <td class="rh">Телосложение<\/td>
              <td>3<\/td>
              <td>5,00<\/td>
              <td>1,67<\/td>
              <td class="o"><b>12<\/b><\/td>
            <\/tr>
            <tr>
              <td class="rh">Харизма<\/td>
              <td>3<\/td>
              <td>5,00<\/td>
              <td>1,67<\/td>
              <td class="o"><b>12<\/b><\/td>
            <\/tr>
            <tr>
              <td class="rh">Эрудиция<\/td>
              <td>6<\/td>
              <td>5,00<\/td>
              <td>0,83<\/td>
              <td class="r"><b>11<\/b><\/td>
            <\/tr>
          <\/table>
          <p class="txt">Разбавление Эрудиция компенсирует шириной: восемнадцать навыков —
  это восемнадцать легальных опорных навыков для заклинаний Материи и огромное число комбинаций для проверок,
  а сумма аспектов Эрудиции входит в лимит Гейсов и в скорость их установки. Высокий одиночный результат
  в Эрудиции обходится дороже, чем в Воле.<\/p>
          <div class="sh3">Потолок одиночного навыка на старте<\/div>
          <p class="txt">Первичное значение ограничено пятью очками, поэтому любой высокий РЗН на старте
  делается только через аспект и характеристику. Вот максимум, который физически достижим, если вложить
  в характеристику весь бюджет молодого персонажа (42 очка, пул Здоровья 7, пул Изнанки 6):<\/p>
          <table class="tb">
            <tr>
              <th>Характеристика<\/th>
              <th>Максимальный РЗН<\/th>
              <th>Сколько свободных очков съедает<\/th>
              <th>Что ограничивает<\/th>
            <\/tr>
            <tr>
              <td class="rh">Восприятие<\/td>
              <td class="g">15<\/td>
              <td>30<\/td>
              <td class="L">Только бюджет: 6 навыков по 5 закрывают характеристику на 5,00.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Харизма<\/td>
              <td class="g">15<\/td>
              <td>42<\/td>
              <td class="L">Весь бюджет без остатка — на остальное очков не остаётся.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Воля<\/td>
              <td class="o">14 <span style="color:var(--dim)">(13 без одаренности)<\/span><\/td>
              <td>15 + пул Изнанки<\/td>
              <td class="L">Аспект Изнанки на старте не поднимается выше 2,00: пул 2–6 очков, не более 3 в навык. Характеристику выше 3,50 не собрать.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Телосложение<\/td>
              <td class="o">14<\/td>
              <td>30 + пул Здоровья<\/td>
              <td class="L">Здоровье заполняется только из своего пула, и он мал (7 очков у молодого).<\/td>
            <\/tr>
            <tr>
              <td class="rh">Эрудиция<\/td>
              <td class="r">12 <span style="color:var(--dim)">(13 от 51 очка)<\/span><\/td>
              <td>весь бюджет<\/td>
              <td class="L">Шесть аспектов: каждый незаполненный утягивает характеристику вниз на одну шестую.<\/td>
            <\/tr>
          <\/table>
          <div class="note"><b>Читать с осторожностью.<\/b> Это верхняя граница «всё в одну характеристику».
  Персонаж с РЗН 15 в одном навыке и нулями во всём остальном провалит любую проверку вне своей темы
  и не соберёт ни одного заклинания выше первой ступени. Рабочая норма старта — два-три навыка с РЗН 8–11
  и широкая середина 4–6.<\/div>
          <div class="sh3">Три приёма, которые стоит использовать сознательно<\/div>
          <ul class="bl">
            <li><b>Заполняйте аспект целиком, если он несущий.<\/b> Третий навык аспекта почти всегда пригодится
        как опорный для заклинания или как второе слагаемое совместной проверки, а его первичные очки
        поднимают РЗН всех трёх.<\/li>
            <li><b>Держите в уме ОД.<\/b> Очки действий считаются от аспекта Самоконтроля, аспекта Моторики и лучшего
        аспекта Восприятия. Это три разные характеристики — то есть боеспособный персонаж обязан держать
        минимум по одному аспекту в Воле, Телосложении и Восприятии. Чистый «кабинетный» эрудит получает
        мало ОД и ходит последним.<\/li>
            <li><b>Не забывайте про Интероцепцию.<\/b> Она нужна для игнорирования боли (Самообладание + Интероцепция
        против Сл 7/11/15) и входит в описание одаренности как интероцептивная регуляция. Одно-два очка
        сюда почти всегда окупаются.<\/li>
          <\/ul>
          <div class="pg-foot">Arbor Echo · Создание персонажа · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s5">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Производные<\/span><span class="title long">Шаг 5 · Вторичные характеристики<\/span>
  <\/div>
            <span class="pgn">6 / 14<\/span>
          <\/div>
          <p class="txt">Их не вводят вручную: лист считает всё сам. Но смотреть на них нужно до того, как распределение
  очков будет окончательно зафиксировано, — потому что именно они определяют, сколько персонаж успевает за раунд,
  сколько магии в него помещается и сколько улучшений выдержит его тело.<\/p>
          <div class="f"><span class="fl">Очки действий (ОД)<\/span> = 2 + Самоконтроль + Моторика + лучший аспект Восприятия<br>
    <span class="fd">Самоконтроль и Моторика — аспекты (Воля и Телосложение), Восприятие — лучший из двух аспектов:
    Дистанционное или Контактное. Формула берёт неокруглённые значения, округляется только итог.<\/span><\/div>
          <div class="f"><span class="fl">Порог биоагрессивности<\/span> = сумма первичных навыков Здоровья + аспект Силы<br>
    <span class="fd">Единственная вторичная характеристика, которая считает сумму первичных значений, а не аспект.
    Следы, написанные в первичные значения Здоровья, снижают порог напрямую.<\/span><\/div>
          <div class="f"><span class="fl">Лимит Платонов<\/span> = Самоконтроль × 5 + Здоровье × 2<br>
    <span class="fl">Скорость восстановления<\/span> = Самоконтроль × 3 + Здоровье Платонов в сутки<br>
    <span class="fl">Дальность поля ауры<\/span> = (аспект Изнанки + аспект Самоконтроля) × текущий запас ÷ максимальный, в метрах<br>
    <span class="fd">Дальность сжимается вместе с запасом: на половине Платонов она ровно вдвое короче.<\/span><\/div>
          <div class="f"><span class="fl">Максимум Гейсов<\/span> = (сумма аспектов Эрудиции и Воли) ÷ 3<br>
    <span class="fl">Время внедрения одного Гейса<\/span> = сумма аспектов Эрудиции и Воли ÷ (РЗН Архитектоники / 2) часов<br>
    <span class="fd">Округление до целых часов, но не меньше одного; при нулевой Архитектонике делитель равен 1.
    Медитацию можно прерывать и продолжать позже; удаление Гейса требует втрое больших усилий — нишу приходится перестраивать заново.<\/span><\/div>
          <div class="sh3">Что это значит за столом<\/div>
          <table class="tb">
            <tr>
              <th style="width:22%">Параметр<\/th>
              <th>Типичный старт<\/th>
              <th>Последствия<\/th>
            <\/tr>
            <tr>
              <td class="rh">ОД<\/td>
              <td class="o">7–9<\/td>
              <td class="L">Определяют порядок хода: ходят по убыванию ОД, при равенстве приоритет у персонажей Игроков. Простые действия стоят 0 ОД, проверки Эрудиции, Харизмы и Восприятия — 1, остальные или сложные — 1–2, совместная проверка — сумму стоимостей задействованных навыков. Неистраченные ОД не переносятся, но переходят в резерв реакций.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Порог биоагрессивности<\/td>
              <td class="o">7–11<\/td>
              <td class="L">Сколько модификаций тело выдержит без последствий. Превышение даёт патологии на сумму превышения и проверку функционирования перед каждой активной заявкой: Сл = 2 + 2 × единиц превышения, чистые 2d6 без навыков и модификаторов.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Лимит Платонов<\/td>
              <td class="o">15–21<\/td>
              <td class="L">Сколько магии помещается в персонажа. Базовый расход заклинания — 1 ОД = 1 Платон, но шаблоны стоят 2–4 Платона, а Телепортация и Ядерный распад — по 4 Платона за единицу массы. Стартовый маг делает несколько серьёзных заклинаний в день, а не в сцену.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Дальность ауры<\/td>
              <td class="o">3–6 м<\/td>
              <td class="L">Заклинание возникает и действует только в пределах ауры. Всё, что дальше, требует Дистанционного контроля, Диффузии, Сонастройки или стигмата как выносной точки границы.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Максимум Гейсов<\/td>
              <td class="o">1–3<\/td>
              <td class="L">Лимит на всего персонажа, а не на заклинание. Баллы Гейсов идут в бросок заклинания и снижают сложность вызова, но сужают множество допустимых применений.<\/td>
            <\/tr>
          <\/table>
          <div class="sh3">Проверьте себя по таблице шансов<\/div>
          <p class="txt">Бросок — 2d6 плюс сумма РЗН участвующих навыков против сложности. Шкала сложностей:
  Простое 5, Стандартное 9, Сложное 13, Экспертное 17, Легендарное 21. Автоматический успех — если
  сложность не превышает РЗН + 5: нет неопределённости, нет броска. Вот сколько нужно на кубах
  и каков шанс это выбросить:<\/p>
          <table class="tb">
            <tr>
              <th>Нужно на 2d6<\/th>
              <td class="dash">2+<\/td>
              <td class="dash">3+<\/td>
              <td class="dash">4+<\/td>
              <td class="dash">5+<\/td>
              <td class="dash">6+<\/td>
              <td class="dash">7+<\/td>
              <td class="dash">8+<\/td>
              <td class="dash">9+<\/td>
              <td class="dash">10+<\/td>
              <td class="dash">11+<\/td>
              <td class="dash">12+<\/td>
            <\/tr>
            <tr>
              <td class="rh">Шанс<\/td>
              <td>100%<\/td>
              <td>97%<\/td>
              <td>92%<\/td>
              <td>83%<\/td>
              <td>72%<\/td>
              <td>58%<\/td>
              <td>42%<\/td>
              <td>28%<\/td>
              <td>17%<\/td>
              <td>8%<\/td>
              <td>3%<\/td>
            <\/tr>
          <\/table>
          <p class="txt">Пользоваться просто: нужное на кубах = сложность − сумма РЗН. Примеры для стартового персонажа:
  РЗН 8 против Сложного (13) — нужно 5+, то есть 83%. РЗН 6 против Сложного — нужно 7+, то есть 58%.
  РЗН 4 против Стандартного (9) — нужно 5+, 83%. Отсюда практическое правило: держите хотя бы три-четыре
  навыка с РЗН 8 и выше, иначе половина бытовых задач партии будет висеть на монетке.<\/p>
          <div class="note"><b>Многонавыковые проверки дороже, чем кажутся.<\/b> Итоговая сложность считается как
  (желаемая − 7) × количество навыков + 7: Сложное (13) на три навыка превращается в 25, Легендарное (21)
  на шесть навыков — в 91. При этом стоимость в ОД равна сумме стоимостей всех задействованных навыков.
  Сложность и ОД растут одновременно, поэтому заявки лучше держать узкими — это стоит отразить и в шаблонах
  действий на шаге 8.<\/div>
          <div class="pg-foot">Arbor Echo · Создание персонажа · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s6">
          <div class="pg-head">
            <div class="hl">
    <span class="k">След Я<\/span><span class="title long">Шаг 6 · Стартовые следы<\/span>
  <\/div>
            <span class="pgn">7 / 14<\/span>
          <\/div>
          <p class="txt">След Я — устойчивое изменение, которое остаётся с персонажем после события. На старте их может
  не быть вовсе, и это нормально. Но от 35 лет они становятся вероятными, от 51 — обязательными, и там этот шаг
  перестаёт быть дополнением: он требуется правилами.<\/p>
          <div class="sh3">Четыре вида стартового следа<\/div>
          <table class="tb">
            <tr>
              <th>Вид<\/th>
              <th>Что даёт<\/th>
              <th>Кому подходит<\/th>
            <\/tr>
            <tr>
              <td class="rh">Травма и её последствие<\/td>
              <td class="L">Штраф к одному из навыков Здоровья и, после тяжёлой травмы, −1 навсегда к специализированному навыку пораженной зоны.<\/td>
              <td class="L">Солдаты, рабочие, врачи фронтовой медицины, любой с опасной профессией.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Патология<\/td>
              <td class="L">Постоянный фон (штрафы) плюс риск обострения в сценах, которые давят на её оси напряжения.<\/td>
              <td class="L">Персонажам 35+; единственный законный источник тёмного стигмата.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Просветление<\/td>
              <td class="L">Малое: +1 к навыку. Фундаментальное: +1 к аспекту. Единственный легальный способ поднять Изнанку в игре.<\/td>
              <td class="L">Тем, кто пережил перелом; на старте — только по согласованию с Мастером.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Модификация<\/td>
              <td class="L">Пассивный бонус 2 × Биоагрессивность на навыки, активная заявка раз в сцену, побочный штраф и триггер, давление на Порог биоагрессивности.<\/td>
              <td class="L">Военным, артелям, слугам Домов. В первой партии лучше не совмещать с магией.<\/td>
            <\/tr>
          <\/table>
          <div class="sh3">Карточка патологии: формат и арифметика<\/div>
          <div class="f"><span class="fl">Степень<\/span> = сумма модулей пассивных штрафов (от 1 до 6)<br>
    <span class="fl">Порог триггера<\/span> = 6 − Степень<br>
    <span class="fl">Обострение срабатывает<\/span>, если сумма оценок по релевантным осям ≥ порога триггера<br>
    <span class="fd">Оси оцениваются от 1 до 3: <b>Нагрузка<\/b> (сцена требует работы поврежденной функции сверх емкости),
    <b>Среда<\/b> (обстановка нарушает условия стабильности), <b>Аффект<\/b> (эмоциональное давление, резонирующее с травмой).
    В карточке задано подмножество осей — считаются только они.
    Мощность кризиса: степень 1–2 → легкая травма, 3–4 → средняя, 5–6 → тяжелая.<\/span><\/div>
          <div class="cards">
            <div class="card">
              <div class="cn">Гангрена · степень 5<\/div>
              <div class="cr"><i>Фон<\/i><span>−1 Здоровье, ограничение функции пораженной зоны (моторика −2 при её использовании)<\/span><\/div>
              <div class="cr"><i>Напряжение<\/i><span>Нагрузка, Среда<\/span><\/div>
              <div class="cr"><i>Порог<\/i><span>6 − 5 = 1: обострение почти неизбежно в любой грязной или тяжёлой сцене<\/span><\/div>
              <div class="cr"><i>Обострение<\/i><span>Разрушение тканей, гной, усиление боли — тяжелая соматическая травма; нужна срочная помощь или ампутация<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Посттравматический тремор · степень 1<\/div>
              <div class="cr"><i>Фон<\/i><span>−1 Точная моторика (дрожь в конечностях)<\/span><\/div>
              <div class="cr"><i>Напряжение<\/i><span>Нагрузка, Аффект<\/span><\/div>
              <div class="cr"><i>Порог<\/i><span>6 − 1 = 5: нужен почти максимальный накал сцены<\/span><\/div>
              <div class="cr"><i>Обострение<\/i><span>Руки выходят из-под контроля, точные манипуляции невозможны — легкая соматическая травма<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Ожирение · степень 2<\/div>
              <div class="cr"><i>Фон<\/i><span>−1 Метаболизм, −1 Выносливость<\/span><\/div>
              <div class="cr"><i>Напряжение<\/i><span>Нагрузка, Среда<\/span><\/div>
              <div class="cr"><i>Порог<\/i><span>6 − 2 = 4<\/span><\/div>
              <div class="cr"><i>Обострение<\/i><span>Одышка, спазм, потеря возможности двигаться — легкая соматическая травма<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Имплантация бредовой системы · степень 1<\/div>
              <div class="cr"><i>Фон<\/i><span>−1 Чтение замысла, +1 Убеждение при навязывании своей системы<\/span><\/div>
              <div class="cr"><i>Напряжение<\/i><span>Нагрузка, Аффект<\/span><\/div>
              <div class="cr"><i>Порог<\/i><span>5<\/span><\/div>
              <div class="cr"><i>Обострение<\/i><span>Утрата контакта с реальностью, интерпретация событий через фиксированную идею — легкая психическая травма<\/span><\/div>
            <\/div>
          <\/div>
          <div class="sh3">Травма как стартовый след: справочные числа<\/div>
          <table class="tb">
            <tr>
              <th>Степень<\/th>
              <th>Штраф к Здоровью<\/th>

              <th>Восстановление<\/th>
              <th>Срочность<\/th>
            <\/tr>
            <tr>
              <td class="rh">Легкая<\/td>
              <td>−1<\/td>
              <td>10<\/td>
              <td>4 дня<\/td>
              <td class="dash">—<\/td>
            <\/tr>
            <tr>
              <td class="rh">Средняя<\/td>
              <td>−2<\/td>
              <td>14<\/td>
              <td>9 дней<\/td>
              <td>4 + Метаболизм раундов<\/td>
            <\/tr>
            <tr>
              <td class="rh">Тяжелая<\/td>
              <td>−3<\/td>
              <td>18<\/td>
              <td>16 дней<\/td>
              <td>2 + Метаболизм раундов; после лечения −1 навсегда<\/td>
            <\/tr>
            <tr>
              <td class="rh">Критическая<\/td>
              <td class="dash">—<\/td>
              <td class="dash">—<\/td>
              <td class="dash">—<\/td>
              <td>Смерть; помочь может только чудо<\/td>
            <\/tr>
          <\/table>
          <ul class="bl">
            <li><b>Локализации<\/b>: Голова → Концентрация; Торс → Выносливость; Руки → Точная моторика;
        Ноги → Общая моторика; Органы чувств → соответствующий навык Восприятия;
        Внутренние органы → дополнительно Здоровье, всегда −1 независимо от степени, и +2 к сложности лечения.<\/li>
            <li><b>Лечение<\/b> — одна проверка лечащего: операция требует его Анатомии и Метаболизма пациента,
        медикаментозное лечение — его Биохимии и Гомеостаза пациента. Провал ухудшает травму.<\/li>
            <li><b>Срок восстановления<\/b> = базовая длительность × коэффициент, где
        коэффициент = 1,5 − (Метаболизм + Гомеостаз + модификатор условий лечения) × 0,05.
        Условия: игнорирование или перегрузка −2, неоптимальный режим −1, нейтральные 0,
        постельный режим и уход +1, специализированная помощь +2. В период восстановления действуют
        штрафы как у легкой травмы.<\/li>
            <li><b>Игнорирование боли<\/b>: Самообладание + Интероцепция против Сл 7 / 11 / 15 по степени.
        Каждая повторная попытка в сцене добавляет +1 к сложности. Штрафы от травмы это не отменяет.<\/li>
          <\/ul>
          <div class="note"><b>Пример расчёта.<\/b> У «Полевого хирурга» из примера ниже Метаболизм 7 и Гомеостаз 6.
  Коэффициент при нейтральных условиях: 1,5 − 13 × 0,05 = 0,85, то есть средняя травма заживает
  за 9 × 0,85 ≈ 8 дней вместо 9, а при специализированной помощи (+2) — за 9 × 0,75 ≈ 7 дней.
  Сильное Здоровье сокращает лечение на дни.<\/div>
          <div class="sh3">Модификация как стартовый след: карточка<\/div>
          <table class="tb">
            <tr>
              <th style="width:24%">Поле<\/th>
              <th>Что писать<\/th>
            <\/tr>
            <tr>
              <td class="rh">Тип<\/td>
              <td class="L">Биологическая (органы, клетки, ДНК, гормоны; в сеттинге исторически получается через Хашаш) или кибернетическая (хирургическая замена частей тела механикой и электроникой).<\/td>
            <\/tr>
            <tr>
              <td class="rh">Биоагрессивность<\/td>
              <td class="L">От 1 до 5: мощность и конфликт с организмом. Каждая единица давит на Порог биоагрессивности.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Бонус<\/td>
              <td class="L">Пассивный: усиливает навыки на сумму, равную удвоенной Биоагрессивности (БА 4 → до +8, распределить по навыкам).<\/td>
            <\/tr>
            <tr>
              <td class="rh">Активная заявка<\/td>
              <td class="L">Уникальное действие, доступное 1 раз за сцену. БА 1–2: нужно совпадение двух жёстких условий, эффект слабый или узкий. БА 3: одно значимое условие. БА 4–5: активируется в любой момент, эффект масштабный или разрушительный.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Штраф<\/td>
              <td class="L">Зеркало силы: минус к навыкам, равный Биоагрессивности. Биомодификации вычитают из первичных значений, кибермодификации — из результирующих.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Триггер<\/td>
              <td class="L">Условие, при котором Игрок обязан озвучить проявление дефекта.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Адаптация<\/td>
              <td class="L">Кибернетические: от нескольких сцен до нескольких дней. Биологические: от нескольких дней до месяцев. В этот период бонусов нет, негативный эффект есть.<\/td>
            <\/tr>
          <\/table>
          <div class="card good" style="margin:2px 0 8px">
            <div class="cn">Пример из книги: Гиперфазная мускулатура<\/div>
            <div class="cr"><i>Тип / БА<\/i><span>Биологическая · 4<\/span><\/div>
            <div class="cr"><i>Бонус<\/i><span>+6 к Атлетике, +2 к Выносливости (всего 8 = 2 × 4)<\/span><\/div>
            <div class="cr"><i>Активная заявка<\/i><span>Физическое действие с «разрушительным» результатом: пробить, сбросить, вытолкнуть. Доступно в любой момент (БА 4–5)<\/span><\/div>
            <div class="cr"><i>Штраф<\/i><span>−2 к Контролю, −2 к Осязанию (всего 4 = БА)<\/span><\/div>
            <div class="cr"><i>Триггер<\/i><span>После активации — средняя травма связок<\/span><\/div>
          <\/div>
          <ul class="bl">
            <li><b>Хашаш как путь к биомодификации.<\/b> Раз в неделю тренировка в состоянии эмоциональной
        нестабильности: проверка Концентрация + Самообладание, сложность 7 + Биоагрессивность желаемой
        модификации и далее +1 с каждым разом. Когда число успехов достигает Биоагрессивности — модификация
        закрепляется. Провал ведёт к наркозависимости без преимуществ и случайным мутациям.<\/li>
            <li><b>Превышение порога.<\/b> Если сумма Биоагрессивностей больше Порога биоагрессивности, Мастер выдаёт
        патологии на величину превышения, связанные с модификацией с наибольшей Биоагрессивностью, и перед каждой
        активной заявкой бросается проверка функционирования: Сл = 2 + 2 × единиц превышения, чистые 2d6.
        Ниже на 1 — не сработало; на 2–3 — заблокировано до ремонта или лечения (Анатомия или Биохимия, Сл 13);
        на 4 и более — тяжелая травма зоны модификации.<\/li>
          <\/ul>
          <div class="sh3">Куда именно писать след: в ИЗН или в ЗС<\/div>
          <p class="txt">Книга формулирует правило так: патологии, просветления, долгосрочные последствия травм
  и биологические модификации применяются к первичным значениям навыков, а немедленные штрафы травм
  и кибернетические модификации — к результирующим. Разница не косметическая: след в первичном значении
  пересчитывает аспект, характеристику, соседние навыки и вторичные характеристики.<\/p>
          <table class="tb">
            <tr>
              <th>Один и тот же штраф −1 Гомеостазу у «Полевого хирурга»<\/th>
              <th>Порог БА<\/th>
              <th>Лимит Платонов<\/th>
              <th>Соседние навыки<\/th>
            <\/tr>
            <tr>
              <td class="rh">Записан в первичное значение (ИЗН 2 → 1)<\/td>
              <td class="r">9 → 8<\/td>
              <td class="r">18 → 17<\/td>
              <td class="L">Аспект Здоровья 2,33 → 2,00, Телосложение 2,11 → 2,00<\/td>
            <\/tr>
            <tr>
              <td class="rh">Записан в значение следа (ЗС −1)<\/td>
              <td class="g">9<\/td>
              <td class="g">18<\/td>
              <td class="L">Ничего, кроме РЗН самого Гомеостаза<\/td>
            <\/tr>
          <\/table>
          <p class="txt">На крупных следах расхождение видно и в бою: −3 Точной моторике, записанные в первичное значение,
  дают ОД 7 и снимают по единице со всех трёх навыков Моторики (Точная 4, Общая 4, Проприоцепция 5);
  те же −3 в ЗС снимают один навык (Точная 5), а ОД остаётся 8 и Проприоцепция держит 6.<\/p>
          <div class="note"><b>Практика.<\/b> На старте разница часто съедается округлением, но на нескольких следах
  и на патологиях высокой степени она накапливается. Заведите привычку спрашивать у Мастера для каждой карточки:
  «это в первичное или в результирующее?» — и писать след в соответствующую колонку листа.
  Бонус к аспекту от фундаментального Просветления автоматический лист не считает вовсе: договоритесь,
  как его вести, до начала игры.<\/div>

        <\/section>
        <section class="page" id="s7">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Магия<\/span><span class="title long">Шаг 7 · Одаренность и магия<\/span>
  <\/div>
            <span class="pgn">8 / 14<\/span>
          <\/div>
          <p class="txt">Магия — самый мощный модуль Arbor Echo, и самый жёстко ограниченный по правилам:
  персонаж либо одарен, либо нет, решает это Мастер, и очками одаренность не покупается.
  Если на шаге 0 вы договорились, что магии в партии нет, пропустите страницу целиком.
  Если есть — вот всё, что нужно, чтобы превратить пул Изнанки в работающего мага.<\/p>
          <div class="sh3">Что даёт одаренность<\/div>
          <ul class="bl">
            <li><b>Отдельный пул Изнанки — 2–6 очков, не более 3 в один навык.<\/b> Это рекомендуемая точка
        отсчёта из Приложения 2; точный размер назначает Мастер. Пул не трогает свободные очки,
        и в него нельзя докладывать из другого бюджета.<\/li>
            <li><b>Один Гейс на стартовое заклинание.<\/b> Без Гейса заклинание конкурирует со всеми прочими
        сопряжениями; Гейс сужает нишу и добавляет баллы в бросок. → ниже<\/li>
            <li><b>Потолок 5 действует и здесь.<\/b> Пул маленький сознательно: стартовый маг владеет
        направлением «на троечку», а не закрывает всю Изнанку.<\/li>
            <li><b>Второй путь в Изнанку — Просветления по ходу игры<\/b> (шаг 6). Одаренность не даёт
        преимущества в их получении: юному просветление брать легко, пожилому — почти невозможно.<\/li>
          <\/ul>
          <div class="sh3">Аспект Изнанки: три навыка — три инструмента<\/div>
          <table class="tb">
            <tr>
              <th style="width:20%">Навык<\/th>
              <th>Что делает<\/th>
              <th style="width:26%">Ключевая формула<\/th>
            <\/tr>
            <tr>
              <td class="rh">Материя<\/td>
              <td class="L">Локальная деформация физического мира: свет, движение, тепло, структура, пространство. Ведущий навык всех заклинаний Материи.<\/td>
              <td class="L">Ведущий шаблона; ступень — от опорных навыков Эрудиции<\/td>
            <\/tr>
            <tr>
              <td class="rh">Менталистика<\/td>
              <td class="L">Хирургия композиций: память, внимание, ценности, перемещение по Изнанке. Ведущий навык всех заклинаний Менталистики.<\/td>
              <td class="L">Ведущий шаблона; мосты — общая травма, ритуал, символ<\/td>
            <\/tr>
            <tr>
              <td class="rh">Архитектоника<\/td>
              <td class="L">Автономные магические конструкты: заклинания связываются в цепь и работают без заклинателя. Хроно-параллакс — одно из проявлений этого навыка: купирование задержки восприятия, когда эффект бьёт по объекту в момент испускания света.<\/td>
              <td class="L">Сл сборки 7 + (Сл ступени − 7) + 2 × (звеньев − 1); глубина, с = 0,25 + 0,25 × РЗН<\/td>
            <\/tr>
          <\/table>
          <div class="sh3">Как устроено заклинание<\/div>
          <ol class="nl">
            <li><b>Ведущий и опорные.<\/b> В шаблоне ведущий навык указан первым: у Материи и Менталистики это одноимённый навык из аспекта Изнанки, у Ауры — первый навык шаблона (Концентрация, Запугивание,
        Самообладание или навык Восприятия).<\/li>
            <li><b>Ступень — от опорных.<\/b> Среднее арифметическое их РЗН задаёт ступень эффекта
        и сложность проверки. Опорные в бросок не входят: к моменту вызова они уже отработали
        как условие сборки шаблона.<\/li>
            <li><b>Бросок.<\/b> 2d6 + РЗН ведущего + баллы Гейсов + модификаторы против сложности ступени.
        Автоматический успех — если сложность не превышает РЗН + 5.<\/li>
            <li><b>Опциональное правило [6]<\/b> (только по общему согласию): +1 к броску за каждые 2 полных
        единицы среднего опорного навыка сверх порога ступени, максимум +2.<\/li>
          <\/ol>
          <table class="tb">

          <\/div>
          <p class="txt">Каждый набросок — точка входа: концепция, два-три события,
  несущие аспекты и ловушка, в которую такой персонаж проваливается чаще всего.
  Цифры не проставлены сознательно — бюджет и возраст вы берёте из шага 2 под свою партию,
  а распределение повторяет шаг 4.<\/p>
          <div class="cards c3">
            <div class="card">
              <div class="cn">Наследник обедневшего рода<\/div>
              <div class="cr"><i>Концепция<\/i><span>«Фамилия осталась, состояние — нет; теперь имя работает на него»<\/span><\/div>
              <div class="cr"><i>События<\/i><span>разорение семьи; протекция в Доме; проигранный суд за родовое имение<\/span><\/div>
              <div class="cr"><i>Несущие<\/i><span>Дипломатия, Лидерство; поддержка — Культурология (История, Визуальная культура)<\/span><\/div>
              <div class="cr"><i>Деталь<\/i><span>1 очко в Обман или Визуальную культуру — самая дешёвая живая мелочь<\/span><\/div>
              <div class="cr"><i>Ловушка<\/i><span>всё в Харизму: ОД 5–6 и провал любой физической сцены. Держите Моторику или Самоконтроль<\/span><\/div>
              <div class="cr"><i>След<\/i><span>связь с Домом — готовый мост в Изнанку (−2 за общий эпизод); без связей дороже всем<\/span><\/div>
            <\/div>
            <div class="card warn">
              <div class="cn">Солдат с модификацией<\/div>
              <div class="cr"><i>Концепция<\/i><span>«Тело перестроили под службу — и служба кончилась»<\/span><\/div>
              <div class="cr"><i>События<\/i><span>фронт; тяжёлая травма и лечение; установка модификации за счёт армии или артели<\/span><\/div>
              <div class="cr"><i>Несущие<\/i><span>Сила, Моторика; поддержка — Самоконтроль и Здоровье (весь пул)<\/span><\/div>
              <div class="cr"><i>Модификация<\/i><span>БА 3–4 (например, гиперфазная мускулатура): бонус 2 × БА, штраф БА, активная заявка раз в сцену<\/span><\/div>
              <div class="cr"><i>Ловушка<\/i><span>Порог БА 7–11 считается от Здоровья: превышение — патологии и проверка функционирования Сл = 2 + 2 × превышение<\/span><\/div>
              <div class="cr"><i>След<\/i><span>старая травма в ИЗН (шаг 6); в первой партии — без магии, как советует книга<\/span><\/div>
            <\/div>
            <div class="card good">
              <div class="cn">Тень<\/div>
              <div class="cr"><i>Концепция<\/i><span>«Читает людей, потому что больше не доверяет им»<\/span><\/div>
              <div class="cr"><i>События<\/i><span>нанят Храмом или Домом; проваленная операция; чужая память, прочитанная не вовремя<\/span><\/div>
              <div class="cr"><i>Несущие<\/i><span>Эмпатия (Чтение замысла, Манипулирование, Актерство); поддержка — Дипломатия, Самоконтроль<\/span><\/div>
              <div class="cr"><i>Магия<\/i><span>если Мастер дал одаренность: Менталистика 3 из пула, остальное — Архитектоника (метки и ловушки); Гейс на Внушение или Считывание<\/span><\/div>
              <div class="cr"><i>Ловушка<\/i><span>без одаренности Изнанка не берётся вовсе — сначала шаг 0, потом билд. Мосты тоже считайте: без общих событий вход в Изнанку дороже<\/span><\/div>
              <div class="cr"><i>След<\/i><span>тёмный стигмат требует действующей патологии, светлый — фундаментального Просветления: не закладывайте их в старт «по желанию»<\/span><\/div>
            <\/div>
          <\/div>
          <div class="sh3">Как пользоваться наброском<\/div>
          <ol class="nl">
            <li>Возьмите концепцию и перепишите её своей фразой — она должна быть узнаваемой без имени.<\/li>

    <span class="k">Подготовка<\/span><span class="title long">0 · Для Мастера: коротко<\/span>
  <\/div>
            <span class="pgn">1 / 12<\/span>
          <\/div>
          <p class="txt"><b>О чём модуль.<\/b> В Ворске, портовом городе альтернативной промышленной эпохи, умерла нейрофизиолог
  Ханна Островская. Полиция закрыла дело как несчастный случай. Но за три дня до смерти она написала письмо
  четырём людям, которые когда-то были связаны с ней. Письмо пришло курьером. В нём просьба не отдавать
  тетради Дому Ланге и поискать «Тень, которая помнит больше».<\/p>
          <p class="txt"><b>Тон.<\/b> Сдержанный детектив, в котором любое вмешательство в чужую память оставляет след.
  Угроза не в монстрах, а в том, что людей меняют: их мысли, воспоминания, привычки.<\/p>
          <div class="sh3">Что нужно понять про систему перед игрой<\/div>
          <p class="txt">Книга правил прямо говорит: Arbor Echo не рассчитан на ваншоты, а механика
  «действие — последствие — изменение» раскрывается в кампании. Поэтому модуль использует три вещи
  из раздела «О ваншотах» (книга, стр. 24):<\/p>
          <ol class="nl">
            <li><b>Спринтовый режим.<\/b> Патологии не используются. Лечение и установка модификаций ускорены.
        Долгосрочные последствия травм не применяются, но немедленные штрафы действуют до лечения.<\/li>
            <li><b>Заранее подготовленные персонажи<\/b> (раздел 2) и <b>карточки травм<\/b> (раздел 7).<\/li>
            <li><b>Магия урезана:<\/b> у одного персонажа два заклинания, без Гейсов, Стигматов и сложной Изнанки.<\/li>
          <\/ol>
          <div class="sh3">Упрощения для ваншота<\/div>
          <p class="txt">Чтобы не тонуть в расчётах, в модуле принято одно правило (его можно заменить на полное,
  см. книгу, стр. 19–21):<\/p>
          <div class="f"><span class="fl">Проверка в ваншоте<\/span> = 2d6 + РЗН ведущего навыка против Сложности<br>
    <span class="fd">Ведущий навык указан в каждой сцене. Второй и третий навыки из шаблонов дают описание
    и обоснование, а не бонус.<\/span><\/div>
          <ul class="bl">
            <li><b>Шкала сложностей:<\/b> Стандартное <b>9<\/b>, Сложное <b>13<\/b>, Экспертное <b>17<\/b>, Легендарное <b>21<\/b>.<\/li>
            <li><b>Критический успех<\/b> — выпавшие две шестёрки (⚅⚅); <b>критический провал<\/b> — результат на 4 и больше ниже Сложности.<\/li>
          <\/ul>
          <div class="sh3">Что подготовить Мастеру<\/div>
          <ul class="chk">
            <li>Прочитать модуль целиком, особенно раздел 1 (Правда) и раздел 4 (сцены).<\/li>
            <li>Распечатать или вывести на экран 4 листа персонажей (раздел 2) и раздаточные материалы (раздел 8).<\/li>
            <li>Подготовить 6–7 карточек травм (раздел 7), нарезать их на отдельные листки.<\/li>
            <li>Для каждого игрока: 2d6, карандаш, листок для заметок. Для Мастера: ширма с таблицами Сложностей и Модификаторов (из «Шпаргалки Мастера»).<\/li>
            <li>Распределить персонажей до начала игры. Игроки выбирают героя, Мастер не меняет распределение без согласия.<\/li>
          <\/ul>

          <div class="sh3">1.1. Что знают игроки (пролог)<\/div>
          <p class="txt">Утром 10 ноября каждый из персонажей получает письмо Ханны (раздел 8, материал 1).
  Персонаж Ворон получает дополнительно личный лист (материал 1б). Все встречаются в читальном зале
  Ворского университета, потому что именно туда письмо просит прийти.<\/p>
          <div class="sh3">1.2. Что знает только Мастер: Правда<\/div>
          <div class="note"><b>Не читайте этот раздел игрокам.<\/b> Здесь собрана полная картина событий до начала сессии.<\/div>
          <p class="txt"><b>Ханна Островская<\/b> (41 год, нейрофизиолог, руководитель лаборатории Б-214) открыла метод,
  который она назвала <b>«отслоением»<\/b>: выделение травматического бассейна из Биографии живой композиции
  и перенос его в пустой. Метод работает только в плотном профиле места, то есть в её лаборатории, где дух места
  ускоряет восстановление и облегчает вход в Изнанку. Она собиралась опубликовать метод в «Вестнике Ворского университета».<\/p>
          <p class="txt"><b>Дом Ланге<\/b> (один из Великих Домов Ворска) хотел монополии. Агент Ильмар Рейн предлагал Ханне
  сорок тысяч талеров и «совместное исследование». Она отказалась. Тогда Рейн использовал ассистента
  <b>Эмиля Гроса<\/b>, которого заранее обработал Внушением.<\/p>
          <div class="sh3">Что случилось ночью 9 ноября (таймлайн)<\/div>
          <table class="tb">
            <tr>
              <th style="width:20%">Время<\/th>
              <th>Событие<\/th>
            <\/tr>
            <tr>
              <td class="rh">22:00<\/td>
              <td class="L">Рейн приходит в Б-214 под видом коллеги. Эмиль уже под Внушением.<\/td>
            <\/tr>
            <tr>
              <td class="rh">22:30<\/td>
              <td class="L">Ханна ловит Эмиля за передачей копии её тетради. Она понимает, что с ним не так.<\/td>
            <\/tr>
            <tr>
              <td class="rh">23:10<\/td>
              <td class="L">Эмиль по команде Рейна толкает Ханну. Она падает с галереи третьего этажа: тяжёлая травма головы, смерть через несколько минут.<\/td>
            <\/tr>
            <tr>
              <td class="rh">23:20<\/td>
              <td class="L">Рейн «очищает» память Эмиля (Фиксация/форматирование). Эмиль помнит только, что шёл домой.<\/td>
            <\/tr>
            <tr>
              <td class="rh">23:40<\/td>
              <td class="L">Умирающая Ханна проводит «отслоение» собственного последнего часа в Изнанке. Её <b>Тень<\/b> (демон, тень субъекта) остаётся в плотном профиле Б-214 и повторяет её последние слова.<\/td>
            <\/tr>
            <tr>
              <td class="rh">00:30<\/td>
              <td class="L">Рейн уходит с пустыми руками. Тетради Ханны, которые она успела спрятать, лежат на Мельнице Ольмера на Излучине.<\/td>
            <\/tr>
            <tr>
              <td class="rh">10 ноября, утро<\/td>
              <td class="L">Тело найдено. Полиция: несчастный случай. Курьер доставляет письма.<\/td>
            <\/tr>
          <\/table>
          <div class="cards">
            <div class="card warn">
              <div class="cn">Что стоит за Тенью<\/div>
              <div class="cr"><i>Природа<\/i><span>Тень Ханны помнит последний час. Она хочет «дописать» статью и будет направлять людей, которые с ней говорят.<\/span><\/div>
              <div class="cr"><i>Мотив<\/i><span>Тень не злая: она образ человека, который наследует его черты, но не его волю.<\/span><\/div>
              <div class="cr"><i>Опасность<\/i><span>Касание оставляет <b>Отпечаток<\/b>: чужую черту, которую игрок начинает отыгрывать как свою.<\/span><\/div>
            <\/div>
            <div class="card warn">
              <div class="cn">Что будет, если ничего не делать<\/div>
              <div class="cr"><i>Тетради<\/i><span>Рейн найдёт тетради на Мельнице (в 21:00 в финальной сцене) и увезёт их в Дом. Метод поступит к Дому.<\/span><\/div>
              <div class="cr"><i>Люди<\/i><span>Тень исчезнет, но Эмиль останется под Внушением, а Ворон получит очередное «отслоение», которое её выбросит.<\/span><\/div>

          <p class="txt">Все четыре листа рассчитаны по правилам книги: 46 свободных очков навыков и 7 очков Здоровья
  (возраст 25–34), у Илвы Ворон ещё 6 очков Изнанки от одарённости. Значения ИЗН / РЗН (первичное и результирующее)
  уже посчитаны. Отыгрыш и предыстория — ориентир, игроки могут дополнять их. Ведущие навыки в шаблонах указаны <b>жирным<\/b>.<\/p>
          <div class="f"><span class="fl">ОД<\/span> = 2 + Самоконтроль + Моторика + лучший аспект Восприятия (округлено) &nbsp;·&nbsp;

          <div class="exhead">2.1. Лиза Ринт, 31 год — архивист и следователь<\/div>
          <p class="txt"><b>Роль:<\/b> исследователь, бывшая аспирантка Ханны, пишет для «Вестника». Её диссертация опиралась
  на работы Ханны, но в последней статье Ринт допустила ошибку, которую до сих пор не исправила.
  <b>Крючок:<\/b> Ханна была её научным руководителем. Ринт винит себя за то, что не ответила на последнее письмо Ханны,
  которое пришло за неделю до смерти.<\/p>

          <div class="exhead">2.2. Доктор Матвей Соллер, 34 года — полевой хирург<\/div>
          <p class="txt"><b>Роль:<\/b> врач городской больницы, который работает с травмами и знает, что такое «отслоение» не из слухов.
  Ханна однажды взяла одного из его пациентов (солдата с психотравмой после бойни на Излучине) и вылечила его.
  Пациент вскоре умер от другой причины, и Соллер до сих пор не знает, была ли связь.
  <b>Крючок:<\/b> Ханна пообещала ему объяснить, что сделала. Он не успел прийти.<\/p>

            <tr>
              <td class="rh o">Ниже на 2–3<\/td>
              <td class="L">Снос в ближайший «бассейн» — Аффект (мысли и вспышки Эмиля). +1 к Сл всех переходов в сцене. Ворон видит, как Эмиль вспоминает свою маму и не может вспомнить, зачем он здесь.<\/td>
            <\/tr>
            <tr>
              <td class="rh r">Ниже на 4+<\/td>
              <td class="L">Снос и Отпечаток: Ворон получает чужую черту Эмиля (например, «всё время оборачивается на звук»). Отыгрывается одной фразой до конца сессии.<\/td>
            <\/tr>
          <\/table>
          <p class="txt"><b>Тень в лаборатории (если Ворон идёт глубже или если игроки долго шумят).<\/b> Тень появляется в Культуре
  (Сл 17 с учётом моста и места: 17 − 2 − 2 = 13). Тень не нападает сразу. Она говорит голосом Ханны:
  «Не публикуйте за меня, я уже все написала.» Если Ворон спрашивает, где тетради, Тень отвечает:
  «Там, где вода делает свою работу.» Это ключ к сцене 4.<\/p>
          <p class="txt"><b>Если Тень замечает игроков:<\/b> лампы гаснут, и в физическом мире один из персонажей получает
  <b>«Информационный перегруз»<\/b> (карточка травм E, раздел 7) после касания Тени (Сл 13, Самообладание, на выбор игрока).
  Так Тень знакомит игроков с тем, как она работает.<\/p>
          <div class="note"><b>Выход из сцены:<\/b> полиция возвращается в здание через 40 минут (игроки видят фонарь на лестнице). Переходите к сцене 3.<\/div>
          <div class="pg-foot">Arbor Echo · «Последний оттиск» · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s4-3">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Сцена 3<\/span><span class="title long">4 · Гостиница «Синяя Ель», номер 14 (1:35–2:05)<\/span>
  <\/div>
            <span class="pgn">7 / 12<\/span>
          <\/div>
          <p class="txt"><b>Место:<\/b> дорогая гостиница на набережной. Номер 14 занимает Ильмар Рейн.<\/p>
          <p class="txt"><b>Приглашение.<\/b> Игроки получают визитку (материал 4) с приглашением в 19:00. Записка не угрожающая,
  но с намёком: «Гарантирую конфиденциальность и вознаграждение.»<\/p>
          <div class="readaloud"><b>Внешность Рейна (читайте вслух):<\/b><br>
  «Ильмар Рейн сидит в кресле у камина. Ему за сорок, одет он дорого, но без вычурности. Перед ним стакан и маленькая
  коробочка из резного дерева, которую он не открывает. Он поднимает руку и предлагает сесть: „Я знаю, кто вы. Знаю,
  что вы получили письмо. Давайте не будем тратить вечер на взаимные обиды.“»<\/div>
          <div class="cards">
            <div class="card">
              <div class="cn">Что он предлагает<\/div>
              <div class="cr"><i>Сделка<\/i><span>Двадцать тысяч талеров тем, кто отдаст «личные записи» Ханны, и гарантию, что Дом Ланге не будет преследовать участников.<\/span><\/div>
              <div class="cr"><i>Позиция<\/i><span>Говорит, что тетради нужны для «продолжения исследований», и делает вид, что не знает о том, что Ханна умерла по его вине.<\/span><\/div>
            <\/div>
            <div class="card warn">
              <div class="cn">Что он скрывает<\/div>
              <div class="cr"><i>Незнание<\/i><span>Рейн не знает, где именно тетради. Он знает, что Эмиль под его контролем и что Тень существует (он видел её однажды в Б-214).<\/span><\/div>
              <div class="cr"><i>Страх<\/i><span>Он боится Тени, поэтому и предлагает деньги, а не угрозы.<\/span><\/div>
            <\/div>
          <\/div>
          <div class="sh3">Варианты взаимодействия<\/div>
          <table class="tb">
            <tr>
              <th style="width:18%">Подход<\/th>
              <th style="width:26%">Навык (ведущий)<\/th>
              <th style="width:10%">Сл<\/th>
              <th style="width:20%">Модификатор речи<\/th>
              <th>Что даёт<\/th>
            <\/tr>
            <tr>
              <td class="rh">Торговаться<\/td>
              <td class="L">Убеждение (Соллер, 3) или Влияние (Ворон, 6)<\/td>
              <td class="o">13 (Сложное)<\/td>
              <td class="L">−1, если аргумент сильный<\/td>
              <td class="L">Рейн поднимает сумму до 25 тысяч, но только за тетради<\/td>
            <\/tr>
            <tr>
              <td class="rh">Угрожать<\/td>
              <td class="L">Запугивание (Тарн, 5)<\/td>
              <td class="o">13<\/td>
              <td class="L">+1 (неблагоприятные условия, Рейн в гостинице с охраной)<\/td>
              <td class="L">Рейн усмехается и говорит: «Вы сильны, пока у вас есть, что терять»<\/td>
            <\/tr>
            <tr>
              <td class="rh">Ловить на лжи<\/td>
              <td class="L">Вывод по жесту (Зрение + Общая моторика + Чтение замысла, 1 ОД)<\/td>
              <td class="g">9<\/td>
              <td class="L">Встречная проверка: Чтение замысла Рейна (9)<\/td>
              <td class="L">Игрок понимает, что Рейн лжёт про Ханну, и что при слове «Излучина» у него дёргается веко<\/td>
            <\/tr>
            <tr>
              <td class="rh">Попросить помощи Тени<\/td>
              <td class="L">Ментальное считывание (Ворон, Сл 13)<\/td>
              <td class="o">13<\/td>
              <td class="L">Встречная: Самообладание Рейна (8)<\/td>
              <td class="L">Ворон видит, что Рейн боится, и образ мельницы в его мыслях (на Излучине)<\/td>
            <\/tr>
          <\/table>
          <div class="sh3">Оговорка Рейна (ключ к сцене 4)<\/div>
          <p class="txt">Если игроки ловят его на лжи или Ворон прочитал его мысли, Рейн ненадолго теряет контроль:
  <b>«Вы думаете, Островская оставила тетради в лаборатории? Глупо. Она всегда говорила, что нужна вода.
  Мельница Ольмера на Излучине — там вода делает свою работу, ха-ха.»<\/b> Потом он спохватывается и смеётся:
  «Не слушайте меня, это хашаш.»<\/p>
          <p class="txt"><b>Если игроки отказываются.<\/b> Рейн уходит, но за игроками следят: в сцене 4 к Мельнице подъедет Рейн лично.<\/p>
          <div class="note"><b>Выход из сцены:<\/b> игроки выходят на улицу. Сверху из окна слышно, как Рейн кричит Эмилю:
  «Завтра в девять. Мельница. Не спите».<br>
  <b>Перерыв (10 минут):<\/b> сделайте паузу перед финальным выездом на Мельницу Ольмера.<\/div>
          <div class="pg-foot">Arbor Echo · «Последний оттиск» · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s4-4">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Сцена 4<\/span><span class="title long">4 · Мельница Ольмера на Излучине (2:15–3:10)<\/span>
  <\/div>
            <span class="pgn">8 / 12<\/span>
          <\/div>
          <p class="txt"><b>Место:<\/b> старая мельница на реке в 40 минутах от города. Колесо не крутилось с 1889 года.
  Водослив, под ним лестница в нишу, где лежат тетради (материал 5). Место <b>пустоши<\/b> (×0,5 восстановления Платонов,
  +1 к сложности входа в Изнанку). Но здесь сильный аффект: за десять лет в окрестностях были несколько смертей
  (этот факт скрыт, его могут найти в архиве, если попросить).<\/p>
          <div class="readaloud"><b>Начало сцены (читайте вслух):<\/b><br>
  «Дождь начинается, когда вы подходите к мельнице. Колесо неподвижно, вода под ним тёмная и гладкая, как зеркало.
  Из окна на втором этаже светит тусклый фонарь. Кто-то поёт внутри, тихо, на одной ноте. Потом песня обрывается,
  и вы слышите ваш собственный голос, который говорит: „Не надо было приходить“.»<\/div>
          <div class="sh3">Что происходит одновременно (три угрозы)<\/div>
          <ol class="nl">
            <li><b>Рейн и два его головореза<\/b> (раздел 5) подъезжают к мельнице через 15 минут после игроков. Они не скрываются.<\/li>
            <li><b>Эмиль<\/b> пришёл раньше. Он внутри, под Внушением, и ищет тетради (он знает, где они, но не помнит зачем).<\/li>
            <li><b>Тень Ханны<\/b> поднимается из водослива и начинает говорить голосом Ханны.<\/li>
          <\/ol>
          <p class="txt"><b>Задача игроков:<\/b> найти тетради (они в нише под водосливом, Сл 9, Точная моторика или Зрение),
  решить, что делать с Эмилем, и не дать Тени забрать кого-то в Изнанку.<\/p>
          <div class="sh3">Бой (упрощённо, 4–6 раундов)<\/div>
          <table class="tb">
            <tr>
              <th style="width:18%">Раунд<\/th>
              <th>Ход событий<\/th>
            <\/tr>
            <tr>
              <td class="rh">Раунд 1<\/td>
              <td class="L">Головорезы входят через дверь мельницы. Порядок хода по ОД (раздел «Механика хода» в книге): Тарн (10) и Соллер (10) первыми, потом Ворон (8), потом остальные. Головорез (ОД 6) атакует кулаком или ножом.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Раунд 2<\/td>
              <td class="L">Эмиль (под Внушением) подходит к Ринт и требует тетради. Ринт может попытаться поговорить с ним: <b>Убеждение<\/b> против Внушения. Сл 14 (Средняя психотравма), модификатор речи по обстоятельствам (раздел 7).<\/td>
            <\/tr>
            <tr>
              <td class="rh">Раунд 3<\/td>
              <td class="L">Тень касается ближайшего персонажа. Касание — Средний урон (карточка травмы E «Информационный перегруз», если попали в психику, или B «Ушиб рёбер», если физически).<\/td>
            <\/tr>
            <tr>
              <td class="rh">Раунд 4 и далее<\/td>
              <td class="L">Тень отступает в водослив, если хоть одна тетрадь горит или если Ворон проводит Расцепление (Самообладание Сл 13, см. «Отпечаток» в разделе «Работа с Изнанкой»).<\/td>
            <\/tr>
          <\/table>
          <div class="sh3">Тень в бою (краткие механики)<\/div>
          <div class="cards c3">
            <div class="card warn">
              <div class="cn">Голос<\/div>
              <div class="cr"><i>Частота<\/i><span>Раз в раунд одному игроку: «Дочитай за меня.»<\/span><\/div>
              <div class="cr"><i>Бросок<\/i><span>2d6 + 7 против Самообладания игрока<\/span><\/div>
              <div class="cr"><i>Провал<\/i><span>Игрок тратит 1 ОД на «дописывание» (бессмысленное действие)<\/span><\/div>
            <\/div>
            <div class="card warn">
              <div class="cn">Касание<\/div>
              <div class="cr"><i>Атака<\/i><span>2d6 + 8 против Уклонения игрока<\/span><\/div>
              <div class="cr"><i>Эффект<\/i><span>Средний урон и <b>Отпечаток<\/b> (черта Ханны: «считает вдохи», «не отвечает, если не спросили дважды»)<\/span><\/div>
              <div class="cr"><i>Длительность<\/i><span>Отыгрывается до конца сессии<\/span><\/div>
            <\/div>
            <div class="card good">
              <div class="cn">Уязвимость<\/div>
              <div class="cr"><i>Огонь<\/i><span>Тень слабеет, если в неё попадает огонь (тетрадь, керосин из лампы)<\/span><\/div>
              <div class="cr"><i>Магия<\/i><span>Расцепление (Ворон, Самообладание Сл 13)<\/span><\/div>
              <div class="cr"><i>Исход<\/i><span>При сгорании всех 3 тетрадей или Расцеплении уходит с голосом: «Спасибо.»<\/span><\/div>
            <\/div>
          <\/div>
          <p class="txt"><b>Если Рейн появляется в бою<\/b> (он выходит из машины в конце раунда 3): он не сражается сам,
  а командует головорезами и держит Ринт или Соллера на прицеле (Запугивание 7 против Самообладания).
  Он предлагает сделку: тетради в обмен на жизнь.<\/p>
          <div class="note"><b>Выход из сцены:<\/b> либо тетради у игроков, либо Рейн уезжает с одной из тетрадей
  (тогда в финале он будет использовать её). Переходите к сцене 5.<\/div>
          <div class="pg-foot">Arbor Echo · «Последний оттиск» · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s4-5">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Сцена 5<\/span><span class="title long">4 · Финал: выбор и Эпилог (3:10–3:50)<\/span>
  <\/div>
            <span class="pgn">9 / 12<\/span>
          <\/div>
          <p class="txt"><b>Место:<\/b> мельница, после боя. Дождь прекратился. Тетради лежат на столе, или Рейн держит одну из них.<\/p>
          <p class="txt"><b>Вопрос к игрокам:<\/b> что делать с методом «отслоения»? Игроки выбирают один из четырёх вариантов.
  Каждый имеет последствия, которые Мастер описывает в эпилоге.<\/p>
          <table class="tb">
            <tr>
              <th style="width:18%">Вариант<\/th>
              <th style="width:26%">Что нужно сделать<\/th>
              <th style="width:28%">Что получает группа<\/th>
              <th>Цена<\/th>
            <\/tr>
            <tr>
              <td class="rh">А. Опубликовать<\/td>
              <td class="L">Передать тетради редактору «Вестника» (Харизма: Влияние, Сл 13 или Убеждение, Сл 13). Если тетради у Рейна — отбить их.<\/td>
              <td class="L">Метод становится публичным. Лаборатории по всему Ворску начинают его проверять. Монополия Дома рушится.<\/td>
              <td class="L">Метод не воспроизводится за пределами плотного профиля. Первые эксперименты проваливаются, и учёных обвиняют в шарлатанстве. Дом Ланге объявляет группу «врагами».<\/td>
            <\/tr>
            <tr>
              <td class="rh">Б. Передать Дому Ланге<\/td>
              <td class="L">Согласиться на сделку Рейна.<\/td>
              <td class="L">25 тысяч талеров на всех, амнистия для Ринт за статью.<\/td>
              <td class="L">Метод становится инструментом для «слуг» Дома. Тень исчезает, Эмиль остаётся под Внушением (Дом его заберёт). Соллер не простит себе этого.<\/td>
            <\/tr>
            <tr>
              <td class="rh">В. Уничтожить<\/td>
              <td class="L">Сжечь все тетради. Тень сгорает вместе с ними.<\/td>
              <td class="L">Никто не может использовать метод.<\/td>
              <td class="L">Эмиль остаётся с Внушением (лечение Сл 14, если игроки не сделали этого в сцене 4). Один из персонажей (по выбору игрока) забывает последний час Ханны, потому что в огне исчезла связь с Тенью.<\/td>
            <\/tr>
            <tr>
              <td class="rh">Г. Принять Отпечаток<\/td>
              <td class="L">Ворон или Соллер касается Тени и берёт её последнюю мысль.<\/td>
              <td class="L">Персонаж получает метод в голове: в эпилоге он может провести отслоение один раз (без механики, по решению Мастера).<\/td>
              <td class="L">Тень не умирает: она продолжает жить в персонаже, и через год его поведение начнёт меняться (отыгрывается в эпилоге).<\/td>
            <\/tr>
          <\/table>
          <div class="f"><span class="fl">Если игроки не могут решить<\/span><br>
    Тень сама говорит голосом Ханны: <b>«Выбирайте за меня, я устала».<\/b><\/div>
          <div class="sh3">Эпилог (3:35–3:50)<\/div>
          <p class="txt">Каждый игрок в одном предложении рассказывает, что стало с его персонажем через год.
  Мастер добавляет одну деталь от Дома Ланге, «Вестника» или Тени. Если выбран вариант В или Г,
  эпилог короче, но с тем же вопросом: <b>кто помнит Ханну?<\/b><\/p>
          <div class="pg-foot">Arbor Echo · «Последний оттиск» · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div>
        <\/section>
        <section class="page" id="s5">
          <div class="pg-head">
            <div class="hl">
    <span class="k">Справочник Мастера<\/span><span class="title long">5 · Персонажи-НПС и 6 · Сводка улик<\/span>
  <\/div>
            <span class="pgn">10 / 12<\/span>
          <\/div>
          <p class="txt">Значения НПС — ориентиры для быстрого старта (2d6 + РЗН ведущего навыка против Сложности, как в разделе 0).<\/p>
          <div class="cards">
            <div class="card warn">
              <div class="cn">Ильмар Рейн · агент Дома Ланге, 48 лет<\/div>
              <div class="cr"><i>Роль<\/i><span>Уполномоченный по контрактам, менталист средней силы<\/span><\/div>
              <div class="cr"><i>Навыки (РЗН)<\/i><span>Чтение замысла 9 · Убеждение 8 · Обман 8 · Самообладание 8 · Запугивание 7 · Менталистика 4 (только Внушение, 1 раз за сцену, Сл 13)<\/span><\/div>
              <div class="cr"><i>Слабость<\/i><span>Хашаш (при стрессе дрожат руки; если спросили про Мельницу — оговаривается)<\/span><\/div>
              <div class="cr"><i>Цель<\/i><span>Тетради любой ценой<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Эмиль Грос · ассистент Ханны, 26 лет<\/div>
              <div class="cr"><i>Роль<\/i><span>Бывший ассистент, сейчас под Внушением<\/span><\/div>
              <div class="cr"><i>Навыки (РЗН)<\/i><span>Концентрация 6 · Анатомия 6 · Точная моторика 5 · Нож (Средний урон, 2d6 + 5)<\/span><\/div>
              <div class="cr"><i>Состояние<\/i><span>При провале встречной Сл 14 отпускает тетради и падает в обморок. Он не злодей: он жертва<\/span><\/div>
            <\/div>

          <div class="sh3">Материал 1. Письмо Ханны (для всех)<\/div>
          <div class="readaloud">Коллеги,<br>
  Если вы получили это письмо, значит, я уже не смогу объяснить всё лично. Я нашла то, что Дом Ланге ищет уже три года:
  способ отслоить бассейн воспоминания от живой композиции. Не боль, которую можно заглушить, а ту, что держит человека в петле.
  Метод работает только в Б-214, где дух места собран плотнее, чем в любом другом месте города.<br>
  Ильмар Рейн предлагает за него сорок тысяч талеров и «совместное исследование». Я отказала. Сегодня ночью Эмиль был в лаборатории.
  Он вёл себя не как Эмиль.<br>
  Мои тетради спрятаны там, где вода делает свою работу. Не отдавайте их Дому. Опубликуйте, если сможете. Если нет — сожгите.<br>
  <b>Ханна Островская<\/b> &nbsp;·&nbsp; <i>P.S. Спросите у Тени. Она помнит больше, чем я.<\/i><\/div>
          <div class="cards">
            <div class="card">
              <div class="cn">Материал 1б. Личный лист для Илвы Ворон<\/div>
              <div class="cr"><i>Текст<\/i><span>«Илва, тогда, после пожара, я сделала то, чего не должна была делать. Я хотела, чтобы ты помнила меньше. Я не знаю, что из этого вышло, и теперь боюсь, что ты должна вспомнить всё. Если придёт человек в сером пальто — не называй меня по имени. Он уже знает. Х.»<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Материал 2. Полицейский протокол (выдержка)<\/div>
              <div class="cr"><i>Дело № 418/10<\/i><span>Островская Ханна, 41 год. Обнаружена 10 ноября в 06:40 в лаборатории Б-214 (корпус Б, третий этаж). Причина смерти: черепно-мозговая травма при падении с галереи. Следов взлома не обнаружено. Свидетель Грос Э. (ассистент) сообщает о частичной потере памяти за период с 22:00 по 00:00 9 ноября. Дело закрыто как несчастный случай.<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Материал 3. Выписки из тетради Ханны<\/div>
              <div class="cr"><i>Лаборатория<\/i><span>«Отслоение. Шаг 1. Найти бассейн. Не образ, а повтор: то, к чему человек возвращается снова и снова. Шаг 2. Собрать границу вокруг бассейна. Не касаться соседних. Если коснёшься — бассейн растёт вместе с тобой. Шаг 3. Перенос в пустой бассейн возможен только через Культуру. Без проводника нельзя — Тень всегда читает последнее. Если ты читаешь это, значит, Эмиль вспомнил не то.»<\/span><\/div>
            <\/div>
            <div class="card">
              <div class="cn">Материал 4. Визитка Ильмара Рейна<\/div>
              <div class="cr"><i>Текст<\/i><span><b>Ильмар Рейн<\/b> · Управление контрактами Дома Ланге. Приглашаю вас сегодня в 19:00 в «Синюю Ель», номер 14. Гарантирую конфиденциальность и вознаграждение. <i>Не ходите на Излучину. Там сыро.<\/i> (Последняя строка — случайная фраза Рейна, подсказка для сцены 4.)<\/span><\/div>
            <\/div>
          <\/div>
          <div class="card good" style="margin:2px 0 6px">
            <div class="cn">Материал 5. Карта Излучины (текстом)<\/div>
            <div class="cr"><i>Описание<\/i><span>Мельница Ольмера стоит на Излучине, в сорока минутах от города по старой дороге вдоль реки. Колесо не крутилось с 1889 года. Водослив под колесом. За ним в каменной нише лежит деревянный ящик с тетрадями, обёрнутый в клеёнку. Чтобы его достать, нужно спуститься по лестнице под водосливом (Сл 9: Точная моторика или Зрение, чтобы не сорваться).<\/span><\/div>
