          <div class="sh3" id="s9">9. Адаптация и советы Мастеру<\/div>
          <ul class="bl">
            <li><b>Три игрока.<\/b> Уберите одного головореза. Тень может говорить с одним игроком чаще. Эмиля станет легче уговорить (Сл 13).<\/li>
            <li><b>Пять игроков.<\/b> Добавьте второго полицейского в архив или рабочего на мельнице, который может предать (Запугивание, Сл 9). Не добавляйте персонажей с магией: это нарушит баланс ваншота.<\/li>
            <li><b>Если игроки хотят марафон.<\/b> Включите патологии: Тень может оставить Отпечаток, который через две сессии станет патологией (правила книги, стр. 8–9). Отмените спринтовый режим и добавьте 10-дневный интервал до следующей сессии.<\/li>
            <li><b>Если не нравится хоррор.<\/b> Уберите голос Тени и оставьте Ханну только в письмах.<\/li>
            <li><b>Не давите на Ворон.<\/b> Это персонаж с самым личным крючком. Дайте ей право не входить в Изнанку, если она не хочет (тогда сцена 2 идёт без Тени, а Правда раскрывается через Соллера и Ойгена).<\/li>
            <li><b>Обсудите границы заранее.<\/b> Тема насилия над памятью и телом может быть тяжёлой. Спросите игроков, есть ли темы, которые лучше не поднимать (например, пожары, смерти детей). Перед игрой напишите это на доске.<\/li>

                if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
                var mk = document.createElement('mark');
                mk.className = HIT;
                mk.textContent = m[0];
                frag.appendChild(mk);
                hits.push(mk);
                last = m.index + m[0].length;
              }
              if (frag) {
                if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
                node.parentNode.replaceChild(frag,node);
              }
            });
            if (hits.length) go(0);
            else report();
          }
          document.addEventListener('click', function (e) {
            var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            if (!a) return ;
            var h = a.getAttribute('href') || '';
            if (/^(https?:|mailto:|tel:|javascript:|data:|blob:)/i.test(h)) return ;
            e.preventDefault();
            if (h.charAt(0) === '#') {
              if (h.length < 2) return ;
              var el = null;
              try {
                el = document.getElementById(h.slice(1));
              } catch (err){}
              if (el && el.scrollIntoView) el.scrollIntoView({behavior: 'smooth',block: 'start',inline: 'start'});
              return ;
            }
            var p = h.split(/[?#]/)[0];
            if (!/\.html?$/i.test(p)) return ;
            post({__aeNav: p.split('/').pop()});
          },
          true);
          window.addEventListener('message', function (e) {
            var d = e.data;
            if (!d || typeof d !== 'object' || typeof d.__aeFind !== 'string') return ;
            if (d.__aeStep && hits.length) go(idx + d.__aeStep);
            else search(d.__aeFind);
          });
        }
        var BOOT = '<script>(' + boot.toString() + ')();<\/script>';
        function withBoot(html) {
          var i = html.search(/<\/body\s*>/i);
          return i >= 0 ? html.slice(0,i) + BOOT + html.slice(i) : html + BOOT;
        }
        function mount(key) {
          var f = frame(key);
          if (!f || f.dataset.mounted) return f;
          f.srcdoc = withBoot(source(key));
          f.dataset.mounted = '1';
          return f;
        }
        function show(key,skipHash) {
          var meta = known(key);
          if (!meta) {
            key = 'guide';
            meta = known('guide');
          }
          mount(key);
          current = key;
          var f = frame(key);
          iframes.forEach( function (x) {
            x.classList.toggle('active',x === f);
          });
          buttons.forEach( function (b) {
            b.classList.toggle('active',b.dataset.key === key);
          });
          document.title = 'Arbor Echo — ' + meta.title;
          find('',0);
          qEl.value = '';
          lastQ = '';
          if (!skipHash) {
            var h = '#' + key;
            if (location.hash !== h) location.hash = h;
          }
        }
        DOCS.forEach( function (d) {
          var b = document.createElement('button');
          b.textContent = d.title;
          b.dataset.key = d.key;
          b.addEventListener('click', function () {
            show(d.key);
          });
          nav.appendChild(b);
          buttons.push(b);
        });
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d || typeof d !== 'object') return ;
          var src = null;
          iframes.forEach( function (f) {
            if (f.contentWindow === e.source) src = f;
          });
          if (!src) return ;
          if (d.__aeNav) {
            var name = String(d.__aeNav);
            try {
              name = decodeURIComponent(name);
            } catch (err){}
            var key = byFile[name.toLowerCase()];
            if (key) show(key);
            return ;
          }
          if (d.__aeHits !== undefined && src.dataset.key === current) {
            var n = d.__aeHits | 0;
            setCount(n ? ((d.__aeIdx | 0) + 1) + '/' + n : '');
          }
        });
        var lastQ = '',timer = null;
        function setCount(t) {
          cntEl.textContent = t || '';
        }
        function find(q,step) {
          var f = frame(current);
          if (!f || !f.contentWindow) {
            setCount('—');
            return ;
          }
          try {
            f.contentWindow.postMessage({__aeFind: q,__aeStep: step || 0},'*');
          } catch (err) {
            setCount('—');
          }
        }
        qEl.addEventListener('input', function () {
          clearTimeout(timer);
          timer = setTimeout( function () {
            lastQ = qEl.value.trim();
            find(lastQ,0);
          },
          350);
        });
        qEl.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(timer);
            var v = qEl.value.trim();
            if (v !== lastQ) {
              lastQ = v;
              find(v,0);
            } else find(v,e.shiftKey ? -1 : 1);
          } else if (e.key === 'Escape') {
            clearTimeout(timer);
            qEl.value = '';
            lastQ = '';
            find('',0);
            setCount('');
          }
        });
        window.addEventListener('hashchange', function () {
          var k = (location.hash || '').replace('#','');
          if (k !== current) show(k,true);
        });
        var start = (location.hash || '').replace('#','');
        show(known(start) ? start : 'guide',true);
      })();
    </script>
  </body>
</html>
