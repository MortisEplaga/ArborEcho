:10px;color:var(--text);opacity:.88;line-height:1.35}.cc-note{font-family:var(--body);font-size:10px;font-style:italic;color:var(--dim);margin-top:1px}.mh{font-family:var(--head);font-size:9.5px;color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin:5px 0 3px}.note{font-style:italic;color:var(--dim);font-size:10px;margin-top:2px;padding-left:6px;border-left:2px solid var(--border);line-height:1.4}.tag{display:inline-block;font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.1em;padding:1px 4px;border-radius:2px}.tg-react{background:rgba(74,144,128,.3);color:var(--teal);border:1px solid rgba(74,144,128,.5)}.tg-prep{background:rgba(200,168,75,.2);color:var(--yellow);border:1px solid rgba(200,168,75,.4)}hr{border:0;border-top:1px solid var(--border);margin:4px 0}.pg-foot{margin-top:auto;padding-top:4px;border-top:1px solid var(--border);font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.1em;text-align:center}.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.sp{background:var(--bg3);border:1px solid var(--border);padding:4px 6px;border-radius:2px}.sp.au{border-left:3px solid var(--teal)}.sp.ma{border-left:3px solid var(--orange)}.sp.iz{border-left:3px solid #7060a0}.sp-name{font-family:var(--head);font-size:10px;color:var(--gold);margin-bottom:2px}.sp-cost{font-family:var(--mono);font-size:9px;color:var(--dim);margin-bottom:1px}.sp-cost .od{color:var(--green)}.sp-cost .pl{color:var(--teal)}.sp-sk{font-family:var(--mono);font-size:9.5px;color:var(--text);opacity:.85;line-height:1.3}.sp-d{font-family:var(--body);font-size:9.5px;font-style:italic;color:var(--dim);margin-top:1px}@media print{body{background:#fff}.page{width:210mm;height:297mm;margin:0;page-break-after:always;padding:8mm;background:#fff;color:#000;border:0}.pg-head .title{color:#000;text-shadow:none}.p{border-color:#bbb;background:#f9f9f9}.f{border-left-color:#555;background:#f0f0f0;color:#000}th{background:#e8e8e8;color:#000}.pg-foot{border-top-color:#ccc}.sp,.cc{background:#f2f2f2}}@media print{.page:last-of-type{page-break-after:auto}}@media print{body{display:block;height:auto;overflow:visible;padding:0;gap:0}.jump{display:none !important}.deck{display:block;overflow:visible;height:auto;padding:0}.page{zoom:1 !important;height:auto;min-height:297mm !important;margin:0 auto 14px;overflow:visible}}@page{margin:0;size:A4}html::-webkit-scrollbar,*::-webkit-scrollbar{width:10px;height:10px}html::-webkit-scrollbar-track,*::-webkit-scrollbar-track{background:#0d100b}html::-webkit-scrollbar-thumb,*::-webkit-scrollbar-thumb{background:#354533;border:2px solid #0d100b;border-radius:0}html::-webkit-scrollbar-thumb:hover,*::-webkit-scrollbar-thumb:hover{background:#c8a84b}html::-webkit-scrollbar-corner,*::-webkit-scrollbar-corner{background:#0d100b}html,*{scrollbar-width:thin;scrollbar-color:#354533 #0d100b}<\/style><\/head><body><nav class="jump"><a href="#p1">1 · Сложности &amp; Модификаторы<\/a><a href="#p2">2 · Бой &amp; Шаблоны действий<\/a><a href="#p3">3 · Травмы · Лечение · Патологии<\/a><a href="#p4">4 · Магия · Гейсы · Стигматы<\/a><a href="#p5">5 · Изнанка · Цепи · Платонный профиль<\/a><\/nav><div class="deck"><div class="page" id="p1"><div class="pg-head"><div><span class="title">Arbor Echo<\/span><span class="sub" style="margin-left:14px">Шпаргалка Мастера<\/span><\/div><span class="sub">Сложности &amp; Модификаторы<\/span><span class="pgn">1 / 5<\/span><\/div><div class="row"><div class="col"><div class="p"><div class="st">Шкала сложности<\/div><table><tr><th class="L">Уровень<\/th><th>Сл.<\/th><th class="L">Описание<\/th><\/tr><tr><td class="L c1">Простое<\/td><td class="c1">5<\/td><td class="L">Базовая подготовка<\/td><\/tr><tr><td class="L c2">Стандартное<\/td><td class="c2">9<\/td><td class="L">Требует концентрации<\/td><\/tr><tr><td class="L c3">Сложное<\/td><td class="c3">13<\/td><td class="L">Опытный специалист<\/td><\/tr><tr><td class="L c4">Экспертное<\/td><td class="c4">17<\/td><td class="L">Только мастер дела<\/td><\/tr><tr><td class="L c5">Легендарное<\/td><td class="c5">21<\/td><td class="L">Гарантий нет<\/td><\/tr><\/table><div class="mh" style="margin-top:6px">Автоматический успех<\/div><div class="f"><span class="lbl">Условие<\/span><span class="eq">Сложность ≤ Результирующий навык + 5<\/span><\/div><div class="note">Нет неопределенности — нет броска.<\/div><div class="mh" style="margin-top:6px">Многонавыковая сложность<\/div><div class="f"><span class="lbl">Формула<\/span><span class="eq">= (Желаемая − 7) × N навыков + 7<\/span><\/div><div class="note">Пример: Сложное (13) на 3 навыка → (13−7)×3+7 = <strong style="color:var(--yellow)">25<\/strong><\/div><div class="mh" style="margin-top:6px">Стоимость ОД<\/div><table><tr><th class="L">Тип действия<\/th><th>ОД<\/th><\/tr><tr><td class="L">Простое (осмотреться, крикнуть…)<\/td><td>0<\/td><\/tr><tr><td class="L">Эрудиция / Харизма / Восприятие<\/td><td>1<\/td><\/tr><tr><td class="L">Тело / Воля — простые<\/td><td>1<\/td><\/tr><tr><td class="L">Тело / Воля — сложные<\/td><td>2<\/td><\/tr><tr><td class="L">Совместная проверка<\/td><td class="L c0">сумма стоимостей навыков<\/td><\/tr><\/table><div class="mh" style="margin-top:6px">Базовые формулы<\/div><div class="f"><span class="lbl">Очки действий<\/span><span class="eq">= 2 + Самоконтроль + Моторика + лучший аспект Восприятия<\/span><\/div><div class="f"><span class="lbl">Порог биоагрессивности<\/span><span class="eq">= Сумма ИЗН навыков Здоровья + Аспект Силы<\/span><\/div><\/div><\/div><div class="col"><div class="p"><div class="st">Результат броска (2d6 + сумма РЗН навыков vs. Сложность)<\/div><table><tr><th class="L">Исход<\/th><th>Разница<\/th><th class="L">Эффект<\/th><\/tr><tr class="rs-cs"><td class="L">⚡ Критический успех<\/td><td>⚅⚅ на кубах<\/td><td class="L">Мастер может дать однократный автоуспех (Игрок поясняет, что произошло)<\/td><\/tr><tr class="rs-s"><td class="L">✓ Успех<\/td><td>≥ 0<\/td><td class="L">Цель достигнута полностью<\/td><\/tr><tr class="rs-p"><td class="L">~ Частичный успех<\/td><td>−1<\/td><td class="L">Цель с осложнением / компромисс<\/td><\/tr><tr class="rs-f"><td class="L">✗ Провал<\/td><td>−2 / −3<\/td><td class="L">Неудача<\/td><\/tr><tr class="rs-cf"><td class="L">💀 Критический провал<\/td><td>−4 и ниже<\/td><td class="L">Неудача + серьезные осложнения<\/td><\/tr><\/table><div class="note">Встречная проверка: оба бросают; разница — степень провала проигравшего.<\/div><div class="mh" style="margin-top:6px">Приоритет хода в раунде (~5 сек)<\/div><table><tr><th>1й<\/th><th>2й<\/th><th>3й<\/th><th>4й<\/th><th>5й<\/th><\/tr><tr><td>Очевидность: чья заявка логичнее вытекает из ситуации<\/td><td>Больше ОД<\/td><td>ПК &gt; НИП при равных ОД<\/td><td>Первый озвучил заявку<\/td><td>Встречная проверка<\/td><\/tr><\/table><div class="note">Неиспользованные ОД не переносятся, но переходят в резерв реакций.<\/div><\/div><\/div><\/div><div class="p"><div class="st">Матрица итоговой сложности: (Желаемая − 7) × N + 7<\/div><table><thead><tr><th class="L" style="min-width:115px">Желаемая сложность<\/th><th>1 навык<\/th><th>2 навыка<\/th><th>3 навыка<\/th><th>4 навыка<\/th><th>5 навыков<\/th><th>6 навыков<\/th><\/tr><\/thead><tbody><tr><td class="rh">5 — Простое<\/td><td class="c1">5<\/td><td class="c0">—<\/td><td class="c0">—<\/td><td class="c0">—<\/td><td class="c0">—<\/td><td class="c0">—<\/td><\/tr><tr><td class="rh">9 — Стандартное<\/td><td class="c2">9<\/td><td class="c3">11<\/td><td class="c3">13<\/td><td class="c4">15<\/td><td class="c4">17<\/td><td class="c5">19<\/td><\/tr><tr><td class="rh">13 — Сложное<\/td><td class="c3">13<\/td><td class="c4">19<\/td><td class="c5">25<\/td><td style="color:#d46050">31<\/td><td style="color:#c84030">37<\/td><td style="color:#c04030">43<\/td><\/tr><tr><td class="rh">17 — Экспертное<\/td><td class="c4">17<\/td><td style="color:#d46050">27<\/td><td style="color:#c84030">37<\/td><td style="color:#c03030">47<\/td><td style="color:#b02828">57<\/td><td style="color:#b02828">67<\/td><\/tr><tr><td class="rh">21 — Легендарное<\/td><td class="c5">21<\/td><td style="color:#c84030">35<\/td><td style="color:#c03030">49<\/td><td style="color:#b02828">63<\/td><td style="color:#a02020">77<\/td><td style="color:#a02020">91<\/td><\/tr><\/tbody><\/table><div class="note">— Простое действие возможно только с одним навыком &nbsp;|&nbsp; Желтый = достижимо &nbsp;|&nbsp; Оранжевый = очень трудно &nbsp;|&nbsp; Красный = практически невозможно без Гейсов / бонусов<\/div><\/div><div class="p"><div class="st">Модификаторы <span style="color:var(--dim);font-size:8.5px;font-weight:normal">— применяются один раз к итоговой сложности проверки<\/span><\/div><table><tr><th style="width:30px">Мод<\/th><th class="L">Условия среды<\/th><th class="L">Социальные сцены<\/th><th class="L">Расследование<\/th><th class="L">Роль персонажа<\/th><th class="L">Экипировка<\/th><\/tr><tr><td class="c1">−2<\/td><td class="L">Идеальные<\/td><td class="L">Выдающаяся речь<\/td><td class="L">Очевидная зацепка<\/td><td class="L">Яркое попадание в образ<\/td><td class="L">Идеальный инструмент<\/td><\/tr><tr><td style="color:#88aa70">−1<\/td><td class="L">Благоприятные<\/td><td class="L">Убедительная речь<\/td><td class="L">Нестандартное применение<\/td><td class="L">Логичное для образа<\/td><td class="L">Подходящий инструмент<\/td><\/tr><tr><td class="c0">0<\/td><td class="L">Нейтральные<\/td><td class="L">Нейтральная речь<\/td><td class="L">Частично скрытая инфо<\/td><td class="L">Нейтрально<\/td><td class="L">Пригодный<\/td><\/tr><tr><td style="color:#c08050">+1<\/td><td class="L">Неблагоприятные<\/td><td class="L">Слабая аргументация<\/td><td class="L">Вывод из нескольких гипотез<\/td><td class="L">Спорная заявка<\/td><td class="L">Не по назначению<\/td><\/tr><tr><td class="c5">+2<\/td><td class="L" style="white-space:nowrap">Крайне неблагоприятные<\/td><td class="L">Нелепая, противоречивая речь<\/td><td class="L">Реконструкция по неполным данным<\/td><td class="L">Полностью выбивается из образа<\/td><td class="L">Едва пригоден<\/td><\/tr><\/table><\/div><div class="pg-foot">Arbor Echo · Шпаргалка Мастера · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="p2"><div class="pg-head"><div><span class="title">Arbor Echo<\/span><span class="sub" style="margin-left:14px">Шпаргалка Мастера<\/span><\/div><span class="sub">Бой &amp; Шаблоны действий<\/span><span class="pgn">2 / 5<\/span><\/div><div class="p"><div class="st">Базовые степени урона источников<\/div><table><tr><th class="L sl" style="width:22%">Легкий<\/th><th class="L sm" style="width:28%">Средний<\/th><th class="L sh" style="width:28%">Тяжелый<\/th><th class="L sc" style="width:22%">Критический<\/th><\/tr><tr><td class="L sl">Удары кулаками, толчки, брошенные камни<\/td><td class="L sm">Нож, кастет, малокалиберный пистолет, небольшие ожоги, падение 2–3 м, серная кислота<\/td><td class="L sh">Копье, винтовка / крупный пистолет, удар током ЛЭП, обширные ожоги, падение 2–3 этажа<\/td><td class="L sc">Молния, сгорание заживо, артиллерия, падение с самолета, жидкий азот / фторсульфоновая кислота<\/td><\/tr><\/table><\/div><div class="row"><div class="col"><div class="p"><div class="st">Подготовка к атаке <span style="color:var(--green);font-size:8.5px">+1 степень при успехе<\/span><\/div><table><tr><th class="L">Тип (1 ОД)<\/th><th class="L">Навыки<\/th><\/tr><tr><td class="L">Прицеливание<\/td><td class="L">Концентрация + Зрение<\/td><\/tr><tr><td class="L">Разгон<\/td><td class="L">Атлетика + Выносливость<\/td><\/tr><tr><td class="L">Выбор момента<\/td><td class="L">Чтение замысла + Зрение<\/td><\/tr><\/table><div class="note">Бонус теряется при получении травмы или другом действии до атаки.<\/div><\/div><\/div><div class="col col2"><div class="p"><div class="st">Реакция на атаку (встречный бросок, те же навыки что и атака)<\/div><table><tr><th class="L">Вариант<\/th><th class="L" colspan="2">Результат встречного броска<\/th><\/tr><tr><td class="L" rowspan="2">🏃 Уклонение<\/td><td class="L c1">≥ броску атаки<\/td><td class="c1">урон 0<\/td><\/tr><tr><td class="L c5">меньше хотя бы на 1<\/td><td class="c5">попадание без снижения<\/td><\/tr><tr><td class="L" rowspan="3">🛡 Блок<\/td><td class="L c1">≥ броску атаки<\/td><td class="c1">−2 степени<\/td><\/tr><tr><td class="L c3">на 1 меньше<\/td><td class="c3">−1 степень<\/td><\/tr><tr><td class="L c5">на 2+ меньше<\/td><td class="c5">без снижения<\/td><\/tr><\/table><\/div><\/div><\/div><div class="p"><div class="st">Шаблонные боевые действия<\/div><div class="cc-grid"><div class="cc"><div class="cc-name">🔫 Выстрел из револьвера<\/div><div class="cc-meta"><span class="od">2 ОД<\/span><span class="dmg">Средний урон<\/span><span>Малый калибр<\/span><\/div><div class="cc-skills">Зрение + Точная моторика<\/div><div class="cc-note">До ~15 м без штрафа. Дальше: сложность +1–2.<\/div><\/div><div class="cc"><div class="cc-name">🔫 Выстрел из пистолета (крупный)<\/div><div class="cc-meta"><span class="od">2 ОД<\/span><span class="dmg">Тяжелый урон<\/span><span>Крупный калибр<\/span><\/div><div class="cc-skills">Зрение + Точная моторика<\/div><div class="cc-note">Сильная отдача — +1 ОД к следующему выстрелу без перегруппировки.<\/div><\/div><div class="cc"><div class="cc-name">🎯 Выстрел из винтовки<\/div><div class="cc-meta"><span class="od">2 ОД<\/span><span class="dmg">Тяжелый урон<\/span><span>Дистанц.<\/span><\/div><div class="cc-skills">Зрение + Концентрация + Точная моторика<\/div><div class="cc-note">До 300 м эффективно. Без упора / с колена: сложность +1.<\/div><\/div><div class="cc prep"><div class="cc-name">🔭 Снайперский выстрел <span class="tag tg-prep">подготовка<\/span><\/div><div class="cc-meta"><span class="od">1 ОД подгот. + 2 ОД атака<\/span><span class="dmg">Тяжелый→Критич.<\/span><\/div><div class="cc-skills">Подготовка: Концентрация + Зрение<br>Выстрел: Зрение + Концентрация + Точная моторика<\/div><div class="cc-note">+1 степень. Прерывается уроном / сменой действия.<\/div><\/div><div class="cc prep"><div class="cc-name">⏳ Прицельная стрельба <span class="tag tg-prep">подготовка<\/span><\/div><div class="cc-meta"><span class="od">1 ОД подготовка<\/span><span class="dmg">+1 степень к следующей атаке<\/span><\/div><div class="cc-skills">Концентрация + Зрение<\/div><div class="cc-note">Цель должна оставаться в поле зрения. Бонус теряется при уроне.<\/div><\/div><div class="cc"><div class="cc-name">🗡 Удар ножом<\/div><div class="cc-meta"><span class="od">1 ОД<\/span><span class="dmg">Средний урон<\/span><span>Контактный<\/span><\/div><div class="cc-skills">Точная моторика + Контроль<\/div><div class="cc-note">Финт (1 ОД: Манипулирование + Точная моторика) → след. атака неожиданная.<\/div><\/div><div class="cc"><div class="cc-name">👊 Удар кулаком / тяжелым предметом<\/div><div class="cc-meta"><span class="od">1 ОД<\/span><span class="dmg">Легкий (тяж. предмет: Средний)<\/span><\/div><div class="cc-skills">Атлетика + Контроль<\/div><div class="cc-note">Разгон (+1 ОД: Атлетика + Выносливость) повышает урон на ступень.<\/div><\/div><div class="cc"><div class="cc-name">🪃 Бросок предмета<\/div><div class="cc-meta"><span class="od">1 ОД<\/span><span class="dmg">Легкий / Средний по весу<\/span><\/div><div class="cc-skills">Атлетика + Зрение<\/div><div class="cc-note">Дальность ≈ Атлетика × 2 м. Тяжелый предмет → Средний урон.<\/div><\/div><div class="cc react"><div class="cc-name">🔄 Уклонение / Перекат <span class="tag tg-react">реакция<\/span><\/div><div class="cc-meta"><span class="od">2 ОД из резерва реакций<\/span><\/div><div class="cc-skills">Общая моторика + Проприоцепция<\/div><div class="cc-note">≥ броска атаки → урон 0. Меньше на 1+ → попадание без снижения.<\/div><\/div><div class="cc react"><div class="cc-name">🤸 Группировка при падении <span class="tag tg-react">реакция<\/span><\/div><div class="cc-meta"><span class="od">3 ОД из резерва реакций<\/span><\/div><div class="cc-skills">Общая моторика + Контроль<\/div><div class="cc-note">≥ Сложности → −2 степени; на 1 меньше → −1 степень; на 2+ → 0 эффект.<\/div><\/div><\/div><\/div><div class="p"><div class="st">Прочие шаблоны из раздела Мастера<\/div><table><tr><th class="L">Действие<\/th><th class="L">Навыки<\/th><th>ОД<\/th><th class="L">Эффект<\/th><\/tr><tr><td class="L">Реконструкция сцены<\/td><td class="L">Пространственная логика + Чтение замысла + Навык восприятия<\/td><td>3<\/td><td class="L">Мастер раскрывает детали сцены<\/td><\/tr><tr><td class="L">Финт<\/td><td class="L">Манипулирование + Точная моторика<\/td><td>1<\/td><td class="L">Следующая атака — неожиданная<\/td><\/tr><tr><td class="L">Группировка<\/td><td class="L">Общая моторика + Контроль<\/td><td>3 ⚡<\/td><td class="L">Снижение урона от падения / столкновения<\/td><\/tr><tr><td class="L">Вывод по жесту<\/td><td class="L">Зрение + Общая моторика + Чтение замысла<\/td><td>1<\/td><td class="L">Краткая хар-ка состояния цели<\/td><\/tr><\/table><div class="note">⚡ = применяется как реакция (тратит ОД из резерва реакций)<\/div><\/div><div class="pg-foot">Arbor Echo · Шпаргалка Мастера · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="p3"><div class="pg-head"><div><span class="title">Arbor Echo<\/span><span class="sub" style="margin-left:14px">Шпаргалка Мастера<\/span><\/div><span class="sub">Травмы &amp; Лечение &amp; Патологии<\/span><span class="pgn">3 / 5<\/span><\/div><div class="p" style="overflow-x:auto"><div class="st">Травмы: Локализация × Тип урона<\/div><div class="note" style="margin-bottom:4px">Штраф Здоровье-навыка <em>и<\/em> навыка локализации = степень травмы. Внутренние органы: дополнительно −1 к Здоровью вне зависимости от степени.<\/div><table style="font-size:10.5px;min-width:600px"><thead><tr><th class="L" style="min-width:90px">Локализация<\/th><th>Тупой<\/th><th>Режущий / Колотый<\/th><th>Огнестрельный<\/th><th>Ожог<\/th><th>Электрический<\/th><th>Химический<\/th><th>Падение<\/th><\/tr><\/thead><tbody><tr><td class="rh">🧠 Голова<\/td><td>Нейр<br>/Конц<\/td><td>Метаб<br>/Конц<\/td><td>Метаб<br>/Конц<\/td><td>Метаб<br>/Конц<\/td><td>Нейр<br>/Конц<\/td><td>Метаб<br>/Конц<\/td><td>Нейр<br>/Конц<\/td><\/tr><tr><td class="rh">🫁 Торс<\/td><td>Нейр<br>/Вынос<\/td><td>Метаб<br>/Вынос<\/td><td>Метаб<br>/Вынос<\/td><td>Метаб<br>/Вынос<\/td><td>Нейр<br>/Вынос<\/td><td>Метаб<br>/Вынос<\/td><td>Нейр<br>/Вынос<\/td><\/tr><tr><td class="rh">💪 Руки<\/td><td>Нейр<br>/Точн мот<\/td><td>Метаб<br>/Точн мот<\/td><td>Метаб<br>/Точн мот<\/td><td>Метаб<br>/Точн мот<\/td><td>Нейр<br>/Точн мот<\/td><td>Метаб<br>/Точн мот<\/td><td>Нейр<br>/Точн мот<\/td><\/tr><tr><td class="rh">🦿 Ноги<\/td><td>Нейр<br>/Общ мот<\/td><td>Метаб<br>/Общ мот<\/td><td>Метаб<br>/Общ мот<\/td><td>Метаб<br>/Общ мот<\/td><td>Нейр<br>/Общ мот<\/td><td>Метаб<br>/Общ мот<\/td><td>Нейр<br>/Общ мот<\/td><\/tr><tr><td class="rh">👁 Органы чувств<\/td><td>Нейр<br>/Зрен·Слух<\/td><td>Метаб<br>/Зрен·Слух<\/td><td>Метаб<br>/Зрен<\/td><td>Метаб<br>/Зрен·Обон<\/td><td>Нейр<br>/Зрен·Слух<\/td><td>Метаб<br>/Зрен·Обон<\/td><td>Нейр<br>/Зрен<\/td><\/tr><tr><td class="rh">🫀 Внутр. органы<\/td><td>Нейр<br>+−1 Здоровье<\/td><td class="sh">Метаб<br>+−1 Здоровье<\/td><td class="sh">Метаб<br>+−1 Здоровье<\/td><td class="sh">Метаб<br>+−1 Здоровье<\/td><td>Нейр<br>+−1 Здоровье<\/td><td class="sh">Метаб<br>+−1 Здоровье<\/td><td>Нейр<br>+−1 Здоровье<\/td><\/tr><\/tbody><\/table><\/div><div class="row"><div class="col"><div class="p"><div class="st">Степени травм<\/div><table><tr><th class="L">Степень<\/th><th>−Здоровье<\/th><th>Сл. лечения<\/th><th class="L">Срочность<\/th><\/tr><tr><td class="L sl">Легкая<\/td><td class="sl">−1<\/td><td>10<\/td><td class="L sl">—<\/td><\/tr><tr><td class="L sm">Средняя<\/td><td class="sm">−2<\/td><td>14<\/td><td class="L sm">4 + Метаболизм раундов<\/td><\/tr><tr><td class="L sh">Тяжелая<\/td><td class="sh">−3<\/td><td>18<\/td><td class="L sh">2 + Метаболизм раундов<\/td><\/tr><tr><td class="L sc">Критическая<\/td><td class="sc">—<\/td><td class="sc">чудо<\/td><td class="L sc">немедленно<\/td><\/tr><\/table><div class="note">Внутр. органы: Сл. лечения +2. Тяжелая → −1 навык зоны навсегда. Провал лечения ухудшает травму.<\/div><div class="mh">Лечение<\/div><table><tr><th class="L">Метод<\/th><th class="L">Навыки<\/th><\/tr><tr><td class="L">Хирургия<\/td><td class="L">Анатомия (врач) + Метаболизм (пациент)<\/td><\/tr><tr><td class="c0" colspan="2">Одна проверка: к броску идет сумма двух РЗН<\/td><\/tr><tr><td class="L">Медикаменты<\/td><td class="L">Биохимия + Гомеостаз<\/td><\/tr><tr><td class="L">Психотравма<\/td><td class="L">Убеждение + Самообладание<\/td><\/tr><\/table><div class="note">Стабилизация срочной травмы: те же навыки, та же сложность — останавливает таймер.<\/div><div class="mh">Восстановление<\/div><div class="f"><span class="lbl">Базовая длительность<\/span>Легкая 4 · Средняя 9 · Тяжелая 16 дн<\/div><div class="f"><span class="lbl">Коэффициент<\/span><span class="eq">1.5 − (Метаболизм + Гомеостаз + Мод.условий) × 0.05<\/span><\/div><div class="f"><span class="lbl">Мод. условий лечения<\/span><span class="c5">−2<\/span> игнор · <span class="c4">−1<\/span> неоптимум · <span class="c0">0<\/span> нейтр. · <span class="c1">+1<\/span> постель и уход · <span class="c1">+2<\/span> спец. помощь<\/div><div class="mh">Игнорирование боли<\/div><div class="f"><span class="lbl">Самообладание + Интероцепция · повтор за сцену +1 к Сл<\/span><span class="sl">Легкая 7<\/span> · <span class="sm">Средняя 11<\/span> · <span class="sh">Тяжелая 15<\/span><\/div><div class="note">Штрафы от травмы не снимаются. Провал может усугубить травму.<\/div><div class="mh" style="margin-top:5px">Соматические травмы<\/div><div class="note" style="margin-top:0;margin-bottom:3px">Временные телесные нарушения от стресса или срыва, бьют по Самообладанию. Чаще всего — при неудачной или пропущенной очистке Резонансного эха.<\/div><table style="font-size:10.5px"><tr><th class="L">Пример<\/th><th>Степень<\/th><th class="L">Эффект<\/th><th class="L">Лечение<\/th><\/tr><tr><td class="L">Психогенный тремор<\/td><td class="sl">Легкая<\/td><td class="L">Самообладание −1, Точная моторика −1<\/td><td class="L">Убеждение/Самообладание Сл 10<\/td><\/tr><\/table><\/div><div class="p"><div class="st">Просветления<\/div><table><tr><th class="L">Тип<\/th><th class="L">Условие<\/th><th>Бонус<\/th><\/tr><tr><td class="L sl">Малое<\/td><td class="L">Осознанный выбор в конкретной ситуации<\/td><td>+1 к навыку<\/td><\/tr><tr><td class="L c4">Фундаментальное<\/td><td class="L">Долгие испытания, трансформация личности<\/td><td>+1 к аспекту<\/td><\/tr><\/table><div class="note">Юным — легко. Зрелым — сложно. Пожилым — только в экстремальных случаях.<\/div><\/div><\/div><div class="col"><div class="p"><div class="st">Патологии: обострение &amp; степени<\/div><div class="f"><span class="lbl">Степень &amp; Порог триггера<\/span><span class="eq">Степень (1–6) = ∑ |штрафов| · Порог = 6 − Степень<\/span><\/div><div class="note" style="margin-top:2px;margin-bottom:3px">Сумма релевантных осей сцены ≥ Порог → обострение. Мощность: 1–2 легкая · 3–4 средняя · 5–6 тяжелая травма. Марафонский режим.<\/div><div class="mh" style="margin-top:4px">Направления напряжения (оси сцены 1–3)<\/div><table style="font-size:10px"><tr><th class="L">Ось<\/th><th>1 (слабо)<\/th><th>2 (заметно)<\/th><th>3 (предельно)<\/tr><tr><td class="L rh">Нагрузка<\/td><td class="L">Слегка задевает<\/td><td class="L">Грузит функцию<\/td><td class="L">Потревожит здорового<\/td><\/tr><tr><td class="L rh">Среда<\/td><td class="L">Слегка отклонена<\/td><td class="L">Заметно нарушена<\/td><td class="L">Прямо противоречит<\/td><\/tr><tr><td class="L rh">Аффект<\/td><td class="L">Легкое волнение<\/td><td class="L">Сильный стресс<\/td><td class="L">Бьет точно в травму<\/td><\/tr><\/table><div class="mh" style="margin-top:4px">Примеры патологий<\/div><table style="font-size:10px"><tr><th class="L">Патология<\/th><th>Ст.<\/th><th class="L">Фон (штраф)<\/th><th class="L">Оси<\/th><th class="L">Обострение<\/th><\/tr><tr><td class="L">Гангрена<\/td><td class="sh">5<\/td><td class="L">−1 Здоровье, моторика −2<\/td><td class="L">Нагр, Среда<\/td><td class="L">Гной, распад (Тяжелая)<\/td><\/tr><tr><td class="L">Ожирение<\/td><td class="sm">2<\/td><td class="L">−1 Метаб, −1 Вынос<\/td><td class="L">Нагр, Среда<\/td><td class="L">Одышка, спазм (Легкая)<\/td><\/tr><tr><td class="L">ПТСР-тремор<\/td><td class="sl">1<\/td><td class="L">−1 Точная моторика<\/td><td class="L">Нагр, Аффект<\/td><td class="L">Срыв моторики (Легкая)<\/td><\/tr><tr><td class="L">Бред<\/td><td class="sl">1<\/td><td class="L">−1 Чтение зам (+1 Убежд)<\/td><td class="L">Нагр, Аффект<\/td><td class="L">Психоз, срыв (Легкая)<\/td><\/tr><\/table><div class="note">Психотравмы: штраф к Самоконтролю + ближайший навык. Лечение: Убеждение/Самообладание Сл 10/14/18.<\/div><\/div><div class="p"><div class="st">Модификации: Биоагрессивность<\/div><table><tr><th>Ур.<\/th><th class="L">Активация<\/th><th class="L">Характер эффекта<\/th><\/tr><tr><td class="sl">1–2<\/td><td class="L">Два жестких условия<\/td><td class="L">Слабый / узкоспециализированный<\/td><\/tr><tr><td class="sm">3<\/td><td class="L">Одно значимое условие<\/td><td class="L">Средний<\/td><\/tr><tr><td class="sh">4–5<\/td><td class="L">В любой момент<\/td><td class="L">Масштабный / разрушительный<\/td><\/tr><\/table><div class="f" style="margin-top:4px"><span class="lbl">Пассивный бонус всего<\/span><span class="eq">= Биоагрессивность × 2<\/span><\/div><div class="note">Био → первичные навыки. Кибер → результирующие. Штраф при превышении порога: патологии с суммой степеней, равной превышению, — одна или несколько на усмотрение Мастера.<\/div><div class="mh" style="margin-top:6px">Проверка функционирования <span style="color:var(--dim);font-size:8px;font-weight:normal">— при превышении порога, перед каждой активной заявкой<\/span><\/div><div class="f"><span class="lbl">Сложность<\/span><span class="eq">= 2 + 2 × (единиц превышения порога)<\/span> · бросок — чистые 2d6<\/div><table><tr><th class="L">Результат<\/th><th class="L">Последствие<\/th><\/tr><tr class="rs-s"><td class="L">Успех<\/td><td class="L">Модификация срабатывает<\/td><\/tr><tr class="rs-p"><td class="L">Ниже на 1<\/td><td class="L">Не срабатывает<\/td><\/tr><tr class="rs-f"><td class="L">Ниже на 2–3<\/td><td class="L">Блокируется; ремонт/лечение Сл 13<\/td><\/tr><tr class="rs-cf"><td class="L">Ниже на 4+<\/td><td class="L">Тяжелая травма в зоне модификации<\/td><\/tr><\/table><div class="note">При отсутствии превышения порога проверка не требуется (Сл 2 проходит на любом 2d6).<\/div><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Шпаргалка Мастера · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="p4"><div class="pg-head"><div><span class="title">Arbor Echo<\/span><span class="sub" style="margin-left:14px">Шпаргалка Мастера<\/span><\/div><span class="sub">Магия · Гейсы · Стигматы<\/span><span class="pgn">4 / 5<\/span><\/div><div class="p"><div class="st">Магические формулы и ограничения<\/div><div class="row" style="gap:5px"><div style="flex:1"><div class="f"><span class="lbl">Макс. запас Платонов<\/span><span class="eq">= Самоконтроль × 5 + Здоровье × 2<\/span><\/div><div class="f"><span class="lbl">Восстановление Платонов<\/span><span class="eq">= Самоконтроль × 3 + Здоровье (в сутки)<\/span><\/div><\/div><div style="flex:1"><div class="f"><span class="lbl">Дальность применения<\/span><span class="eq">= ΣАспектов Воли × (Текущий / Макс. запас) м<\/span><\/div><div class="f"><span class="lbl">Максимум Гейсов<\/span><span class="eq">= (ΣАспектов Эрудиции + Аспектов Воли) / 3<\/span><\/div><\/div><div style="flex:1"><div class="f"><span class="lbl">Установка Гейса<\/span><span class="eq">= ΣАспектов Эрудиции и Воли часов<\/span><\/div><div class="f"><span class="lbl">Создание Стигмата<\/span><span class="eq">= 3 × (Эрудиция + Воля) часов<\/span><\/div><\/div><\/div><div class="note">Заклинание действует только в пределах ауры. Базовый расход: 1 ОД = 1 Платон (если шаблон не указывает иного).<\/div><div class="note"><strong style="color:var(--yellow)">Опц.:<\/strong> если средний РЗН опорных навыков превосходит порог ступени, +1 к броску за каждые 2 полных единицы сверх порога (максимум +2).<\/div><div class="note">Первый навык шаблона — ведущий. Бросок: 2d6 + РЗН ведущего + Гейсы + мод. Ступень — по среднему РЗН опорных: до 5 — I (Сл. 9), 6–9 — II (13), 10–13 — III (17), 14+ — IV (21).<\/div><\/div><div class="row"><div class="col"><div class="p"><div class="st">Аура<\/div><div class="sg"><div class="sp au"><div class="sp-name">Чувствительность<\/div><div class="sp-cost"><span class="od">—<\/span><span class="pl">/ —<\/span><\/div><div class="sp-sk">Концентрация + Проприоцепция + Навык восприятия<\/div><div class="sp-d">Восприятие аур; обнаружение заклинаний.<\/div><\/div><div class="sp au"><div class="sp-name">Накопление<\/div><div class="sp-cost"><span class="od">—<\/span><span class="pl">/ —<\/span><\/div><div class="sp-sk">Концентрация<\/div><div class="sp-d">Восстановление Платонов ×3. Макс. часов/сутки = Концентрация.<\/div><\/div><div class="sp au"><div class="sp-name">Дистанционный контроль<\/div><div class="sp-cost"><span class="od">1 ОД/раз<\/span><span class="pl">/ —<\/span><\/div><div class="sp-sk">Концентрация + Самообладание + Проприоцепция<\/div><div class="sp-d">Отделение/контроль фрагментов ауры. Платоны фрагмента = ОД.<\/div><\/div><div class="sp au"><div class="sp-name">Диффузия<\/div><div class="sp-cost"><span class="od">2 ОД<\/span><span class="pl">/ 1 Пл<\/span><\/div><div class="sp-sk">Концентрация + Проприоцепция<\/div><div class="sp-d">Заклинания внутри ауры цели. Цель замечает немедленно. Встречная проверка против Диффузии цели.<\/div><\/div><div class="sp au"><div class="sp-name">Сонастройка<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 1 Пл<\/span><\/div><div class="sp-sk">Навык восприятия + Концентрация + Проприоцепция<\/div><div class="sp-d">Скрытная диффузия. Сл. = чужая чувствительность.<\/div><\/div><div class="sp au"><div class="sp-name">Подавление<\/div><div class="sp-cost"><span class="od">2 ОД<\/span><span class="pl">/ выд. резерв + 1 Пл/раунд<\/span><\/div><div class="sp-sk">Запугивание + Самообладание<\/div><div class="sp-d">Выдавливание ауры. Выд. резерв ≥ остатку у цели.<\/div><\/div><div class="sp au" style="grid-column:1/-1"><div class="sp-name">Абсорбция<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ кража = Концентрация/3 Пл<\/span><\/div><div class="sp-sk">Самообладание + Запугивание + Концентрация<\/div><div class="sp-d">Восстановление своих Платонов за чужой счет.<\/div><\/div><\/div><div class="st" style="margin-top:6px">Гейсы<\/div><div class="f"><span class="lbl">Бонус<\/span><span class="eq">= бросок + навыки + Σ баллов всех Гейсов заклинания<\/span><\/div><table style="margin-top:3px"><tr><th class="L">Категория (одна из трех на заклинание)<\/th><th>Балл<\/th><\/tr><tr><td class="L">Что — допустимые цели («только к металлу»)<\/td><td rowspan="3" style="vertical-align:middle;background:var(--bg3)"><span class="c3">1<\/span> — группа случаев<br><span class="c4">2<\/span> — один редкий случай <\/td><\/tr><tr><td class="L">Где — пространство («только ночью», «в помещении»)<\/td><\/tr><tr><td class="L">Когда — ситуация («при угрозе жизни»)<\/td><\/tr><\/table><div class="note">Удаление Гейса: в три раза дольше установки.<\/div><div class="st" style="margin-top:6px">Стигматы<\/div><table style="font-size:10.5px"><tr><th class="L">Тип<\/th><th class="L">Условие<\/th><th class="L">Эффект<\/th><\/tr><tr><td class="L sh">Темный<\/td><td class="L">Действующая Патология<\/td><td class="L">Фокус заклинаний из точки стигмата (и уязвимость через него)<\/td><\/tr><tr><td class="L c1">Светлый<\/td><td class="L">Фундаментальное просветление<\/td><td class="L">Гейс «Зачем» вне счетчика + <span class="c1">+2 к броску<\/span> при физическом контакте<\/td><\/tr><\/table><div class="note">Стигмат существует пока активно породившее его состояние.<\/div><\/div><\/div><div class="col col2"><div class="p"><div class="st">Материя <span style="color:var(--dim);font-size:8px">— Резонансное эхо: воздействие на разумное существо → −1 ступень на заклинателя; снимается медитацией 5–10 мин (Самообладание Сл 13); срыв очистки → соматическая травма<\/span><\/div><div class="sg"><div class="sp ma"><div class="sp-name">Фотокинез<\/div><div class="sp-cost"><span class="od">4+1 ОД<\/span><span class="pl">/ 1+1 Пл<\/span><\/div><div class="sp-sk">Материя + Квантовая теория<\/div><div class="sp-d">Контроль интенсивности света.<\/div><\/div><div class="sp ma"><div class="sp-name">Телекинез<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 3 Пл<\/span><\/div><div class="sp-sk">Материя + Классическая физика<\/div><div class="sp-d">Движение предметов на расстоянии.<\/div><\/div><div class="sp ma"><div class="sp-name">Термокинез<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 2 Пл<\/span><\/div><div class="sp-sk">Материя + Электроморфизм + Классическая физика<\/div><div class="sp-d">Нагрев / охлаждение веществ.<\/div><\/div><div class="sp ma"><div class="sp-name">Нагнетание потенциала<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 2 Пл<\/span><\/div><div class="sp-sk">Материя + Электроморфизм<\/div><div class="sp-d">Электрическое напряжение между точками.<\/div><\/div><div class="sp ma"><div class="sp-name">Восстановление структуры<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 2 Пл<\/span><\/div><div class="sp-sk">Материя + Материаловедение + Реакт./Синт. химия<\/div><div class="sp-d">Ремонт на молекулярном уровне.<\/div><\/div><div class="sp ma"><div class="sp-name">Укрепление / Аморфизация<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 3 Пл<\/span><\/div><div class="sp-sk">Материя + Материаловедение + Классическая физика<\/div><div class="sp-d">Изменение плотности материалов.<\/div><\/div><div class="sp ma"><div class="sp-name">Виброкинез<\/div><div class="sp-cost"><span class="od">3+1 ОД<\/span><span class="pl">/ 3+1 Пл<\/span><\/div><div class="sp-sk">Материя + Электроморфизм<\/div><div class="sp-d">Звук, ЭМИ, волновые процессы.<\/div><\/div><div class="sp ma"><div class="sp-name">Материагенез<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 3 Пл/грамм<\/span><\/div><div class="sp-sk">Материя + Квантовая теория + Теория вероятностей<\/div><div class="sp-d">Синтез вещества из ничего.<\/div><\/div><div class="sp ma"><div class="sp-name">Телепортация<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 4 Пл/5кг<\/span><\/div><div class="sp-sk">Материя + Формальный анализ + Теория вероятностей + Квантовая теория<\/div><div class="sp-d">Перемещение в заранее подготовл. точку.<\/div><\/div><div class="sp ma"><div class="sp-name">Море Дирака<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 4 Пл<\/span><\/div><div class="sp-sk">Материя + Электроморфизм + Пространственная логика<\/div><div class="sp-d">Порталы и пространственные ловушки.<\/div><\/div><div class="sp ma" style="grid-column:1/-1"><div class="sp-name">Ядерный распад<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 4 Пл<\/span><\/div><div class="sp-sk">Материя + Теория вероятностей + Квантовая теория<\/div><div class="sp-d">Контролируемые ядерные реакции.<\/div><\/div><\/div><\/div><div class="p"><div class="st">Изнанка<\/div><div class="sg"><div class="sp iz"><div class="sp-name">Ментальное считывание<\/div><div class="sp-cost"><span class="od">2 ОД<\/span><span class="pl">/ 1 Пл<\/span><\/div><div class="sp-sk">Менталистика + Чтение замысла<\/div><div class="sp-d">Чтение памяти, эмоций, мыслей.<\/div><\/div><div class="sp iz"><div class="sp-name">Фиксация / Форматирование памяти<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 3 Пл<\/span><\/div><div class="sp-sk">Менталистика + Чтение замысла + Манипулирование<\/div><div class="sp-d">Сохранение / удаление воспоминаний.<\/div><\/div><div class="sp iz"><div class="sp-name">Де/шифровка памяти<\/div><div class="sp-cost"><span class="od">4 ОД<\/span><span class="pl">/ 4 Пл<\/span><\/div><div class="sp-sk">Менталистика + Обман + Нейрофизиология<\/div><div class="sp-d">Сокрытие / раскрытие воспоминаний.<\/div><\/div><div class="sp iz"><div class="sp-name">Замена приоритетов<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 3 Пл<\/span><\/div><div class="sp-sk">Менталистика<\/div><div class="sp-d">Изменение ценностей и мотивации.<\/div><\/div><div class="sp iz"><div class="sp-name">Внушение<\/div><div class="sp-cost"><span class="od">3 ОД<\/span><span class="pl">/ 3 Пл<\/span><\/div><div class="sp-sk">Менталистика + Убеждение<\/div><div class="sp-d">Внедрение команд и идей.<\/div><\/div><div class="sp iz"><div class="sp-name">Ориентация в Изнанке<\/div><div class="sp-cost"><span class="od">2 ОД и 1 Пл акт., 1 ОД/раунд<\/span><span class="pl">/ 1 Пл за слой<\/span><\/div><div class="sp-sk">Менталистика + Концентрация<\/div><div class="sp-d">Перемещение в Изнанке. См. стр. 5.<\/div><\/div><div class="sp iz"><div class="sp-name">Ассоциативная сигнализация<\/div><div class="sp-cost"><span class="pl">30 Пл + 5 Пл/час<\/span><\/div><div class="sp-sk">Менталистика + Концентрация<\/div><div class="sp-d">Предупредительные системы в Изнанке.<\/div><\/div><div class="sp iz"><div class="sp-name">Квазиразумность заклинаний<\/div><div class="sp-cost"><span class="pl">10 Пл/ед. навыка<\/span><\/div><div class="sp-sk">Менталистика + Обман + Нейрофизиология<\/div><div class="sp-d">Псевдо-разумный конструкт из заклинаний.<\/div><\/div><div class="sp iz"><div class="sp-name">Чтение памяти мира<\/div><div class="sp-cost"><span class="od">10 ОД/час<\/span><span class="pl">/ 10 Пл/час разницы<\/span><\/div><div class="sp-sk">Менталистика + Чтение замысла + Самообладание<\/div><div class="sp-d">Коллективный опыт всех живущих и живших.<\/div><\/div><div class="sp iz" style="border-left-color:var(--red);grid-column:1/-1"><div class="sp-name" style="color:var(--red)">⚠ Рекомбинация следа<\/div><div class="sp-cost"><span class="od" style="color:var(--red)">1000 ОД<\/span><span class="pl" style="color:var(--red)">/ 1000 Пл<\/span><\/div><div class="sp-sk">Менталистика<\/div><div class="sp-d">Изменение коллективных воспоминаний всего человечества.<\/div><\/div><\/div><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Шпаргалка Мастера · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="p5"><div class="pg-head"><div><span class="title">Arbor Echo<\/span><span class="sub" style="margin-left:14px">Шпаргалка Мастера<\/span><\/div><span class="sub">Изнанка · Цепи · Платонный профиль<\/span><span class="pgn">5 / 5<\/span><\/div><div class="row"><div class="col"><div class="p"><div class="st">Ориентация в Изнанке: проверка перехода<\/div><div class="note" style="margin-top:0;margin-bottom:4px">Ступень эффекта задает максимальный доступный слой. Отдельно ступень не бросается: ее роль играет проверка перехода. Ступень — «докуда можно дойти в принципе», бросок — «дойдет ли в этой сцене».<\/div><table><tr><th class="L">Слой<\/th><th>Сл.<\/th><th class="L">Что в нем<\/th><\/tr><tr><td class="L c2">Аффект<\/td><td class="c2">9<\/td><td class="L">Быстропеременные состояния одной композиции: текущая мысль, вспышка<\/td><\/tr><tr><td class="L c3">Биография<\/td><td class="c3">13<\/td><td class="L">Устойчивые бассейны одной жизни: память, привычки, травмы<\/td><\/tr><tr><td class="L c4">Культура<\/td><td class="c4">17<\/td><td class="L">Высокоперекрытые аттракторы: Тени, духи мест, боги, Храмы<\/td><\/tr><tr><td class="L c5">Запределье<\/td><td class="c5">21<\/td><td class="L">Области, не связанные ни с чьим восприятием<\/td><\/tr><\/table><div class="mh">Модификатор моста<\/div><table><tr><th style="width:30px">Мод<\/th><th class="L">Что связывает Игрока и цель<\/th><\/tr><tr><td class="c1">−2<\/td><td class="L">Общий эпизод биографии: травма, событие, живая личная связь<\/td><\/tr><tr><td style="color:#88aa70">−1<\/td><td class="L">Общая среда: школа, Храм, Дом, полк, тюрьма, цех<\/td><\/tr><tr><td class="c0">0<\/td><td class="L">Общий язык в широком смысле: национальный язык, эпоха, вера<\/td><\/tr><tr><td style="color:#c08050">+1<\/td><td class="L">Только общая видовая основа (человеческая феноменальность)<\/td><\/tr><tr><td class="c5">+2<\/td><td class="L">Общего нет: конструкт, нечеловеческий паттерн, Запределье<\/td><\/tr><\/table><\/div><\/div><div class="col"><div class="p"><div class="st">Цена<\/div><table><tr><th class="L">Действие<\/th><th>ОД<\/th><th>Платоны<\/th><\/tr><tr><td class="L">Активация ориентации<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td class="L">Вход и каждая смена слоя<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td class="L">Пребывание (за раунд)<\/td><td>1<\/td><td class="c0">—<\/td><\/tr><tr><td class="L">Провал проверки<\/td><td class="c0">—<\/td><td class="c5">+1 сверх тарифа<\/td><\/tr><\/table><div class="note">1 раунд внутри = 1 раунд снаружи. Изнанка не дает выигрыша времени.<\/div><div class="mh">Последствия броска<\/div><table><tr><th class="L">Результат<\/th><th class="L">Эффект<\/th><\/tr><tr class="rs-s"><td class="L">Успех<\/td><td class="L">Прибытие<\/td><\/tr><tr class="rs-p"><td class="L">Ниже на 1<\/td><td class="L">Задержка, +1 Платон, повтор броска без штрафа<\/td><\/tr><tr class="rs-f"><td class="L">Ниже на 2–3<\/td><td class="L">Снос в ближайший бассейн, с целью не связанный; +1 к Сл всех дальнейших переходов в сцене<\/td><\/tr><tr class="rs-cf"><td class="L">Ниже на 4+<\/td><td class="L">Снос + отпечаток<\/td><\/tr><\/table><div class="mh">Отпечаток<\/div><div class="f"><span class="lbl">Суть<\/span>Одна чужая черта на сцену (манера, желание, страх, привязанность), которую Игрок отыгрывает как свою. Формулировка — одной фразой.<\/div><div class="f"><span class="lbl">Расцепление<\/span><span class="eq">Медитация 5–10 мин = Самообладание против Сл 13<\/span><\/div><div class="note">Не расцепленный к концу сессии отпечаток — кандидат в патологию.<\/div><div class="mh">Возврат<\/div><div class="note" style="margin-top:0">По пройденному маршруту — без броска и без Платонов, с той же ценой ОД. Маршрут потерян (разрыв моста или снос): новая проверка против Сл последнего достигнутого слоя, каждый слой на пути наружу оплачивается заново.<\/div><\/div><\/div><\/div><div class="row"><div class="col"><div class="p"><div class="st">Цепь (ретрансляция) — Хроно-параллакс<\/div><div class="f"><span class="lbl">Проверка звена<\/span><span class="eq">2d6 + Хроно-параллакс против Сл 9 + 2 × (номер звена)<\/span><\/div><table><tr><th>Звено<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class="rh">Сл.<\/td><td class="c2">11<\/td><td class="c3">13<\/td><td class="c3">15<\/td><td class="c4">17<\/td><td class="c4">19<\/td><\/tr><\/table><div class="note">Провал звена: цепь рвется, уплаченные Платоны и ОД сгорают, цель не достигнута. Успешная цепь снижает Сл финального перехода на 1 за звено, максимум −3.<\/div><\/div><\/div><div class="col col2"><div class="p"><div class="st">Платонный профиль места<\/div><table><tr><th class="L">Место<\/th><th>Восстановление Платонов<\/th><th>Сл. входа в Изнанку<\/th><\/tr><tr><td class="L">Плотный профиль мысли: библиотека, архив, университет, «публикующаяся» лаборатория<\/td><td class="c1">×2<\/td><td class="c1">−2<\/td><\/tr><tr><td class="L">Обжитое место с устойчивой практикой: храм, казарма, цех, лазарет<\/td><td style="color:#88aa70">×1,5<\/td><td style="color:#88aa70">−1<\/td><\/tr><tr><td class="L">Нейтральное<\/td><td class="c0">×1<\/td><td class="c0">0<\/td><\/tr><tr><td class="L">Пустошь, дикая природа, новостройка<\/td><td style="color:#c08050">×0,5<\/td><td style="color:#c08050">+1<\/td><\/tr><tr><td class="L">Место сильного коллективного аффекта: паника, побоище, лагерь<\/td><td class="c5">×0<\/td><td class="c5">+2<\/td><\/tr><\/table><div class="note">В местах аффекта тонкая работа невозможна: Мастер вправе отклонить заявку, требующую точности. Карточка духа места оформляется по аналогии с патологиями.<\/div><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Шпаргалка Мастера · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><\/div><script>( function (){ var deck = document.querySelector('.deck'); if (!deck) return ; var links = [].slice.call(document.querySelectorAll('.jump a[href^="#"]')); function sync(){ var best = -1,bd = 1e9,dr = deck.getBoundingClientRect();links.forEach( function (a,i){ var s = document.getElementById(a.getAttribute('href').slice(1)); if (!s) return ; var d = Math.abs(s.getBoundingClientRect().top - dr.top); if (d < bd){bd = d;best = i;}});links.forEach( function (a,i){a.classList.toggle('on',i === best);});} var t = null;deck.addEventListener('scroll', function (){sync();clearTimeout(t);t = setTimeout(sync,140);},{passive: true});window.addEventListener('resize',sync);sync();})();<\/script><\/body><\/html></script><script type="text/html" id="src-traces"><\!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arbor Echo — Следы Я<\/title><style>:root{--bg:#111510;--bg2:#181d16;--bg3:#1e2519;--border:#354533;--gold:#c8a84b;--green:#7ab870;--teal:#4a9080;--text:#d5ccbc;--dim:#8a8175;--dim2:#6d6558;--red:#b05040;--orange:#c07840;--head:'Cinzel',Georgia,serif;--body:'IM Fell English',Georgia,serif;--mono:'Share Tech Mono','Courier New',monospace}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:70px}body{background:#0d100b;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:10px 0 12px}.wrap{width:100%;max-width:none;margin:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}header{text-align:center;border-bottom:2px solid var(--gold);padding:2px 14px 8px;margin:0 0 8px;flex:0 0 auto}header h1{font-family:var(--head);font-size:24px;letter-spacing:.14em;color:var(--gold)}header p{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}.jump{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-self:center;max-width:calc(100% - 28px);background:#10140e;border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:2px;padding:6px;margin-bottom:10px}.jump a.on{color:var(--gold);border-color:var(--border);background:rgba(200,168,75,.08)}.deck{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:hidden;overflow-y:auto;padding:2px 14px 10px}.jump a{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid transparent;padding:4px 8px;border-radius:2px}.jump a:hover{color:var(--gold);border-color:var(--border)}section.grp{margin:0;flex:0 0 auto;width:min(840px,100%);max-width:100%;height:auto;min-height:0;overflow:visible;background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:3px;padding:12px 16px 16px}h2{font-family:var(--head);font-size:19px;letter-spacing:.1em;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:12px}h3.sub{font-family:var(--head);font-size:13px;letter-spacing:.08em;color:var(--green);margin:18px 0 8px}p.lead{color:var(--dim);font-style:italic;margin-bottom:10px}p{margin-bottom:6px}ul{margin:4px 0 8px 20px}li{margin-bottom:3px}.card{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--gold);padding:10px 14px;margin-bottom:10px}.card.dark{border-left-color:var(--teal)}.card.red{border-left-color:var(--red)}.card.green{border-left-color:var(--green)}.card h4{font-family:var(--head);font-size:14px;letter-spacing:.06em;color:var(--text);margin-bottom:4px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);padding:2px 6px;border-radius:2px;background:#10140e}.tag.r{color:#e09080;border-color:#6a3a30}.tag.g{color:var(--green);border-color:#3f5a3a}.tag.t{color:#7ac0b0;border-color:#2e5a50}dl{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:14px}dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-top:2px}dd{color:var(--text)}table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}th,td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:#10140e;font-weight:400}.note{border:1px dashed var(--border);padding:8px 12px;color:var(--dim);font-size:14px;margin:8px 0}.ref{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.04em}footer{flex:0 0 auto;margin-top:8px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:4px}}@media print{.jump{display:none!important}body{display:block;height:auto;overflow:visible;background:#fff;color:#000;padding:0}.wrap{display:block}.deck{display:block;overflow:visible;height:auto;padding:0}section.grp{display:block;width:auto;max-width:none;height:auto;overflow:visible;border:0;background:none;padding:0;margin:0 0 18px}.card{background:#fff;border:1px solid #999}}html::-webkit-scrollbar,*::-webkit-scrollbar{width:10px;height:10px}html::-webkit-scrollbar-track,*::-webkit-scrollbar-track{background:#0d100b}html::-webkit-scrollbar-thumb,*::-webkit-scrollbar-thumb{background:#354533;border:2px solid #0d100b;border-radius:0}html::-webkit-scrollbar-thumb:hover,*::-webkit-scrollbar-thumb:hover{background:#c8a84b}html::-webkit-scrollbar-corner,*::-webkit-scrollbar-corner{background:#0d100b}html,*{scrollbar-width:thin;scrollbar-color:#354533 #0d100b}<\/style><\/head><body><div class="wrap"><nav class="jump"><a href="#travmy">Травмы<\/a><a href="#patologii">Патологии<\/a><a href="#prosvetleniya">Просветления<\/a><a href="#modifikacii">Модификации<\/a><\/nav><div class="deck"><section class="grp" id="travmy"><h2>Травмы<\/h2><h3 class="sub">Градации травм<\/h3><table><tr><th>Степень<\/th><th>Штраф к Здоровью<\/th><th>Лечение (Сл)<\/th><th>Восстановление (базово)<\/th><th>Срочность<\/th><\/tr><tr><td>Легкая<\/td><td>−1<\/td><td>10<\/td><td>4 дня<\/td><td>—<\/td><\/tr><tr><td>Средняя<\/td><td>−2<\/td><td>14<\/td><td>9 дней<\/td><td>4 + Метаболизм раундов<\/td><\/tr><tr><td>Тяжелая<\/td><td>−3<\/td><td>18<\/td><td>16 дней<\/td><td>2 + Метаболизм раундов; после лечения −1 навсегда<\/td><\/tr><tr><td>Критическая<\/td><td>—<\/td><td>—<\/td><td>Смерть (помощь только чудо)<\/td><td>—<\/td><\/tr><\/table><h3 class="sub">Штрафы от локализации<\/h3><table><tr><th>Локализация<\/th><th>Эффект<\/th><\/tr><tr><td>Голова<\/td><td>Концентрация<\/td><\/tr><tr><td>Торс<\/td><td>Выносливость<\/td><\/tr><tr><td>Руки<\/td><td>Точная моторика<\/td><\/tr><tr><td>Ноги<\/td><td>Общая моторика<\/td><\/tr><tr><td>Органы чувств<\/td><td>Соответствующий навык Восприятия<\/td><\/tr><tr><td>Внутренние органы<\/td><td>Дополнительно Здоровье; всегда −1 независимо от степени<\/td><\/tr><\/table><h3 class="sub">Игнорирование боли (Самообладание — Интероцепция)<\/h3><table><tr><th>Степень<\/th><th>Сл<\/th><\/tr><tr><td>Легкая<\/td><td>7<\/td><\/tr><tr><td>Средняя<\/td><td>11<\/td><\/tr><tr><td>Тяжелая<\/td><td>15<\/td><\/tr><\/table><h3 class="sub">Базовая степень урона (источники)<\/h3><table><tr><th>Степень<\/th><th>Источники<\/th><\/tr><tr><td>Легкая<\/td><td>Удары кулаками, толчки, брошенные камни<\/td><\/tr><tr><td>Средняя<\/td><td>Нож, кастет, малокалиберный пистолет, ожоги от недолгого контакта с пламенем, падение с 2–3 м, серная кислота<\/td><\/tr><tr><td>Тяжелая<\/td><td>Копье, винтовка или крупнокалиберный пистолет, удар током от ЛЭП, обширные ожоги, падение со 2–3 этажа<\/td><\/tr><tr><td>Критическая<\/td><td>Удар молнией, сгорание заживо, артиллерия, падение из самолета без парашюта, жидкий азот или фторсульфоновая кислота<\/td><\/tr><\/table><h3 class="sub">Примеры травм<\/h3><div class="card "><h4>Перелом<\/h4><div class="tags"><span class="tag">Средняя<\/span><span class="tag t">Нога (левая)<\/span><\/div><dl><dt>Пассивный эффект<\/dt><dd>Нейромоторика −2, Общая моторика −2<\/dd><dt>Лечение<\/dt><dd>Анатомия/Метаболизм, Сл 14<\/dd><\/dl><\/div><div class="card "><h4>Солнечный удар<\/h4><div class="tags"><span class="tag">Легкая<\/span><span class="tag t">Голова<\/span><\/div><dl><dt>Пассивный эффект<\/dt><dd>Гомеостаз −1, Концентрация −1<\/dd><dt>Лечение<\/dt><dd>Биохимия/Гомеостаз, Сл 10<\/dd><\/dl><\/div><div class="card "><h4>Разрыв печеночной артерии<\/h4><div class="tags"><span class="tag r">Тяжелая<\/span><span class="tag r">Срочная<\/span><span class="tag t">Торс (печень)<\/span><\/div><dl><dt>Пассивный эффект<\/dt><dd>Метаболизм −4, Гомеостаз −1, Нейромоторика −1, Выносливость −3<\/dd><dt>Лечение<\/dt><dd>Анатомия/Метаболизм, Сл 20. После успеха и реабилитации: −1 к Выносливости<\/dd><\/dl><\/div><h3 class="sub">Психические и соматические травмы<\/h3><div class="card "><h4>Информационный перегруз<\/h4><div class="tags"><span class="tag">Психическая<\/span><span class="tag g">Легкая<\/span><\/div><dl><dt>Пассивный эффект<\/dt><dd>Самообладание −1, Концентрация −1<\/dd><dt>Лечение<\/dt><dd>Убеждение/Самообладание, Сл 10<\/dd><\/dl><\/div><div class="card "><h4>Психогенный тремор<\/h4><div class="tags"><span class="tag">Соматическая<\/span><span class="tag g">Легкая<\/span><\/div><dl><dt>Пассивный эффект<\/dt><dd>Самообладание −1, Точная моторика −1<\/dd><dt>Лечение<\/dt><dd>Убеждение/Самообладание, Сл 10<\/dd><\/dl><\/div><\/section><section class="grp" id="patologii"><h2>Патологии<\/h2><p class="lead">Хронические нарушения и расстройства личности, требующие сюжетного преодоления. Действуют в двух фазах: фоновая симптоматика и обострение.<\/p><h3 class="sub">Правила обострения<\/h3><table><colgroup><col style="width:25%"><col style="width:75%"><\/colgroup><tr><th>Параметр<\/th><th>Правило<\/th><\/tr><tr><td>Степень (1–6)<\/td><td>Равна сумме модулей пассивных штрафов фоновой симптоматики<\/td><\/tr><tr><td>Порог триггера<\/td><td><b>6 − Степень патологии<\/b><\/td><\/tr><tr><td>Проверка<\/td><td>Сумма значений по релевантным осям сцены ≥ Порог триггера → обострение<\/td><\/tr><tr><td>Тяжесть травмы<\/td><td>Степень 1–2: <b>Легкая<\/b> · Степень 3–4: <b>Средняя<\/b> · Степень 5–6: <b>Тяжелая<\/b><\/td><\/tr><\/table><h3 class="sub">Направления напряжения в сцене<\/h3><table><tr><th>Ось<\/th><th>1 (Слабо)<\/th><th>2 (Заметно)<\/th><th>3 (Предельно)<\/tr><tr><td>Нагрузка<\/td><td>Слегка задевает функцию<\/td><td>Грузит функцию сверх емкости<\/td><td>И здорового бы потревожило<\/td><\/tr><tr><td>Среда<\/td><td>Слегка отклоняется от нормы<\/td><td>Заметно нарушены условия<\/td><td>Прямо противоречит стабильности<\/td><\/tr><tr><td>Аффект<\/td><td>Легкое волнение<\/td><td>Сильное эмоциональное переживание<\/td><td>Бьет точно в корень травмы<\/td><\/tr><\/table><h3 class="sub">Физические патологии<\/h3><div class="card red"><h4>Гангрена<\/h4><div class="tags"><span class="tag r">Степень 5<\/span><span class="tag">Физическая<\/span><\/div><dl><dt>Степень<\/dt><dd>5<\/dd><dt>Фоновая симптоматика<\/dt><dd>−1 Здоровье, ограничение функции пораженной зоны (навыки моторики −2 при использовании пораженной области)<\/dd><dt>Напряжение<\/dt><dd>Нагрузка, Среда<\/dd><dt>Фаза обострения<\/dt><dd>Разрушение тканей, гной, резкое усиление боли — тяжелая травма. Необходима немедленная помощь или ампутация.<\/dd><\/dl><\/div><div class="card "><h4>Ожирение<\/h4><div class="tags"><span class="tag">Степень 2<\/span><span class="tag">Физическая<\/span><\/div><dl><dt>Степень<\/dt><dd>2<\/dd><dt>Фоновая симптоматика<\/dt><dd>−1 Метаболизм, −1 Выносливость (сниженная подвижность, одышка, давление на суставы)<\/dd><dt>Напряжение<\/dt><dd>Нагрузка, Среда<\/dd><dt>Фаза обострения<\/dt><dd>Острая одышка, сосудистый спазм, персонаж временно теряет возможность активно двигаться (легкая соматическая травма).<\/dd><\/dl><\/div><div class="card green"><h4>Посттравматический тремор<\/h4><div class="tags"><span class="tag g">Степень 1<\/span><span class="tag">Физическая<\/span><\/div><dl><dt>Степень<\/dt><dd>1<\/dd><dt>Фоновая симптоматика<\/dt><dd>−1 Точная моторика (непроизвольная дрожь в руках или ногах при концентрации или волнении)<\/dd><dt>Напряжение<\/dt><dd>Нагрузка, Аффект<\/dd><dt>Фаза обострения<\/dt><dd>Руки выходят из-под контроля, движения становятся резкими и грубыми, точные манипуляции невозможны (легкая соматическая травма).<\/dd><\/dl><\/div><h3 class="sub">Психопатологии<\/h3><div class="card dark"><h4>Имплантация бредовой системы<\/h4><div class="tags"><span class="tag t">Степень 1<\/span><span class="tag t">Психопатология<\/span><\/div><dl><dt>Степень<\/dt><dd>1<\/dd><dt>Фоновая симптоматика<\/dt><dd>Формирование замкнутой схемы объяснений через фиксированную идею: −1 к Чтению замысла, +1 к Убеждению при попытке навязать свою интерпретацию<\/dd><dt>Напряжение<\/dt><dd>Нагрузка, Аффект<\/dd><dt>Фаза обострения<\/dt><dd>Утрата контакта с реальностью, интерпретация всех социальных действий окружающих через призму бредовой системы — легкая психическая травма.<\/dd><\/dl><\/div><\/section><section class="grp" id="prosvetleniya"><h2>Просветления<\/h2><table><tr><th>Вид<\/th><th>Эффект<\/th><\/tr><tr><td>Малое<\/td><td>+1 к одному навыку, напрямую связанному с пережитым<\/td><\/tr><tr><td>Фундаментальное<\/td><td>+1 к аспекту<\/td><\/tr><\/table><div class="card "><h4>Сепарация<\/h4><div class="tags"><span class="tag">Фундаментальное<\/span><\/div><dl><dt>Условия<\/dt><dd>Долго подчинялся чужой воле; после внутренних противоречий окончательно рвет с прошлым окружением.<\/dd><dt>Бонус<\/dt><dd>+1 к Самоконтролю<\/dd><\/dl><\/div><div class="card "><h4>Отказ от мученичества<\/h4><div class="tags"><span class="tag g">Малое<\/span><\/div><dl><dt>Условия<\/dt><dd>Ситуация располагала к самопожертвованию, но персонаж осознанно выбрал выживание, поставив свои интересы выше интересов группы.<\/dd><dt>Бонус<\/dt><dd>+1 к Независимости<\/dd><\/dl><\/div><div class="card "><h4>Прощение без свидетеля<\/h4><div class="tags"><span class="tag g">Малое<\/span><\/div><dl><dt>Условия<\/dt><dd>Пережил предательство или тяжелый вред и простил обидчика в одностороннем порядке — без извинений, компенсации или публичного признания.<\/dd><dt>Бонус<\/dt><dd>+1 к Самообладанию<\/dd><\/dl><\/div><\/section><section class="grp" id="modifikacii"><h2>Модификации<\/h2><h3 class="sub">Проверка функционирования<\/h3><table><tr><th>Результат<\/th><th>Последствие<\/th><\/tr><tr><td>Успех<\/td><td>Модификация срабатывает как обычно<\/td><\/tr><tr><td>Ниже на 1<\/td><td>Не срабатывает<\/td><\/tr><tr><td>Ниже на 2–3<\/td><td>Блокируется до ремонта (кибер) или лечения (биологическая): Анатомия или Биохимия, Сл 13<\/td><\/tr><tr><td>Ниже на 4+<\/td><td>Тяжелая травма, связанная с зоной модификации<\/td><\/tr><\/table><h3 class="sub">Пример модификации<\/h3><div class="card "><h4>Гиперфазная мускулатура<\/h4><div class="tags"><span class="tag">Биологическая<\/span><span class="tag r">БА 4<\/span><\/div><dl><dt>Пассивный<\/dt><dd>+6 к Атлетике, +2 к Выносливости<\/dd><dt>Активная заявка<\/dt><dd>Физическое действие с «разрушительным» результатом (пробить, сбросить, вытолкнуть и т.п.)<\/dd><dt>Побочный эффект<\/dt><dd>−2 к Контролю, −2 к Осязанию<\/dd><dt>Триггер<\/dt><dd>После активации — средняя травма связок<\/dd><\/dl><\/div><\/section><\/div><footer>Arbor Echo · Следы Я · CC BY-NC 4.0<\/footer><\/div><script>( function (){ var deck = document.querySelector('.deck'); if (!deck) return ; var links = [].slice.call(document.querySelectorAll('.jump a[href^="#"]')); function sync(){ var best = -1,bd = 1e9,dr = deck.getBoundingClientRect();links.forEach( function (a,i){ var s = document.getElementById(a.getAttribute('href').slice(1)); if (!s) return ; var d = Math.abs(s.getBoundingClientRect().top - dr.top); if (d < bd){bd = d;best = i;}});links.forEach( function (a,i){a.classList.toggle('on',i === best);});} var t = null;deck.addEventListener('scroll', function (){sync();clearTimeout(t);t = setTimeout(sync,140);},{passive: true});window.addEventListener('resize',sync);sync();})();<\/script><\/body><\/html></script><script type="text/html" id="src-templates"><\!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arbor Echo — Шаблоны действий<\/title><style>:root{--bg:#111510;--bg2:#181d16;--bg3:#1e2519;--border:#354533;--gold:#c8a84b;--green:#7ab870;--teal:#4a9080;--text:#d5ccbc;--dim:#8a8175;--dim2:#6d6558;--red:#b05040;--orange:#c07840;--head:'Cinzel',Georgia,serif;--body:'IM Fell English',Georgia,serif;--mono:'Share Tech Mono','Courier New',monospace}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:70px}body{background:#0d100b;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:10px 0 12px}.wrap{width:100%;max-width:none;margin:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}header{text-align:center;border-bottom:2px solid var(--gold);padding:2px 14px 8px;margin:0 0 8px;flex:0 0 auto}header h1{font-family:var(--head);font-size:24px;letter-spacing:.14em;color:var(--gold)}header p{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}.jump{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-self:center;max-width:calc(100% - 28px);background:#10140e;border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:2px;padding:6px;margin-bottom:10px}.jump a.on{color:var(--gold);border-color:var(--border);background:rgba(200,168,75,.08)}.deck{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:hidden;overflow-y:auto;padding:2px 14px 10px}.jump a{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid transparent;padding:4px 8px;border-radius:2px}.jump a:hover{color:var(--gold);border-color:var(--border)}section.grp{margin:0;flex:0 0 auto;width:min(840px,100%);max-width:100%;height:auto;min-height:0;overflow:visible;background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:3px;padding:12px 16px 16px}h2{font-family:var(--head);font-size:19px;letter-spacing:.1em;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:12px}h3.sub{font-family:var(--head);font-size:13px;letter-spacing:.08em;color:var(--green);margin:18px 0 8px}p.lead{color:var(--dim);font-style:italic;margin-bottom:10px}p{margin-bottom:6px}ul{margin:4px 0 8px 20px}li{margin-bottom:3px}.card{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--gold);padding:10px 14px;margin-bottom:10px}.card.dark{border-left-color:var(--teal)}.card.red{border-left-color:var(--red)}.card.green{border-left-color:var(--green)}.card h4{font-family:var(--head);font-size:14px;letter-spacing:.06em;color:var(--text);margin-bottom:4px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);padding:2px 6px;border-radius:2px;background:#10140e}.tag.r{color:#e09080;border-color:#6a3a30}.tag.g{color:var(--green);border-color:#3f5a3a}.tag.t{color:#7ac0b0;border-color:#2e5a50}dl{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:14px}dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-top:2px}dd{color:var(--text)}table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px}th,td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:#10140e;font-weight:400}.note{border:1px dashed var(--border);padding:8px 12px;color:var(--dim);font-size:14px;margin:8px 0}.ref{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.04em}footer{flex:0 0 auto;margin-top:8px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:4px}}@media print{.jump{display:none!important}body{display:block;height:auto;overflow:visible;background:#fff;color:#000;padding:0}.wrap{display:block}.deck{display:block;overflow:visible;height:auto;padding:0}section.grp{display:block;width:auto;max-width:none;height:auto;overflow:visible;border:0;background:none;padding:0;margin:0 0 18px}.card{background:#fff;border:1px solid #999}}html::-webkit-scrollbar,*::-webkit-scrollbar{width:10px;height:10px}html::-webkit-scrollbar-track,*::-webkit-scrollbar-track{background:#0d100b}html::-webkit-scrollbar-thumb,*::-webkit-scrollbar-thumb{background:#354533;border:2px solid #0d100b;border-radius:0}html::-webkit-scrollbar-thumb:hover,*::-webkit-scrollbar-thumb:hover{background:#c8a84b}html::-webkit-scrollbar-corner,*::-webkit-scrollbar-corner{background:#0d100b}html,*{scrollbar-width:thin;scrollbar-color:#354533 #0d100b}<\/style><\/head><body><div class="wrap"><nav class="jump"><a href="#ataka">Атака<\/a><a href="#zashchita">Защита<\/a><a href="#peremeshchenie">Перемещение<\/a><a href="#monitoring">Мониторинг<\/a><a href="#socialnye">Социальные<\/a><a href="#zaklinaniya">Заклинания<\/a><\/nav><div class="deck"><section class="grp" id="ataka"><h2>Атака<\/h2><h3 class="sub">Подготовка к удару<\/h3><table><tr><th>Действие<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Прицеливание<\/td><td>Концентрация + Зрение<\/td><td>1 ОД (Подготовка)<\/td><td>Выбор уязвимого места. Условие: цель остается в поле зрения<\/td><\/tr><tr><td>Разгон<\/td><td>Атлетика + Выносливость<\/td><td>1 ОД (Подготовка)<\/td><td>Набор скорости для более мощного удара<\/td><\/tr><tr><td>Выбор момента<\/td><td>Чтение замысла + Зрение<\/td><td>1 ОД (Подготовка)<\/td><td>Ожидание, пока цель откроется<\/td><\/tr><tr><td>Финт<\/td><td>Манипулирование + Точная моторика<\/td><td>1 ОД<\/td><td>Вводит врага в заблуждение: следующая атака считается неожиданной. Подробнее — в разделе «Социальные»<\/td><\/tr><\/table><\/section><section class="grp" id="zashchita"><h2>Защита<\/h2><table><tr><th>Действие<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Уклонение<\/td><td>Встречный бросок<\/td><td>Реакция<\/td><td>Встречный бросок ≥ броска атакующего — урона нет. Меньше хотя бы на 1 — попадание проходит без снижения степени<\/td><\/tr><tr><td>Блок<\/td><td>Встречный бросок<\/td><td>Реакция<\/td><td>Встречный бросок ≥ атаки: базовая степень −2 ступени; меньше на 1: −1 ступень; меньше на 2 и более: без снижения<\/td><\/tr><tr><td>Группировка<\/td><td>Общая моторика + Контроль<\/td><td>3 ОД (реакция)<\/td><td>Снижает урон от падения или столкновения<\/td><\/tr><\/table><\/section><section class="grp" id="peremeshchenie"><h2>Перемещение<\/h2><table><tr><th>Действие<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Ориентация в Изнанке<\/td><td>Менталистика + Концентрация<\/td><td>2 ОД (1 ОД в раунд)<\/td><td>Перемещение по Изнанке (заклинание, см. также раздел «Заклинания»)<\/td><\/tr><\/table><h3 class="sub">Переходы по слоям Изнанки<\/h3><table><tr><th>Слой<\/th><th>Сл<\/th><\/tr><tr><td>Аффект (текущая мысль, вспышка)<\/td><td>9<\/td><\/tr><tr><td>Биография (память, привычки, травмы)<\/td><td>13<\/td><\/tr><tr><td>Культура (Тени, духи мест, боги, Храмы)<\/td><td>17<\/td><\/tr><tr><td>Запределье<\/td><td>21<\/td><\/tr><\/table><table><tr><th>Действие<\/th><th>Цена<\/th><\/tr><tr><td>Активация ориентации<\/td><td>2 ОД<\/td><\/tr><tr><td>Вход и каждая смена слоя<\/td><td>1 ОД<\/td><\/tr><tr><td>Пребывание<\/td><td>1 ОД в раунд<\/td><\/tr><tr><td>Провал<\/td><td>Задержка, повтор или осложнение<\/td><\/tr><\/table><table><tr><th>Результат броска<\/th><th>Последствие<\/th><\/tr><tr><td>Успех<\/td><td>Прибытие<\/td><\/tr><tr><td>Ниже на 1<\/td><td>Задержка, повтор без штрафа<\/td><\/tr><tr><td>Ниже на 2–3<\/td><td>Снос в ближайший бассейн, не связанный с целью; +1 к Сл всех дальнейших переходов в сцене<\/td><\/tr><tr><td>Ниже на 4+<\/td><td>Критический провал: снос и отпечаток<\/td><\/tr><\/table><\/section><section class="grp" id="monitoring"><h2>Мониторинг<\/h2><table><tr><th>Действие<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Реконструкция сцены<\/td><td>Пространственная логика + Чтение замысла + Восприятие<\/td><td>3 ОД<\/td><td>Воссоздание предшествующих событий по следам. Мастер раскрывает детали сцены или пласт, относящийся к выбранному чувству<\/td><\/tr><tr><td>Чувствительность<\/td><td>Концентрация + Проприоцепция + Восприятие<\/td><td>—<\/td><td>Восприятие и анализ чужих аур: выявляет следы магического воздействия и активные заклинания, помогает отслеживать чужое внимание (см. раздел «Заклинания»)<\/td><\/tr><tr><td>Проверки Восприятия<\/td><td>Восприятие<\/td><td>1 ОД<\/td><td>Базовая стоимость проверки Восприятия по правилам хода. Для сложных комбинаций стоимость суммируется по навыкам<\/td><\/tr><\/table><\/section><section class="grp" id="socialnye"><h2>Социальные<\/h2><table><tr><th>Действие<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Вывод по жесту<\/td><td>Зрение + Общая моторика + Чтение замысла<\/td><td>1 ОД<\/td><td>Чтение мимики, поз и положения тела для краткой характеристики состояния цели: «лжет», «напуган», «готовится к атаке»<\/td><\/tr><tr><td>Финт<\/td><td>Манипулирование + Точная моторика<\/td><td>1 ОД<\/td><td>Вводит собеседника или врага в заблуждение; следующая атака считается неожиданной<\/td><\/tr><tr><td>Проверки Харизмы<\/td><td>Харизма<\/td><td>1 ОД<\/td><td>Базовая стоимость социальной проверки по правилам хода<\/td><\/tr><\/table><\/section><section class="grp" id="zaklinaniya"><h2>Заклинания<\/h2><h3 class="sub">Ступень эффекта<\/h3><table><tr><th>Средний опорный навык<\/th><th>Ступень<\/th><\/tr><tr><td>до 5<\/td><td>I — Базовый<\/td><\/tr><tr><td>6–9<\/td><td>II — Продвинутый<\/td><\/tr><tr><td>10–13<\/td><td>III — Мастерский<\/td><\/tr><tr><td>14 и выше<\/td><td>IV — Легендарный<\/td><\/tr><\/table><h3 class="sub">Аура<\/h3><table><tr><th>Заклинание<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Чувствительность<\/td><td>Концентрация + Проприоцепция + Восприятие<\/td><td>—<\/td><td>Восприятие и анализ чужих аур, следы магии<\/td><\/tr><tr><td>Накопление<\/td><td>Концентрация<\/td><td>—<\/td><td>Восстановление резерва ×3; длительность сеанса зависит от Концентрации<\/td><\/tr><tr><td>Дистанционный контроль<\/td><td>Концентрация + Самообладание + Проприоцепция<\/td><td>1 ОД за раз / —<\/td><td>Отделение и контроль фрагментов ауры на расстоянии; Платоны фрагмента равны затратам<\/td><\/tr><tr><td>Диффузия<\/td><td>Концентрация + Проприоцепция<\/td><td>2 ОД / 1 Платон<\/td><td>Заклинания в пространстве внутри ауры цели; цель мгновенно замечает. Встречная проверка против Диффузии цели<\/td><\/tr><tr><td>Сонастройка<\/td><td>Восприятие + Концентрация + Проприоцепция<\/td><td>3 ОД / 1 Платон<\/td><td>Скрытная диффузия: мимикрия под чужую границу. Сложность — чужая Чувствительность<\/td><\/tr><tr><td>Подавление<\/td><td>Запугивание + Самообладание<\/td><td>2 ОД / выделенный резерв; далее 1 Платон в раунд<\/td><td>Выдавливание чужой ауры; резерв должен быть ≥ остатку цели<\/td><\/tr><tr><td>Абсорбция<\/td><td>Самообладание + Запугивание + Концентрация<\/td><td>3 ОД / кража = Концентрация/3 Платонов<\/td><td>Восстановление своих резервов за чужой счет<\/td><\/tr><\/table><h3 class="sub">Материя<\/h3><table><tr><th>Заклинание<\/th><th>Навыки<\/th><th>Стоимость<\/th><th>Описание<\/th><\/tr><tr><td>Фотокинез<\/td><td>Материя + Квантовая теория<\/td><td>4 ОД и 1 на поддержку / 1 Платон и 1 на поддержку<\/td><td>Контроль интенсивности света в области<\/td><\/tr><tr><td>Телекинез<\/td><td>Материя + Классическая физика<\/td><td>4 ОД / 3 Платона<\/td><td>Управление движением предметов на расстоянии<\/td><\/tr><tr><td>Термокинез<\/td><td>Материя + Электроморфизм + Классическая физика<\/td><td>3 ОД / 2 Платона<\/td><td>Нагрев и охлаждение веществ<\/td><\/tr><tr><td>Нагнетание разности потенциалов<\/td><td>Материя + Электроморфизм<\/td><td>3 ОД / 2 Платона<\/td><td>Электрическое напряжение между двумя точками<\/td><\/tr><tr><td>Восстановление / рекомбинирование структуры<\/td><td>Материя + Материаловедение + Реактивная/Синтетическая химия<\/td><td>4 ОД / 2 Платона<\/td><td>Ремонт или пересборка предметов на молекулярном уровне<\/td><\/tr><tr><td>Телепортация<\/td><td>Материя + Формальный анализ + Теория вероятностей + Квантовая теория<\/td><td>4 ОД / 4 Платона за каждые 5 кг<\/td><td>Перемещение между заранее подготовленными точками<\/td><\/tr><tr><td>Море Дирака<\/td><td>Материя + Электроморфизм + Про
