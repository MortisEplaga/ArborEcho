 очков навыков в зависимости от возраста<\/span><i>29<\/i><\/a><a class="tsc" href="#s137"><span>Приложение 3: Ступенчатая матрица эффектов ауры<\/span><i>30<\/i><\/a><a class="tsc" href="#s138"><span>Приложение 4: Ступенчатая матрица эффектов материи<\/span><i>31<\/i><\/a><a class="tsc" href="#s139"><span>Приложение 5: Ступенчатая матрица эффектов менталистики<\/span><i>32<\/i><\/a><a class="tsc" href="#s141"><span>Правовая информация<\/span><i>33<\/i><\/a><a class="tsc" href="#s142"><span>Примечания<\/span><i>33<\/i><\/a><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s1"><div class="pg-head"><div class="hl"><span class="k">Введение<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">1 / 33<\/span><\/div><\/div><div class="twocol"><p class="txt">Действие Arbor Echo происходит в альтернативном начале XX века. Эпоха пара и телеграфа существует здесь бок о бок с практической магией. Магия в этом мире — строгая дисциплина со своими правилами и ограничениями. У нее два основных направления. Материя изменяет физические свойства реальности: чтобы изменить вещество, маг должен понимать, какой физический закон он использует. Менталистика работает с Изнанкой — областью субъективного опыта и памяти. Маг должен понимать устройство чужого опыта и не смешивать его со своим. Оба направления работают только внутри ауры заклинателя и всегда имеют цену.<\/p><p class="txt">Вы создаете персонажей, чья жизнь связана с риском и постоянной адаптацией. Исследователи и авантюристы пытаются использовать опасные технологии, меняя мир вокруг себя, но этот процесс меняет и их самих. Любое изменение реальности или собственной биологии требует ресурсов и оставляет след на героях. Игровые механики подробно отслеживают последствия таких решений: телесные травмы и побочные эффекты в психике или в биологии.<\/p><p class="txt">Как и в других ролевых системах, повествование строится на коллективном воображении участников. Поскольку каждый человек за столом представляет сцену немного иначе, правила работают как инструмент синхронизации этих образов. Игровой процесс проходит через цикл заявок и проверок. Это помогает группе устанавливать границы возможностей персонажей в конкретных обстоятельствах.<\/p><p class="txt">Сеттинг создает напряженную атмосферу, где любое действие запускает цепь последствий. Система поощряет решительные действия персонажей, готовых принять плату за результат. Слишком глубокое погружение в магию и в собственную природу меняет самого героя.<\/p><h2 class="sh2" id="s2">Роль Мастера и Игроков<\/h2><p class="txt">Один из участников берет на себя роль Мастера. Он описывает окружение и управляет неигровыми персонажами, а также всегда<sup class="fn"><a href="#fn1" id="fnref1">[1]<\/a><\/sup> определяет результат любых действий в рамках правил. Остальные участники создают своих героев и управляют ими, принимая решения в предложенных обстоятельствах. Вместе вы создаете историю о людях, которые пытаются изменить себя и мир вокруг. Каждое решение запускает цепь конфликтов и изменений, а эхо этих действий возвращается к героям ценой здоровья и рассудка. Именно об этом говорит название игры: Arbor Echo — древо, в котором всякое действие пускает корни, эхом отдаваясь в кроне последствий.<\/p><h2 class="sh2" id="s3">Как читать Arbor Echo<\/h2><h3 class="sh3" id="s4">Если вы хотите просто поиграть<\/h3><ul class="bl kv"><li><b>Создание персонажа:<\/b> Начните с этого раздела<\/li><li><b>Минимальные механики:<\/b> Освойте порядок действий в игре и систему проверок<\/li><li><b>Модификации:<\/b> Для дополнительной кастомизации загляните сюда<\/li><li>Нет необходимости сразу углубляться в философию магии, мир будет раскрываться постепенно.<\/li><\/ul><h3 class="sh3" id="s5">Если вы хотите провести игру<\/h3><ul class="bl kv"><li>Изучите все разделы для Игроков, чтобы понимать их возможности.<\/li><li><b>Ход игры:<\/b> Разберитесь в роли Мастера и механике Сложности<\/li><li><b>След Я:<\/b> Поймите, как отмечаются травмы, патологии и просветления персонажей<\/li><li><b>Сторона Мастера:<\/b> Освойте приемы работы со сценами и построения кампании<\/li><\/ul><h3 class="sh3" id="s6">Если вы хотите копнуть как можно глубже<\/h3><ul class="bl kv"><li><b>Онтология:<\/b> Разберитесь, как работает Изнанка<\/li><li><b>Магия:<\/b> Изучите, как работают Гейсы и Стигматы<\/li><li><b>Сеттинг:<\/b> Ознакомьтесь с ним<\/li><\/ul><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s7"><div class="pg-head"><div class="hl"><span class="k">Создание персонажа<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">2 / 33<\/span><\/div><\/div><h2 class="sh2" id="s8">Предыстория<\/h2><div class="twocol"><p class="txt">Она объясняет прошлый опыт персонажа, его мотивации, связи и особенности характера. Хорошо продуманная предыстория помогает вам легче отыгрывать персонажа, а Мастеру — естественно вплести его в сюжет.<\/p><h3 class="sh3" id="s9">Идентичность и происхождение<\/h3><ul class="bl kv"><li><b>Имя и профессия:<\/b> Как персонаж известен в мире и чем он занимается в контексте альтернативного начала XX века.<\/li><li><b>Внешность и возраст:<\/b> Короткое описание внешности. Возраст влияет не только на образ, но и на стартовые характеристики и вероятность начальных «следов».<\/li><li><b>Отличительные черты:<\/b> Какие-то приметные особенности — манеры, привычки, детали поведения или внешности.<\/li><li><b>Происхождение:<\/b> Место рождения, социальный статус, культурная и национальная принадлежность — все, что сформировало взгляд персонажа на мир.<\/li><\/ul><h3 class="sh3" id="s10">Формирующий опыт и текущий контекст<\/h3><ul class="bl kv"><li><b>Ключевые события:<\/b> служба в армии, участие в конфликтах, научные открытия, личные утраты, удачные находки, встречи с влиятельными людьми.<\/li><li><b>Текущая ситуация:<\/b> Что привело персонажа к моменту начала игры? Каковы его обстоятельства, ресурсы и ближайшие устремления?<\/li><\/ul><h3 class="sh3" id="s11">Сеть связей<\/h3><ul class="bl kv"><li><b>Личные отношения:<\/b> Друзья, семья, наставники, соперники, враги. Уточните, что эти отношения значат для персонажа.<\/li><li><b>Организации и связи:<\/b> Великие Дома, академии, тайные общества, гильдии, криминальные группы — любые связи, которые могут повлиять на историю.<\/li><\/ul><h3 class="sh3" id="s12">Мотивация и внутренние конфликты<\/h3><ul class="bl kv"><li><b>Цели:<\/b> Чего персонаж стремится достичь (власть, знание, искупление, богатство, защита близких, изменение мира)? Каковы его долгосрочные амбиции?<\/li><li><b>Страхи и ограничения:<\/b> Что вызывает у персонажа глубочайший страх или трепет? Какие внутренние или внешние факторы его сдерживают?<\/li><\/ul><h3 class="sh3" id="s13">Согласование с сеттингом и группой<\/h3><p class="txt">Проверьте, что упомянутые вами места, организации и события подходят под канон мира (или под версию Мастера). Мастер может подсказать детали, которые помогут органично вписаться в мир.<\/p><p class="txt">Обсудите возможные связи между персонажами: общее прошлое, служба, дружба, родство, долги. Это укрепляет динамику группы и дает много готовых поводов для сцен и сюжетов.<\/p><h3 class="sh3" id="s14">Метод создания: от концепции к деталям<\/h3><ul class="bl kv"><li><b>Базовая идея:<\/b> Сформулируйте краткую суть персонажа вроде «разочарованный исследователь» или «наследник обедневшего рода».<\/li><li><b>Ключевые события:<\/b> Определите 2-3 наиболее важных события, кардинально повлиявших на жизнь персонажа и приведших его к текущему моменту. Свяжите их с возможными начальными "следами" или сильными убеждениями.<\/li><li><b>Характерные детали:<\/b> Обогатите концепцию яркими деталями<\/li><li><b>Оставьте пространство:<\/b> Предыстория не должна закрывать все вопросы. Пара неясных моментов позволит Мастеру развивать сюжет, а персонажу — меняться по ходу игры<\/li><\/ul><\/div><h2 class="sh2" id="s15">Возраст<\/h2><p class="txt">Возраст персонажа в Arbor Echo определяет его начальные возможности, психологическую гибкость и следы прожитых лет. Он напрямую влияет на количество очков навыков<sup class="fn"><a href="#fn2" id="fnref2">[2]<\/a><\/sup> и вносит нарративные особенности.<\/p><table class="tb"><colgroup><col style="width:13%"><col style="width:12%"><col style="width:75%"><\/colgroup><tr><th>Категория<\/th><th>Возраст<\/th><th>Особенности<\/th><\/tr><tr><td class="">Юный<\/td><td class="">10—19<\/td><td class="L">Эти персонажи впечатлительны, открыты новому опыту и быстрее адаптируются к изменениям в восприятии мира. Просветления им получать легко.<\/td><\/tr><tr><td class="">Молодой<\/td><td class="">20—34<\/td><td class="L">Персонажи обладают сформированными навыками и опытом, достаточным для уверенного старта, но их психика еще сохраняет значительную гибкость.<\/td><\/tr><tr><td class="">Зрелый<\/td><td class="">35—50<\/td><td class="L">Персонажи обладают большим начальным багажом компетенций. Телесные или психические начальные "следы" становятся вероятными. Просветления им получать сложнее.<\/td><\/tr><tr><td class="">Пожилой<\/td><td class="">51—84<\/td><td class="L">Наличие начальных телесных или психических "следов" обязательно. Они должны отражать его уникальный жизненный путь, профессию и пережитые испытания. Если Игрок не отметил их при создании, Мастер вправе добавить их до начала игры. Просветления они могут получить только в экстремальных случаях.<\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Создание персонажа<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">3 / 33<\/span><\/div><\/div><div class="twocol"><h2 class="sh2" id="s16">Характеристики, аспекты и навыки<\/h2><p class="txt">В AE существует 5 характеристик: Эрудиция, Харизма, Воля, Телосложение и Восприятие. Каждая характеристика делится на аспекты — области ее применения. Каждый аспект включает три навыка, отвечающие за конкретные специализации. Подробные описания всех характеристик, аспектов и навыков приведены в отдельном приложении<sup class="fn"><a href="#fn3" id="fnref3">[3]<\/a><\/sup>.<\/p><p class="txt">В зависимости от возраста, особенностей организма и прочих модификаций между навыками распределяются очки. Получившееся значение у каждого навыка называется первичным. Далее, вычисляются значения аспектов, характеристик и результирующее значение навыка.<\/p><p class="txt">Подсчеты ведутся по следующему принципу:<\/p><div class="f"><span class="fl">Значение аспекта<\/span> = <span class="fe">среднее арифметическое входящих в этот аспект навыков<\/span><\/div><div class="f"><span class="fl">Значение характеристики<\/span> = <span class="fe">среднее арифметическое входящих в эту характеристику аспектов<\/span><\/div><div class="f"><span class="fl">Результирующее значение навыка<\/span> = <span class="fe">сумма первичного значения, соответствующего аспекта и соответствующей характеристики.<\/span><\/div><p class="txt">Аспекты и характеристики хранятся дробными. Округление на этих этапах не производится: величина аспекта идет в расчет характеристики как есть, величина характеристики идет в расчет результирующего значения как есть. Округление применяется один раз — к итогу: 0,5 и выше вверх, меньше 0,5 вниз.<\/p><p class="txt">Округляются результирующие значения навыков и все вторичные характеристики (ОД, Порог биоагрессивности, магические лимиты и т. д.). Их формулы используют неокругленные значения аспектов и характеристик. Значения аспектов и характеристик в листе персонажа показываются с точностью до двух знаков — для справки, в расчет идет полное значение.<\/p><p class="txt">При использовании автоматического листа персонажа все результирующие значения навыков и вторичные характеристики (ОД, Порог биоагрессивности, магические лимиты и т.д.) рассчитываются системой самостоятельно. Лист считает все сам — вводите только первичные значения.<\/p><p class="txt">Очки вкладываются в любые навыки произвольно, кроме относящихся к аспектам Здоровья и Изнанки. Навыки Здоровья заполняются из отдельного пула, а в Изнанку — строго через Просветления (или через стартовую одаренность). Первичное значение любого навыка не может превышать 5 при создании персонажа и 10 по ходу игры. Потолок считается до бонусов: аспект, характеристика, модификации, Просветления и Гейсы добавляются поверх него и потолком не ограничиваются.<\/p><h2 class="sh2" id="s17">Вторичные характеристики<\/h2><h3 class="sh3" id="s18">Очки действий (ОД)<\/h3><p class="txt">Это один из ключевых элементов игровой механики. Они показывают, сколько действий персонаж способен выполнить за ограниченный отрезок времени. В боевых сценах количество ОД также определяет порядок хода. Чем их больше — тем лучше.<\/p><div class="f"><span class="fl">ОД<\/span> = <span class="fe">2 + Сумма аспектов Самоконтроля, Моторики и лучшего аспекта Восприятия<\/span><\/div><h3 class="sh3" id="s19">Порог биоагрессивности<\/h3><p class="txt">Это показатель, определяющий, сколько модификаций организм персонажа способен выдержать без негативных последствий.<\/p><div class="f"><span class="fl">Порог биоагрессивности<\/span> = <span class="fe">Сумма первичных навыков Здоровья + Аспект Силы<\/span><\/div><p class="txt">При его превышении персонаж получает патологии, сумма степеней которых равна величине превышения, — одну или несколько, на усмотрение Мастера. Они связаны с модификацией с наибольшей биоагрессивностью. Какие именно это патологии и как они проявляются, Мастер определяет на месте.<\/p><h3 class="sh3" id="s20">Магия<\/h3><p class="txt">Подробное раскрытие идет в соответствующем разделе<sup class="fn"><a href="#fn4" id="fnref4">[4]<\/a><\/sup>, здесь приведены лишь формулы расчетов вторичных характеристик, связанных с этой частью механик<\/p><div class="f"><span class="fl">Максимальный запас ауры<\/span> = <span class="fe">Самоконтроль*5 + Здоровье*2 Платонов<\/span><\/div><div class="f"><span class="fl">Скорость восстановления Платонов<\/span> = <span class="fe">Самоконтроль*3 + Здоровье Платонов в сутки<\/span><\/div><div class="f"><span class="fl">Дальность поля применения заклинаний<\/span> = <span class="fe">Сумма Аспектов Воли * Текущий/Максимальный запас ауры в метрах<\/span><\/div><div class="f"><span class="fl">Максимум Гейсов<\/span> = <span class="fe">(Сумма Аспектов Эрудиции и Воли)/3<\/span><\/div><div class="f"><span class="fl">Время внедрения одного Гейса<\/span> = <span class="fe">Сумма Аспектов Эрудиции и Воли<\/span><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s21"><div class="pg-head"><div class="hl"><span class="k">Ход игры<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">4 / 33<\/span><\/div><\/div><h2 class="sh2" id="s22">Роль Мастера и Игроков<\/h2><div class="twocol"><p class="txt">Игровой процесс строится вокруг взаимодействия между Мастером и Игроками. Вместе они создают историю, двигаясь через повторяющийся цикл «заявка — проверка — результат».<\/p><h3 class="sh3" id="s23">0. Введение в ситуацию<\/h3><p class="txt">Перед тем как Игроки начнут действовать, Мастер задает контекст, описывая:<\/p><ul class="bl"><li>Место: где находятся персонажи, включая важные детали обстановки<\/li><li>Обстоятельства: что происходит прямо сейчас, какие события уже в движении<\/li><li>Возможности: очевидные пути взаимодействия с миром<\/li><\/ul><p class="txt">После этого инициатива переходит к Игрокам.<\/p><h3 class="sh3" id="s24">1. Заявка Игрока<\/h3><p class="txt">Игрок объявляет, что делает его персонаж. Заявка должна быть максимально четкой и описывать:<\/p><ul class="bl"><li>Цель: Чего он хочет достичь<\/li><li>Действие: Что персонаж делает физически<\/li><li>Метод: Как он это делает<\/li><\/ul><p class="txt">Чем яснее заявка, тем точнее Мастер сможет на нее ответить.<\/p><h3 class="sh3" id="s25">2. Работа Мастера<\/h3><p class="txt">Мастер анализирует заявку и определяет, требует ли она:<\/p><ul class="bl"><li>Простого разрешения: если исход очевиден, Мастер сразу его описывает<\/li><li>Проверки: если исход действия не очевиден, требуется бросок<\/li><li>Уточнения: если заявка расплывчата, Мастер задает уточняющие вопросы<\/li><\/ul><h3 class="sh3" id="s26">3. Проверка (если требуется)<\/h3><p class="txt">Если действие связано с неопределенностью, Мастер определяет:<\/p><ul class="bl"><li>Какие навыки участвуют в проверке<\/li><li>Сложность<\/li><li>Модификаторы обстоятельств<\/li><\/ul><p class="txt">Игрок бросает 2d6 и прибавляет результирующие значения всех навыков, участвующих в проверке: сколько навыков заявлено в проверке, столько слагаемых и в броске. Две шестерки на кубах — критический успех.<\/p><p class="txt">В случае встречной проверки оба участника совершают бросок, и разница между результатами показывает степень провала у набравшего меньший результат.<\/p><p class="txt">После чего Мастер интерпретирует результат.<\/p><h3 class="sh3" id="s27">4. Описание результата<\/h3><p class="txt">Мастер сравнивает итоговую сумму со Сложностью:<\/p><ul class="bl"><li>Успех — достижение цели: сумма равна сложности или превышает ее<\/li><li>Частичный успех — компромисс: сумма ниже сложности на 1<\/li><li>Провал — неудача: ниже на 2–3<\/li><li>Критический провал — неудача с осложнениями: ниже сложности на 4 и более<\/li><\/ul><p class="txt">Критический успех может дать Игроку право на однократный автоуспех действия, которое в обычной ситуации потребовало бы подготовки или риска. Решение об этом принимает Мастер.<\/p><p class="txt">Условие — короткое, понятное объяснение Игрока: что именно произошло в момент критического успеха. Если объяснение уместно, Мастер подтверждает заявку. Если нет — результат трактуется как обычный успех без дополнительных преимуществ.<\/p><h3 class="sh3" id="s28">5. Развитие ситуации<\/h3><p class="txt">Каждое действие влияет на мир: Мастер обновляет ситуацию, а Игроки принимают решения, исходя из новых данных. Цикл продолжается до завершения сцены или всей истории.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Ход игры<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">5 / 33<\/span><\/div><\/div><h2 class="sh2" id="s29">Механика хода<\/h2><div class="twocol"><p class="txt">В обычных условиях персонажи действуют в свободном порядке. В динамичных или опасных сценах (бой, погоня и т. п.) время делится на раунды примерно по 5 секунд.<\/p><p class="txt">В основе механики лежат Очки Действий (ОД) — они определяют, сколько действий персонаж может совершить за свой ход.<\/p><h3 class="sh3" id="s30">Очередность ходов<\/h3><ul class="bl"><li>В начале сцены все участники объявляют свое текущее значение ОД.<\/li><li>Порядок ходов определяется по убыванию ОД: кто имеет больше ОД, действует первым.<\/li><li>При равенстве ОД приоритет всегда у персонажей Игроков.<\/li><li>Порядок ходов внутри групп (Игроков или НИПов) участники могут определить по договоренности.<\/li><\/ul><h3 class="sh3" id="s31">Стоимость действий<\/h3><p class="txt">На каждом ходу персонаж может совершать действия, тратя свои ОД.<\/p><ul class="bl"><li>Простые действия (осмотреться, крикнуть, поднять предмет): 0 ОД (если действие уместно).<\/li><li>Проверки навыков Эрудиции, Харизмы и Восприятия: 1 ОД.<\/li><li>Проверки других навыков или сложные действия: 1-2 ОД (точную стоимость определяет Мастер).<\/li><li>Совместная проверка: Если действие требует использования нескольких навыков одновременно, итоговая стоимость ОД равна сумме стоимостей каждого из задействованных навыков<\/li><\/ul><h3 class="sh3" id="s32">Активная фаза хода и период реакций<\/h3><p class="txt">Персонажи начинают раунд с максимальным количеством ОД (активными и для реакций).<\/p><p class="txt">Неиспользованные ОД не переносятся на следующий раунд, но повышают запас ОД для реакций.<\/p><p class="txt">Завершив активную фазу хода, персонаж переходит в период реакций. В это время он может действовать только в ответ на чужие действия и тратить ОД из резерва реакций.<\/p><h3 class="sh3" id="s33">Продолженные действия и нехватка ресурсов<\/h3><p class="txt">Если для действия не хватает ОД или Платонов, персонаж может начать его выполнение, если соблюдены условия:<\/p><ul class="bl"><li>У него есть хотя бы 1 ОД или 1 Платон<\/li><li>Он объявляет, что начинает действие, рассчитанное на несколько раундов<\/li><\/ul><p class="txt">В этом случае:<\/p><ul class="bl"><li>Персонаж тратит все доступные на текущий момент ОД/Платоны на это действие.<\/li><li>Действие считается начатым, но незавершенным.<\/li><li>Персонаж считается концентрирующимся и может быть прерван<\/li><li>В начале каждого следующего хода он обязан вкладывать ОД/Платоны, пока не будет достигнута полная стоимость<\/li><li>Персонаж может выполнять сторонние действия, не прерывая основного, но суммарно тратить на них ОД не больше своего значения Концентрации.<\/li><\/ul><p class="txt">Как только накоплена необходимая сумма ОД/Платонов, действие завершается.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s34"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">6 / 33<\/span><\/div><\/div><div class="twocol"><p class="txt">След Я — это устойчивое изменение, которое остается с персонажем после какого-либо события. Это может быть что-то внешнее вроде шрама, или внутреннее — новая манера реагировать, страх, изменившиеся убеждения.<\/p><p class="txt">Следы не являются обязательным элементом каждой сцены или каждой игровой сессии. Их отсутствие само по себе не проблема. Но если персонаж долго проходит через важные события и при этом на нем не остается никаких следов, это обычно говорит о том, что либо игрок почти не вовлечен, либо сознательно избегает изменений.<\/p><p class="txt">Патологии, просветления, долгосрочные последствия травм и биологические модификации применяются к первичным значениям навыков, а немедленные штрафы травм и кибернетические модификации — к результирующим.<\/p><h2 class="sh2" id="s35">Травмы<\/h2><p class="txt">Это серьезное физическое повреждение, которое надолго меняет возможности персонажа.<\/p><h3 class="sh3" id="s36">Градации травм<\/h3><div class="keep"><p class="txt">Они подразделены на четыре степени:<\/p><\/div><table class="tb"><colgroup><col style="width:17%"><col style="width:83%"><\/colgroup><tr><th>Степень<\/th><th>Описание<\/th><\/tr><tr><td class="">Легкие травмы<\/td><td class="L">это ссадины, неглубокие порезы, синяки и похожие повреждения. Они почти не мешают действовать: персонаж может их игнорировать, но использовать в описаниях, если это уместно. Если такие травмы не лечить, со временем возможны осложнения.<\/td><\/tr><tr><td class="">Средние травмы<\/td><td class="L">это переломы, растяжения связок, вывихи, сотрясения мозга, заметные ранения в неопасных местах и иные аналогичные повреждения. Они могут осложнить некоторые действия, но не несут непосредственной угрозы жизни. Без лечения могут зажить неправильно или дать серьезные последствия.<\/td><\/tr><tr><td class="">Тяжелые травмы<\/td><td class="L">это обильные кровотечения, серьезные удары по голове, повреждение внутренних органов и другие похожие состояния. Без быстрой медицинской помощи персонаж почти наверняка погибнет. Даже при хорошем лечении такие травмы обычно оставляют длительные ограничения.<\/td><\/tr><tr><td class="">Критические травмы<\/td><td class="L">это красочная картина смерти. Персонажа могут выпотрошить от паха до горла, разорвать пополам, прострелить голову, взорвать ему легкие, освежевать или провести с ним иные фатальные манипуляции. Персонаж наверняка умрет, ему может помочь только чудо.<\/td><\/tr><\/table><h3 class="sh3" id="s37">Штрафы к Здоровью<\/h3><div class="keep"><p class="txt">Каждая травма накладывает немедленный штраф к одному из навыков Здоровья:<\/p><ul class="bl"><li>Легкая травма на 1<\/li><li>Средняя травма на 2<\/li><li>Тяжелая травма на 3<\/li><\/ul><\/div><div class="keep"><p class="txt">Какой именно навык определяет Мастер, но он может воспользоваться перечислением ниже:<\/p><ul class="bl df"><li><b>Нейромоторика<\/b> — Перелом, Разрыв связок, Контузия, Удар током<\/li><li><b>Метаболизм<\/b> — Ожог, Обморожение, Кровотечение<\/li><li><b>Гомеостаз<\/b> — Анафилактический шок<\/li><\/ul><\/div><h3 class="sh3" id="s38">Штрафы от локализации<\/h3><p class="txt">Каждая травма привязана к конкретной части тела. Из-за этого она ограничивает работу того специализированного навыка, который связан с поврежденной областью.<\/p><ul class="bl"><li>Повреждение головы снижает Концентрацию.<\/li><li>Повреждение торса снижает Выносливость<\/li><li>Повреждение рук снижает Точную моторику<\/li><li>Повреждение ног снижает Общую моторику<\/li><li>Повреждение органов чувств снижает соответствующий навык Восприятия.<\/li><li>Повреждение внутренних органов дополнительно снижает Здоровье.<\/li><\/ul><p class="txt">Эти дополнительные ограничения накладываются сверх штрафа к Здоровью и имеют то же численное значение. Исключение составляют травмы внутренних органов: независимо от степени, они всегда дают −1 к Здоровью.<\/p><h3 class="sh3" id="s39">Лечение травм<\/h3><p class="txt">Травма может быть устранена хирургическим вмешательством или медикаментозно.<\/p><p class="txt">Операция требует навыков Анатомии у лечащего и Метаболизма у пациента. Это одна проверка, которую совершает врач: к броску прибавляется сумма результирующих значений его Анатомии и Метаболизма пациента.<\/p><p class="txt">Медикаментозное лечение требует навыков Биохимии и Гомеостаза соответственно — также одной проверкой на сумму двух результирующих значений.<\/p><div class="keep"><p class="txt">Сложность лечения зависит от степени травмы:<\/p><table class="tb"><colgroup><col style="width:62%"><col style="width:38%"><\/colgroup><tr><th>Степень<\/th><th>Сложность<\/th><\/tr><tr><td class="L">Легкая травма<\/td><td class="">сложность 10<\/td><\/tr><tr><td class="L">Средняя травма<\/td><td class="">сложность 14<\/td><\/tr><tr><td class="L">Тяжелая травма<\/td><td class="">сложность 18<\/td><\/tr><\/table><\/div><p class="txt">Провал при лечении ухудшает травму. Успешное лечение устраняет ее, но все еще может оставить последствия.<\/p><p class="txt">Травма внутренних органов повышает сложность лечения на 2.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">7 / 33<\/span><\/div><\/div><div class="twocol"><h3 class="sh3" id="s40">Восстановление после лечения<\/h3><p class="txt">Даже после успешного лечения травма требует времени на восстановление.<\/p><div class="keep"><p class="txt">Базовая длительность:<\/p><ul class="bl"><li>Легкая травма восстанавливается за 4 дня.<\/li><li>Средняя травма — за 9 дней.<\/li><li>Тяжелая травма — за 16 дней.<\/li><\/ul><\/div><div class="keep"><p class="txt">Коэффициент восстановления умножается на базовую длительность и рассчитывается по формуле:<\/p><div class="f"><span class="fe">1.5 - (Метаболизм + Гомеостаз + Модификатор условий лечения) * 0.05.<\/span><\/div><\/div><div class="keep"><p class="txt">Значения условий:<\/p><table class="tb"><colgroup><col style="width:78%"><col style="width:22%"><\/colgroup><tr><th>Условия лечения<\/th><th>Модификатор<\/th><\/tr><tr><td class="L">При игнорировании или перегрузке<\/td><td class="">-2<\/td><\/tr><tr><td class="L">При неоптимальном режиме<\/td><td class="">-1<\/td><\/tr><tr><td class="L">При нейтральных условиях<\/td><td class="">0<\/td><\/tr><tr><td class="L">При постельном режиме и внимательном уходе<\/td><td class="">+1<\/td><\/tr><tr><td class="L">При специализированной помощи<\/td><td class="">+2<\/td><\/tr><\/table><\/div><p class="txt">В период восстановления применяются штрафы, аналогичные таковым у легкой степени травмы.<\/p><h3 class="sh3" id="s41">Последствия травм<\/h3><p class="txt">После тяжелой травмы персонаж навсегда теряет 1 пункт в одном специализированном навыке, связанном с пораженной зоной.<\/p><h3 class="sh3" id="s42">Срочные травмы<\/h3><p class="txt">Некоторые травмы считаются срочными, например, кровотечения. Это значит, что у персонажа есть ограниченное число раундов до того, как наступят серьезные последствия.<\/p><div class="keep"><p class="txt">Количество раундов рассчитывается так:<\/p><table class="tb"><colgroup><col style="width:48%"><col style="width:52%"><\/colgroup><tr><th>Степень<\/th><th>Раундов до последствий<\/th><\/tr><tr><td class="L">Средняя травма<\/td><td class="">4 + Метаболизм<\/td><\/tr><tr><td class="L">Тяжелая травма<\/td><td class="">2 + Метаболизм<\/td><\/tr><\/table><\/div><p class="txt">Чтобы предотвратить ухудшение, травму нужно стабилизировать.<\/p><p class="txt">Стабилизация — это упрощенная форма лечения. Она проводится теми же навыками и с той же сложностью, но лишь останавливает обратный отсчет и предотвращает обострение.<\/p><p class="txt">Если счетчик доходит до нуля, травма либо усугубляется, либо приводит к потере сознания, необратимому повреждению или смерти — решение принимает Мастер.<\/p><h3 class="sh3" id="s43">Игнорирование боли<\/h3><p class="txt">Персонаж может попытаться преодолеть боль, чтобы действовать.<\/p><div class="keep"><p class="txt">Это требует отдельной проверки Самообладания - Интероцепции:<\/p><table class="tb"><colgroup><col style="width:58%"><col style="width:42%"><\/colgroup><tr><th>Степень<\/th><th>Сложность<\/th><\/tr><tr><td class="L">Легкая травма<\/td><td class="">сложность 7<\/td><\/tr><tr><td class="L">Средняя<\/td><td class="">сложность 11<\/td><\/tr><tr><td class="L">Тяжелая<\/td><td class="">сложность 15<\/td><\/tr><\/table><\/div><p class="txt">Проверка совершается в момент, когда персонаж собирается совершить действие, которому мешает травма: бег с поврежденной ногой, взмахи сломанной рукой или крик с пробитым легким.<\/p><p class="txt">При успехе действие совершается.<\/p><p class="txt">При провале — оно срывается, и Мастер может усугубить травму.<\/p><p class="txt">Каждая повторная попытка игнорирования боли в течение сцены увеличивает сложность на 1.<\/p><p class="txt">Игнорирование боли не отменяет штрафов от травмы.<\/p><\/div><h3 class="sh3" id="s44">Примеры травм<\/h3><p class="txt">Ниже находится небольшой список примеров травм:<\/p><div class="cards c3"><div class="card"><div class="cn">Перелом<\/div><div class="cr"><i>Степень<\/i><span>Средняя<\/span><\/div><div class="cr"><i>Локализация<\/i><span>Нога (левая)<\/span><\/div><div class="cr"><i>Пассивный эффект<\/i><span>Нейромоторика -2, Общая моторика -2<\/span><\/div><div class="cr"><i>Лечение<\/i><span>Анатомия/Метаболизм Сл 14<\/span><\/div><\/div><div class="card"><div class="cn">Солнечный удар<\/div><div class="cr"><i>Степень<\/i><span>Легкая<\/span><\/div><div class="cr"><i>Локализация<\/i><span>Голова<\/span><\/div><div class="cr"><i>Пассивный эффект<\/i><span>Гомеостаз -1, Концентрация -1<\/span><\/div><div class="cr"><i>Лечение<\/i><span>Биохимия/Гомеостаз Сл 10.<\/span><\/div><\/div><div class="card"><div class="cn">Разрыв печеночной артерии<\/div><div class="cr"><i>Степень<\/i><span>Тяжелая (срочная)<\/span><\/div><div class="cr"><i>Локализация<\/i><span>Торс (печень)<\/span><\/div><div class="cr"><i>Пассивный эффект<\/i><span>Метаболизм -4, Гомеостаз -1, Нейромоторика -1, Выносливость -3<\/span><\/div><div class="cr"><i>Лечение<\/i><span>Анатомия/Метаболизм Сл 20. После успеха и реабилитации: -1 к Выносливости.<\/span><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">8 / 33<\/span><\/div><\/div><h2 class="sh2" id="s45">Психические травмы<\/h2><div class="twocol"><p class="txt">Это временное нарушение, которое меняет поведение или мировосприятие персонажа.<\/p><p class="txt">Игрок сам решает, получает ли его персонаж психическую травму после тяжелого события.<\/p><h3 class="sh3" id="s46">Зачем это нужно?<\/h3><p class="txt">Добровольное принятие травмы — это инструмент для глубокого отыгрыша. Вы сознательно ограничиваете персонажа, чтобы показать его уязвимость. Такая честность по отношению к своему персонажу может быть позже вознаграждена Мастером, например, через Просветления.<\/p><h3 class="sh3" id="s47">Отличия от физических травм<\/h3><ul class="bl"><li>Штрафы: к аспектам Самоконтроля в основе, и, вторично, к навыку, наиболее связанному со сценой получения<\/li><li>Системы лечения и восстановления: вместо Метаболизма/Анатомии и Гомеостаза/Биохимии применяется Самообладание/Убеждение.<\/li><li>В остальном они идентичны.<\/li><\/ul><p class="txt">Ниже пример подобного нарушения:<\/p><div class="cards c1"><div class="card"><div class="cn">Информационный перегруз<\/div><div class="cr"><i>Степень<\/i><span>Легкая<\/span><\/div><div class="cr"><i>Пассивный эффект<\/i><span>Самообладание -1, Концентрация -1<\/span><\/div><div class="cr"><i>Лечение<\/i><span>Убеждение/Самообладание Сл 10<\/span><\/div><\/div><\/div><\/div><h2 class="sh2" id="s48">Соматические травмы<\/h2><div class="twocol"><p class="txt">Временные телесные нарушения, вызванные стрессом или психическим срывом. Они проявляются через тело, но в первую очередь бьют по самообладанию. Чаще всего получаются при неудачной или пропущенной медитации по очистке Резонансного эха.<\/p><p class="txt">Ниже пример подобного нарушения:<\/p><div class="cards c1"><div class="card"><div class="cn">Психогенный тремор<\/div><div class="cr"><i>Степень<\/i><span>Легкая<\/span><\/div><div class="cr"><i>Пассивный эффект<\/i><span>Самообладание -1, Точная моторика -1<\/span><\/div><div class="cr"><i>Лечение<\/i><span>Убеждение/Самообладание Сл 10<\/span><\/div><\/div><\/div><h3 class="sh3" id="s49">Отличия от физических травм<\/h3><p class="txt">Штрафы: к аспектам Самоконтроля в основе (как при психических), и, вторично, к специализированному навыку, связанному с локализацией (как при физических).<\/p><\/div><h2 class="sh2" id="s50">Урон и защита<\/h2><div class="twocol"><div class="keep"><p class="txt">Каждый источник повреждения имеет фиксированную базовую степень, определяющую тяжесть травмы при попадании:<\/p><table class="tb"><colgroup><col style="width:17%"><col style="width:83%"><\/colgroup><tr><th>Базовая степень<\/th><th>Источники<\/th><\/tr><tr><td class="">Легкая<\/td><td class="L">удары кулаками, толчки, попадания брошенными камнями<\/td><\/tr><tr><td class="">Средняя<\/td><td class="L">удары ножом, кастетом, попадание из малокалиберного пистолета, ожоги от недолгого контакта с пламенем, падение с двух-трех метров, контакт с серной кислотой<\/td><\/tr><tr><td class="">Тяжелая<\/td><td class="L">протыкание копьем, попадание из винтовки или крупнокалиберного пистолета, удар током от ЛЭП, обширные ожоги, падения с высоты второго-третьего этажа<\/td><\/tr><tr><td class="">Критическая<\/td><td class="L">удар молнией, сгорание заживо, попадание из артиллерии, падение из самолета без парашюта, ванна с жидким азотом или фторсульфоновой кислотой<\/td><\/tr><\/table><\/div><h3 class="sh3" id="s51">Повышение базовой степени<\/h3><p class="txt">Персонаж может потратить отдельное действие перед атакой, чтобы увеличить базовую степень травм для следующего удара на одну ступень.<\/p><p class="txt">Бонус теряется, если персонаж получает травму или выполняет иное действие между подготовкой и атакой.<\/p><div class="keep"><p class="txt">Примеры:<\/p><ul class="bl df"><li><b>Прицеливание<\/b> — выбор уязвимого места. Типичная проверка: Концентрация + Зрение. Условие: цель должна оставаться в поле зрения.<\/li><li><b>Разгон<\/b> — набор скорости для более мощного удара. Типичная проверка: Атлетика + Выносливость.<\/li><li><b>Выбор момента<\/b> — ожидание, пока цель откроется. Типичная проверка: Чтение замысла + Зрение.<\/li><\/ul><\/div><p class="txt">Конкретная форма подготовки определяется заявкой Игрока. Принцип един: отдельное действие, отдельная проверка, +1 к базовой степени при успехе.<\/p><h3 class="sh3" id="s52">Реакция на атаку<\/h3><div class="keep"><p class="txt">Когда персонаж атакует, он совершает бросок. Цель атаки до своего броска выбирает один из двух вариантов реакции:<\/p><ul class="bl df"><li><b>Уклонение<\/b> — цель совершает встречный бросок. Если результат равен или превышает бросок атакующего — урона нет. Если результат меньше хотя бы на 1 — попадание проходит без снижения<\/li><li><b>Блок<\/b> — цель совершает встречный бросок. Базовая степень травмы снижается в зависимости от результата: если результат равен или превышает бросок атакующего — -2 ступени, если меньше на единицу — -1 ступень, меньше на два и более — без снижения.<\/li><\/ul><\/div><p class="txt">В обоих случаях проверки задействуют столько же навыков, сколько и атака. И правила повышения базовой степени работают симметрично — наличие укрытий и прочих обстоятельств может помочь снизить ущерб.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">9 / 33<\/span><\/div><\/div><h2 class="sh2" id="s53">Патологии<\/h2><div class="grid2"><div class="col"><p class="txt">В ходе сюжета персонажи могут заболеть или приобрести хронические нарушения. Некоторые проходят сами, другие требуют помощи специалиста, а третьи неизлечимы. Снятие патологии — сюжетная задача. Цель патологий — добавить глубины отыгрышу, создавая уязвимости.<\/p><h3 class="sh3" id="s54">Обострение патологий<\/h3><p class="txt">Патология действует в двух фазах: <b>фоновая симптоматика<\/b> (постоянный штраф) и <b>обострение<\/b> (острый кризис, требующий немедленной реакции).<\/p><p class="txt"><b>Степень патологии<\/b> (число от 1 до 6) равна сумме модулей ее пассивных штрафов:<\/p><div class="f"><span class="fl">Порог триггера<\/span> = <span class="fe">6 − Степень патологии<\/span><\/div><p class="txt"><b>Направления напряжения<\/b> показывают, насколько сцена давит на патологию (оценка от 1 до 3 по каждой оси):<\/p><ul class="bl df"><li><b>Нагрузка<\/b> — требует ли сцена работы поврежденной функции сверх текущей емкости (усилие, темп, точность, выносливость, концентрация).<\/li><li><b>Среда<\/b> — нарушает ли обстановка условия стабильности (температура, влажность, грязь, химия, шум, теснота, отсутствие ухода).<\/li><li><b>Аффект<\/b> — эмоциональное давление, резонирующее с травмой (страх, ярость, стыд, паника, беспомощность, триггеры памяти).<\/li><\/ul><table class="tb"><colgroup><col style="width:26%"><col style="width:24%"><col style="width:25%"><col style="width:25%"><\/colgroup><tr><th>Ось<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td class="rh">Нагрузка<\/td><td class="">Слегка задевает<\/td><td class="">Грузит функцию<\/td><td class="">И здорового потревожит<\/td><\/tr><tr><td class="rh">Среда<\/td><td class="">Слегка отклонена<\/td><td class="">Заметно нарушена<\/td><td class="">Прямо противоречит<\/td><\/tr><tr><td class="rh">Аффект<\/td><td class="">Легкое волнение<\/td><td class="">Сильный стресс<\/td><td class="">Бьет точно в травму<\/td><\/tr><\/table><p class="txt"><b>Проверка и обострение:<\/b> В карточке задано подмножество осей. Если <i>сумма значений по релевантным осям ≥ порог триггера<\/i>, срабатывает обострение.<\/p><p class="txt">Мощность кризиса зависит от степени: при <b>1–2<\/b> — легкая травма, <b>3–4<\/b> — средняя, <b>5–6<\/b> — тяжелая.<\/p><\/div><div class="col"><h3 class="sh3" style="margin-top:0">Примеры патологий<\/h3><div class="cards c1"><div class="card"><div class="cn">Гангрена<\/div><div class="cr"><i>Степень<\/i><span>5<\/span><\/div><div class="cr"><i>Фон<\/i><span>−1 Здоровье, ограничение функции пораженной зоны (моторика −2 при ее использовании)<\/span><\/div><div class="cr"><i>Напряжение<\/i><span>Нагрузка, Среда<\/span><\/div><div class="cr"><i>Обострение<\/i><span>Разрушение тканей, гной, усиление боли — тяжелая соматическая травма; нужна срочная помощь или ампутация.<\/span><\/div><\/div><div class="card"><div class="cn">Посттравматический тремор<\/div><div class="cr"><i>Степень<\/i><span>1<\/span><\/div><div class="cr"><i>Фон<\/i><span>−1 Точная моторика (дрожь в конечностях)<\/span><\/div><div class="cr"><i>Напряжение<\/i><span>Нагрузка, Аффект<\/span><\/div><div class="cr"><i>Обострение<\/i><span>Руки выходят из-под контроля, движения резкие, точные манипуляции невозможны — легкая соматическая травма.<\/span><\/div><\/div><div class="card"><div class="cn">Ожирение<\/div><div class="cr"><i>Степень<\/i><span>2<\/span><\/div><div class="cr"><i>Фон<\/i><span>−1 Метаболизм, −1 Выносливость<\/span><\/div><div class="cr"><i>Напряжение<\/i><span>Нагрузка, Среда<\/span><\/div><div class="cr"><i>Обострение<\/i><span>Одышка, спазм, потеря возможности двигаться — легкая соматическая травма.<\/span><\/div><\/div><\/div><h2 class="sh2" id="s55">Психопатологии<\/h2><p class="txt">Психические расстройства и устойчивые особенности личности работают по общим правилам патологий, используя релевантные оси напряжения.<\/p><div class="cards c1"><div class="card"><div class="cn">Имплантация бредовой системы<\/div><div class="cr"><i>Степень<\/i><span>1<\/span><\/div><div class="cr"><i>Фон<\/i><span>Формирование замкнутой схемы: −1 к Чтению замысла, +1 к Убеждению при навязывании своей системы<\/span><\/div><div class="cr"><i>Напряжение<\/i><span>Нагрузка, Аффект<\/span><\/div><div class="cr"><i>Обострение<\/i><span>Утрата контакта с реальностью, интерпретация событий через фиксированную идею — легкая псих. травма.<\/span><\/div><\/div><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">10 / 33<\/span><\/div><\/div><h2 class="sh2" id="s56">Просветления<\/h2><div class="twocol"><p class="txt">Просветления — это устойчивые изменения личности, которые возникают только после того, как персонаж проходит через серьезное внутреннее испытание и делает осознанный выбор. Чтобы просветление состоялось, человек должен перешагнуть через прежнюю версию себя. Иногда это выглядит как отказ от того, во что он раньше искренне верил.<\/p><p class="txt">Малые просветления касаются отдельных черт характера. Человек начинает иначе реагировать в привычных для него ситуациях. Это заметно, но не меняет его полностью.<\/p><p class="txt">Фундаментальные просветления гораздо глубже. Они случаются редко и только после длительного давления или сильного личного кризиса. После них мировоззрение меняется настолько, что вернуться к прежнему состоянию уже невозможно.<\/p><p class="txt">Просветление может быть морально неоднозначным. Оно не обязано делать персонажа лучше или благороднее. Мастер имеет право оформить его самостоятельно, если увидит, что момент для этого созрел.<\/p><p class="txt">Малое просветление дает +1 к одному навыку, напрямую связанному с пережитым. Фундаментальное — +1 к аспекту.<\/p><\/div><p class="txt">Ниже приведены примеры просветлений:<\/p><div class="cards c3"><div class="card"><div class="cn">Сепарация<\/div><div class="cr"><i>Категория<\/i><span>Фундаментальное<\/span><\/div><div class="cr"><i>Условия<\/i><span>Персонаж долгое время подчинялся чужой воле. После серии внутренних противоречий он окончательно рвет с прошлым окружением, осознавая свою автономность.<\/span><\/div><div class="cr"><i>Бонус<\/i><span>+1 к Самоконтролю<\/span><\/div><\/div><div class="card"><div class="cn">Отказ от мученичества<\/div><div class="cr"><i>Категория<\/i><span>Малое<\/span><\/div><div class="cr"><i>Условия<\/i><span>Ситуация однозначно располагала к самопожертвованию, но персонаж осознанно выбрал выживание, поставив свои интересы выше интересов группы.<\/span><\/div><div class="cr"><i>Бонус<\/i><span>+1 к Независимости<\/span><\/div><\/div><div class="card"><div class="cn">Прощение без свидетеля<\/div><div class="cr"><i>Категория<\/i><span>Малое<\/span><\/div><div class="cr"><i>Условия<\/i><span>Персонаж пережил предательство или тяжелый вред и простил обидчика в одностороннем порядке — без получения извинений, компенсации или публичного признания вины.<\/span><\/div><div class="cr"><i>Бонус<\/i><span>+1 к Самообладанию<\/span><\/div><\/div><\/div><h2 class="sh2" id="s57">Модификации<\/h2><div class="twocol"><p class="txt">В зависимости от сеттинга, ваш персонаж может быть подвергнут практической реализации идей трансгуманизма. Существует два направления улучшений: биологические и кибернетические.<\/p><p class="txt">Биологические модификации — это улучшение организма на уровне органов и клеток при помощи редактирования ДНК, гормональной терапии или имплантации органов и тканей. В сеттинге есть традиционный способ их получения через Хашаш, возникший до развития медицины до нужного уровня.<\/p><p class="txt">Кибернетические модификации — это хирургическая замена части тела персонажа механическими или электронными компонентами.<\/p><h3 class="sh3" id="s58">Биоагрессивность<\/h3><p class="txt">Ключевой параметр модификации (от 1 до 5). Отражает ее мощность и насколько она конфликтует с организмом.<\/p><h3 class="sh3" id="s59">Порог биоагрессивности<\/h3><p class="txt">Максимальная нагрузка, которую выдерживает организм.<\/p><div class="f"><span class="fl">Порог биоагрессивности<\/span> = <span class="fe">Сумма первичных навыков Здоровья + Аспект Силы<\/span><\/div><p class="txt">При его превышении персонаж получает патологии, сумма степеней которых равна величине превышения, — одну или несколько, на усмотрение Мастера. Они связаны с модификацией с наибольшей биоагрессивностью. Какие именно это патологии и как они проявляются, Мастер определяет на месте.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">След Я<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">11 / 33<\/span><\/div><\/div><div class="twocol"><h3 class="sh3" id="s146">Проверка функционирования<\/h3><p class="txt">Превышение порога — не только отсроченный риск патологии, но и риск прямо в моменте. Каждая единица сверх порога делает организм менее предсказуемым: то, что вчера работало, сегодня может не сработать. Поэтому перед каждой активной заявкой модификации совершается проверка — справляется ли тело на этот раз.<\/p><div class="f"><span class="fl">Сложность проверки<\/span> = <span class="fe">2 + 2 × (единиц превышения порога)<\/span><\/div><p class="txt">Бросок — чистые 2d6. Ни навыки, ни модификаторы, ни обстоятельства в него не входят. Это проверка организма, а не персонажа.<\/p><table class="tb"><colgroup><col style="width:24%"><col style="width:76%"><\/colgroup><tr><th>Результат<\/th><th>Последствие<\/th><\/tr><tr><td class="L">Успех<\/td><td class="L">модификация срабатывает как обычно.<\/td><\/tr><tr><td class="L">Ниже на 1<\/td><td class="L">модификация не срабатывает.<\/td><\/tr><tr><td class="L">Ниже на 2–3<\/td><td class="L">модификация блокируется. Восстановить ее можно ремонтом (кибернетические) или лечением (биологические): проверка Анатомии или Биохимии, Сл 13. До этого активная заявка недоступна.<\/td><\/tr><tr><td class="L">Ниже на 4 и более<\/td><td class="L">тяжелая травма, связанная с зоной модификации.<\/td><\/tr><\/table><p class="txt">При отсутствии превышения проверка не требуется: Сл 2 проходит на любом броске 2d6.<\/p><h3 class="sh3" id="s60">Эффект<\/h3><p class="txt">Каждая модификация дает два типа бонусов:<\/p><ul class="bl"><li>Пассивный<\/li><li>Усиливает навыки. Сумма бонусов равна удвоенной Биоагрессивности.<\/li><li>Активной заявки<\/li><li>Уникальное действие, доступное 1 раз за сцену. Мощность и условия зависят от Биоагрессивности:<\/li><li>1–2: Требует совпадения двух жестких условий для активации. Эффект слабый или узкоспециализированный.<\/li><li>3: Требует одного значимого условия.<\/li><li>4–5: Можно активировать в любой момент. Эффект масштабный или разрушительный.<\/li><\/ul><h3 class="sh3" id="s61">Период адаптации<\/h3><p class="txt">В зависимости от биоагрессивности, от нескольких сцен до нескольких дней для кибернетических и от нескольких дней до месяцев для биологических.<\/p><p class="txt">В этот период модификации не дают бонусов, но имеют негативный эффект.<\/p><h3 class="sh3" id="s62">Побочный эффект<\/h3><p class="txt">Зеркальное отражение силы модификации. Состоит из двух частей:<\/p><ul class="bl"><li>Штраф: Минус к навыкам, равный показателю Биоагрессивности. Био-модификации вычитают очки из первичных навыков, кибер- из результирующих.<\/li><li>Триггер: Если выполнено определенное условие, Игрок должен озвучить проявление дефекта.<\/li><\/ul><h3 class="sh3" id="s63">Хашаш<\/h3><p class="txt">Раз в неделю проводится специальная тренировка в состоянии эмоциональной нестабильности. Во время тренировки делается проверка Концентрации + Самообладания, а ее сложность постепенно нарастает (от 7 + биоагрессивность желаемой модификации и далее +1 с каждым разом). Когда количество успешных проверок достигает биоагрессивности желаемой модификации, она закрепляется. Тематика тренировок всегда связана с улучшением. В случае провала — наркозависимость без преимуществ, приводящая к случайным мутациям.<\/p><h3 class="sh3" id="s64">Пример модификации<\/h3><div class="cards c1"><div class="card"><div class="cn">Гиперфазная мускулатура<\/div><div class="cr"><i>Тип<\/i><span>Биологическая<\/span><\/div><div class="cr"><i>Биоагрессивность<\/i><span>4<\/span><\/div><div class="cr"><i>Бонус<\/i><span>+6 к Атлетике, +2 к Выносливости<\/span><\/div><div class="cr"><i>Активная заявка<\/i><span>Можно совершить физическое действие с "разрушительным" результатом (пробить, сбросить, вытолкнуть и т.п.).<\/span><\/div><div class="cr"><i>Штраф<\/i><span>-2 к Контролю, -2 Осязанию<\/span><\/div><div class="cr"><i>Триггер<\/i><span>после активации — средняя травма связок<\/span><\/div><\/div><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s65"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">12 / 33<\/span><\/div><\/div><div class="twocol"><p class="txt">Это наука и искусство взаимодействия с тем, на чем базируется сеттинг Arbor Echo. Она опирается на принципы, изложенные в соответствующем разделе<sup class="fn"><a href="#fn5" id="fnref5">[5]<\/a><\/sup>.<\/p><p class="txt">Ведущий и опорные навыки. В шаблоне заклинания один навык — ведущий, остальные — опорные. Ведущий всегда указывается первым. У заклинаний Материи и Менталистики ведущий — навык Изнанки; у заклинаний Ауры — навык, указанный в шаблоне первым.<\/p><div class="keep"><p class="txt">Ступень эффекта определяют опорные навыки. Возьмите их среднее арифметическое результирующее значение:<\/p><table class="tb"><colgroup><col style="width:40%"><col style="width:60%"><\/colgroup><tr><th>Средний опорный навык<\/th><th>Ступень<\/th><\/tr><tr><td class="">до 5<\/td><td class="L">I — Базовый<\/td><\/tr><tr><td class="">6–9<\/td><td class="L">II — Продвинутый<\/td><\/tr><tr><td class="">10–13<\/td><td class="L">III — Мастерский<\/td><\/tr><tr><td class="">14 и выше<\/td><td class="L">IV — Легендарный<\/td><\/tr><\/table><\/div><p class="txt">Проверка. Бросок: 2d6 + Результирующее значение ведущего навыка + баллы Гейсов + модификаторы против сложности ступени.<\/p><p class="txt">Эрудиция определяет, какую рабочую модель вы способны собрать; Изнанка — состоится ли сопряжение. Опорные навыки в бросок не входят: к моменту подготовки шаблона они уже отработаны как условие того, что шаблон вообще собран.<\/p><p class="txt">Опциональное правило<sup class="fn"><a href="#fn6" id="fnref6">[6]<\/a><\/sup>: если подготовка превосходит требования ступени, она все же помогает: +1 к броску за каждые 2 полных единицы среднего опорного навыка сверх порога ступени (максимум +2).<\/p><h3 class="sh3" id="s66">Ограничения магии<\/h3><ul class="bl"><li>Заклинание возникает и действует только в пределах ауры заклинателя. Дистанционное воздействие требует изобретательности<\/li><li>Воздействовать можно на объект или свойство, чей оператор заклинателю ясен в рабочей модели. Глубже модель — шире множество доступных операторов. Сила духа без модели не выбирает, что деформировать<\/li><li>Магия — волевое усилие, то есть поддержание сопряжения на границе. Базовый расход: 1 ОД = 1 Платон (если в шаблоне заклинания не указано иное)<\/li><\/ul><h3 class="sh3" id="s67">Лимит Платонов<\/h3><div class="f"><span class="fl">Максимальный запас ауры<\/span> = <span class="fe">Самоконтроль*5 + Здоровье*2 Платонов<\/span><\/div><div class="f"><span class="fl">Скорость восстановления Платонов<\/span> = <span class="fe">Самоконтроль*3 + Здоровье Платонов в сутки<\/span><\/div><div class="f"><span class="fl">Дальность применения заклинаний<\/span> = <span class="fe">Сумма Аспектов Воли * Текущий/Максимальный запас ауры в метрах<\/span><\/div><p class="txt">Платоны — единицы учета потока через границу композиции. Формулы не выводятся из онтологии за столом; они фиксируют, что сопряжение конечно, восстанавливается вместе с удержанием границы и сжимается, когда запас падает.<\/p><p class="txt">Платоны — от «плато» (plateau): устойчивого уровня, на котором поток через границу композиции перестает быть бессточным и становится учетной величиной. Совпадение с именем Платона — вторичная омонимия, закрепившаяся в школьном жаргоне; в строгом смысле термин не отсылает ни к философу, ни к миру идей.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">13 / 33<\/span><\/div><\/div><h2 class="sh2" id="s68">Аура<\/h2><p class="txt">Аура — продолжение границы композиции за пределы ткани. Ее объем включает тело и тонкий слой вокруг. Это не дополнительный орган в анатомическом смысле и не «поле души». Обычные органы снимают реляционный срез мира (фотоны, давление, градиенты). Аура дает доступ к внутреннему аспекту структур, которые тело иначе познает только через внешнее наблюдение. Поэтому она опирается на уже имеющиеся ощущения<sup class="fn"><a href="#fn7" id="fnref7">[7]<\/a><\/sup>. Показания ауры всегда окрашены наличной сенсорикой. Дальность и запас измеряют, насколько далеко и насколько интенсивно композиция удерживает это продолжение.<\/p><div class="cards"><div class="card"><div class="cn">Чувствительность<\/div><div class="cr"><i>Навыки<\/i><span>Концентрация + Проприоцепция + Навык восприятия<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>-/-<\/span><\/div><div class="cr"><i>Описание<\/i><span>Восприятие и анализ чужих аур. Выявляет следы магического воздействия и активные заклинания — то есть чужие сопряжения. Помогает отслеживать чужое внимание.<\/span><\/div><\/div><div class="card"><div class="cn">Накопление<\/div><div class="cr"><i>Навыки<\/i><span>Концентрация<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>-/-<\/span><\/div><div class="cr"><i>Описание<\/i><span>Ускоряет восстановление резерва в три раза. Максимальная длительность сеанса (количество часов в сутках) зависит от Концентрации персонажа.<\/span><\/div><\/div><div class="card"><div class="cn">Дистанционный контроль<\/div><div class="cr"><i>Навыки<\/i><span>Концентрация + Самообладание + Проприоцепция<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>1 ОД за раз/-<\/span><\/div><div class="cr"><i>Описание<\/i><span>Отделение и контроль фрагментов ауры на расстоянии. Платоны фрагмента равны затратам.<\/span><\/div><\/div><div class="card"><div class="cn">Диффузия<\/div><div class="cr"><i>Навыки<\/i><span>Концентрация + Проприоцепция<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>2 ОД/1 Платон<\/span><\/div><div class="cr"><i>Описание<\/i><span>Вы можете использовать свои заклинания, нацелив их на пространство внутри ауры цели. Цель также получает возможность пользоваться магией внутри вашей ауры. Цель мгновенно замечает действие этого заклинания. Проводится как встречная проверка против Диффузии цели.<\/span><\/div><\/div><div class="card"><div class="cn">Сонастройка<\/div><div class="cr"><i>Навыки<\/i><span>Навык восприятия + Концентрация + Проприоцепция<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД/1 Платон<\/span><\/div><div class="cr"><i>Описание<\/i><span>Скрытная вариация диффузии. Вместо силового проникновения — мимикрия под чужую границу. Сложность — чужая чувствительность. В остальном дублирует эффекты. Провал обычно означает, что мимикрия распознана как диффузия.<\/span><\/div><\/div><div class="card"><div class="cn">Подавление<\/div><div class="cr"><i>Навыки<\/i><span>Запугивание + Самообладание<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>2 ОД / Выделенный резерв * Далее 1 платон на раунд<\/span><\/div><div class="cr"><i>Описание<\/i><span>Выдавливание чужой ауры из тела. Выделенный резерв должен быть больше или равен остатку у цели.<\/span><\/div><\/div><div class="card"><div class="cn">Абсорбция<\/div><div class="cr"><i>Навыки<\/i><span>Самообладание + Запугивание + Концентрация<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД / Кража = Концентрация/3 Платонов<\/span><\/div><div class="cr"><i>Описание<\/i><span>Позволяет восстанавливать свои резервы за чужой счет<\/span><\/div><\/div><\/div><p class="txt">В приложении можно ознакомиться с более детальным описанием эффектов, в зависимости от средней сложности на навык<sup class="fn"><a href="#fn8" id="fnref8">[8]<\/a><\/sup>.<\/p><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">14 / 33<\/span><\/div><\/div><h2 class="sh2" id="s69">Хроно-параллакс<\/h2><div class="twocol"><p class="txt">Восприятие всегда запаздывает относительно источника. Световой конус прошлого — единственные данные, которые тело имеет о внешнем мире. Обычное наведение реконструирует из этих данных «сейчас» и сопрягает заклинание с реконструкцией. Реконструкция может быть неверной: объект уже не там, не такой, не в том состоянии.<\/p><p class="txt">Аура наводит эффект по воспринятым данным. Эффект направлен на состояние объекта в событии испускания воспринятой информации, а не в «теперь» заклинателя. Разрыв между этими двумя сечениями — и есть рабочий зазор Хроно-параллакса.<\/p><p class="txt">Хроно-параллакс измеряет, насколько глубоко вдоль входящей мировой линии композиция способна воздействовать на источник, вместо того чтобы довольствоваться реконструированным настоящим. Глубина считается в собственном времени заклинателя.<\/p><div class="f"><span class="fl">Максимальная глубина (в секундах)<\/span> = <span class="fe">0,25 + 0,25 × Результирующее значение навыка<\/span><\/div><p class="txt">При значении навыка 0 глубина равна 0,25 секунды. Это характерное время цикла обновления самой композиции — ширина ее «сейчас». На человеческих дистанциях свет практически мгновенен, поэтому базовой глубины хватает для прямой видимости, ближнего звука, вибрации и тактильного контакта. Для работы через посредника с заметной задержкой сигнала (эхолокация на десятки метров, длинная акустическая цепь, любой канал, где время распространения сравнимо с 0,25 с) базовой глубины уже недостаточно — нужно ненулевое значение навыка.<\/p><p class="txt">Если задержка между событием испускания и текущим собственным временем заклинателя не превышает доступную глубину, заклинание применяется к объекту в событии испускания, а не в момент броска. Дальнейшая эволюция пересчитывается от этого события вперед. ОД и Платоны тратятся по обычной стоимости выбранного заклинания. Хроно-параллакс добавляется в проверку как дополнительный навык, если Мастер считает временной сдвиг значимым фактором сложности.<\/p><p class="txt">Персонаж помнит только момент броска. Разрыв между заявкой и пересчитанным результатом не переживается как отдельный отрезок.<\/p><p class="txt">Если задержка превышает доступную глубину, сопряжение с источником не собирается. Воздействие невозможно. Оно компенсирует задержку восприятия, а не расстояние. Вынести границу к цели по-прежнему нужно отдельно.<\/p><p class="txt">Через связанные точки в Изнанке маг может выстроить цепь ретрансляции, продлевающую доступную глубину сверх личного лимита. Каждое звено — отдельный носитель и отдельная проверка Хроно-параллакса на стабильность передачи. Изнанка не слоена временем так, как пространство-время; поэтому две композиции с разным собственным временем могут быть сцеплены без мировой линии в обычном пространстве. Стабильность падает с числом звеньев: каждое звено — дополнительная комбинация, и ошибка комбинации искажает либо обрывает сообщение.<\/p><p class="txt">На этом принципе стоит работа Оракулов. Получатель переживает результат как предсказание. Фактически это сообщение из более позднего собственного времени в более раннее. Цена и хрупкость цепи — причина, по которой оракулы редки, ошибаются и не заменяют разведку.<\/p><p class="txt">Хроно-параллакс не создает замкнутых времениподобных кривых в пространстве-времени и не отменяет причинность на световом конусе. Он пользуется тем, что передача идет через Изнанку, у которой нет той же слоености. Где именно проходит граница между «пересчетом от прошлого события» и вмешательством, ломающим согласованность истории, — предмет школьных споров и повод поговорить с Мастером.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">15 / 33<\/span><\/div><\/div><h2 class="sh2" id="s70">Материя<\/h2><div class="twocol"><p class="txt">Магия Материи — набор методов локальной деформации эффективных ограничений внутри ауры.<\/p><p class="txt">Название приема в справочнике часто старше рабочей модели: «Море Дирака» не предполагает моря электронов с отрицательной энергией, как «окисление» в химии не предполагает флогистона.<\/p><h3 class="sh3" id="s71">Резонансное эхо в магии Материи<\/h3><p class="txt">Прямое воздействие на субъект требует от заклинателя собрать внутреннюю модель того, как цель будет переживать последствия манипуляции. В этой онтологии «собрать модель чужого переживания» — частичная комбинация двух композиций: на время воздействия заклинатель хранит в себе фантомный отпечаток чужого внутреннего аспекта.<\/p><p class="txt">Эхо воспроизводит эффекты оригинала ослабленно (на одну ступень, без вреда для Здоровья заклинателя), потому что репликация искажена и не занимает чужую ткань. Медитация 5–10 минут (проверка Самообладания Сл 13) нужна, чтобы расцепить комбинацию, пока отпечаток не начал интегрироваться в собственную границу, формируя соматическую травму. Воздействие на предметы эха не оставляет: у них нет конкурирующей композиции. Неразумные существа по правилам стола эха тоже не оставляют: асимметрия композиций слишком велика, чтобы фантом мог стабилизироваться. Это правило учета, а не доказательство отсутствия опыта у животных.<\/p><\/div><div class="cards"><div class="card"><div class="cn">Фотокинез<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Квантовая теория<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД и 1 на поддержку/1 Платон и 1 Платон на поддержку<\/span><\/div><div class="cr"><i>Описание<\/i><span>Контроль интенсивности света в заданной области.<\/span><\/div><\/div><div class="card"><div class="cn">Телекинез<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Классическая физика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД/3 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Управление движением предметов на расстоянии.<\/span><\/div><\/div><div class="card"><div class="cn">Термокинез<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Электроморфизм + Классическая физика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД/2 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Контроль тепловой энергии: нагрев и охлаждение веществ.<\/span><\/div><\/div><div class="card"><div class="cn">Нагнетание разности потенциалов<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Электроморфизм<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД/2 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Создание электрического напряжения между двумя точками<\/span><\/div><\/div><div class="card"><div class="cn">Восстановление/рекомбинирование структуры<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Материаловедение + Реактивная/Синтетическая химия<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД/2 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Ремонт или пересборка поврежденных предметов и материалов на молекулярном уровне.<\/span><\/div><\/div><div class="card"><div class="cn">Телепортация<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Формальный анализ + Теория вероятностей + Квантовая теория<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД/4 Платона за каждые 5 кг<\/span><\/div><div class="cr"><i>Описание<\/i><span>Перемещение между заранее подготовленными точками пространства. «Мгновенность» — описание за столом; в модели это смена того, какие области отождествлены в эффективной геометрии, с переносом меры.<\/span><\/div><\/div><div class="card"><div class="cn">Море Дирака<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Электроморфизм + Пространственная логика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД/4 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Порталы и пространственные ловушки. Историческое имя приема, работающего со связностью областей: какие точки в эффективной геометрии считаются соседними. Позволяет связывать места или изолировать объем.<\/span><\/div><\/div><div class="card"><div class="cn">Ядерный распад<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Теория вероятностей + Квантовая теория<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД/4 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Инициация контролируемых ядерных реакций. Направлена на меру и эффективные связи на ядерном масштабе. Ошибки модели на этом масштабе не бывают мелкими.<\/span><\/div><\/div><div class="card"><div class="cn">Укрепление/аморфизация<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Материаловедение + Классическая физика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД/3 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Изменение плотности и жесткости материалов.<\/span><\/div><\/div><div class="card"><div class="cn">Виброкинез<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Электроморфизм<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 и 1 на поддержку/3 Платона и 1 на поддержку<\/span><\/div><div class="cr"><i>Описание<\/i><span>Контроль волновых процессов — от звуковых колебаний до электромагнитных излучений.<\/span><\/div><\/div><div class="card"><div class="cn">Материагенез<\/div><div class="cr"><i>Навыки<\/i><span>Материя + Квантовая теория + Теория вероятностей<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД/3 Платона за каждый грамм<\/span><\/div><div class="cr"><i>Описание<\/i><span>Синтез вещества «из ничего» за столом. В модели — набор меры на конфигурациях, в которых требуемое вещество уже есть, с оплатой потока на границе.<\/span><\/div><\/div><\/div><p class="txt">В приложении можно ознакомиться с описанием эффектов, в зависимости от средней сложности на навык<sup class="fn"><a href="#fn9" id="fnref9">[9]<\/a><\/sup>.<\/p><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">16 / 33<\/span><\/div><\/div><h2 class="sh2" id="s72">Менталистика<\/h2><div class="twocol"><p class="txt">Менталистика — хирургия композиций. Память в этом мире реконструктивна: мозг держит следы, по которым композиция каждый раз заново сходится к эпизоду. Менталист работает с изнаночной стороной этих следов — с аттракторами, по которым сходится реконструкция.<\/p><p class="txt">Ошибка здесь — интеграция чужого аттрактора в вашу границу или потеря этой границы в принципе. Отсюда требования к самоконтролю и к рабочей модели психики.<\/p><h3 class="sh3" id="s73">Топологический принцип<\/h3><p class="txt">Для менталиста Изнанка не евклидова. Близость — мера перекрытия составляющих двух композиций. Общая травма ближе, чем соседняя комната. Общий ритуал ближе, чем общий язык, если язык не несет тех же весов.<\/p><p class="txt">Слои — масштаб корреляций. Внизу — быстропеременные состояния одной композиции (текущая мысль, вспышка аффекта). Выше — устойчивые бассейны одной биографии. Еще выше — медленные, высокоперекрытые аттракторы культуры: то, что неаккуратно называют архетипами. «Коллективное бессознательное» в этой модели — область высоких перекрытий. Двигаться по Изнанке — значит менять масштаб и искать перекрытие.<\/p><p class="txt">Эмоциональные связи, общие переживания, культурные символы — рабочие мосты, потому что это и есть общая основа. Без моста ориентация сходится к блужданию в шуме.<\/p><\/div><div class="cards"><div class="card"><div class="cn">Ментальное считывание<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Чтение замысла<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>2 ОД / 1 Платон<\/span><\/div><div class="cr"><i>Описание<\/i><span>Чтение памяти<\/span><\/div><\/div><div class="card"><div class="cn">Фиксация/форматирование памяти<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Чтение замысла + Манипулирование<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД / 3 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Сохраняет или удаляет фрагменты воспоминаний<\/span><\/div><\/div><div class="card"><div class="cn">Де/шифровка памяти<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Обман + Нейрофизиология<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>4 ОД / 4 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Прячет или раскрывает определенные воспоминания<\/span><\/div><\/div><div class="card"><div class="cn">Замена приоритетов<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД / 3 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Деформирует ландшафт ценностей и мотивации<\/span><\/div><\/div><div class="card"><div class="cn">Внушение<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Убеждение<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>3 ОД / 3 Платона<\/span><\/div><div class="cr"><i>Описание<\/i><span>Внедряет идеи и команды<\/span><\/div><\/div><div class="card"><div class="cn">Ориентация в Изнанке<sup class="fn"><a href="#fn10" id="fnref10">[10]<\/a><\/sup><\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Концентрация<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>2 ОД и 1 Платон на активацию, 1 ОД на поддержание / 1 Платон за вход и каждую смену слоя<\/span><\/div><div class="cr"><i>Описание<\/i><span>Перемещение по Изнанке.<\/span><\/div><\/div><div class="card"><div class="cn">Ассоциативная сигнализация<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Концентрация<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>30 Платонов за создание + 5 за каждый дополнительный час действия<\/span><\/div><div class="cr"><i>Описание<\/i><span>Устойчивые метки и ловушки на выбранных перекрытиях — предупредительные системы<\/span><\/div><\/div><div class="card"><div class="cn">Квазиразумность заклинаний<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Обман + Нейрофизиология<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>10 Платонов за каждую единицу навыка<\/span><\/div><div class="cr"><i>Описание<\/i><span>Условие объединения нескольких заклинаний единое целое (цель последующего заклинания — другое заклинание). Создание отдельного псевдо-разумного конструкта и вкладывание в него единиц навыков. Конструкт имеет свой лист; порог вкладываемых навыков равен их первичному значению у мага. Онтологически это искусственная композиция с узкой границей, живущая за счет чужого учета. Она не субъект в полном смысле, пока граница не станет самоподдерживающейся<\/span><\/div><\/div><div class="card"><div class="cn">Рекомбинация следа в Изнанке<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>1000 ОД / 1000 Платонов<\/span><\/div><div class="cr"><i>Описание<\/i><span>Изменение коллективных воспоминаний.<\/span><\/div><\/div><div class="card"><div class="cn">Чтение памяти мира<\/div><div class="cr"><i>Навыки<\/i><span>Менталистика + Чтение замысла + Самообладание<\/span><\/div><div class="cr"><i>Стоимость<\/i><span>10 ОД за час разницы / 10 Платонов за час разницы<\/span><\/div><div class="cr"><i>Описание<\/i><span>Выборка из опыта живущих, живших и тех, чьи композиции еще не спроецированы. Будущее здесь доступно как геометрически присутствующее незанятое пространство. Чем дальше от занятых корреляций, тем ближе это к Запределью<\/span><\/div><\/div><\/div><p class="txt">В приложении можно ознакомиться с описанием эффектов, в зависимости от средней сложности на навык<sup class="fn"><a href="#fn11" id="fnref11">[11]<\/a><\/sup>.<\/p><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">17 / 33<\/span><\/div><\/div><h2 class="sh2" id="s74">Гейсы<\/h2><div class="twocol"><p class="txt">Гейс — постоянное, сознательно встроенное ограничение носителя сопряжения: на что, где и когда заклинание имеет право действовать. Заклинание без Гейса конкурирует за одни и те же степени свободы границы со всеми прочими подготовленными сопряжениями. Гейс сужает носитель, выделяет нишу, снижает сложность вызова. Гейсы нельзя менять на лету. Они — структурная черта композиции, а не политика, которую субъект держит в рабочей памяти. Перестройка ниши требует медитации.<\/p><h3 class="sh3" id="s75">Лимит Гейсов<\/h3><div class="keep"><p class="txt">Максимальное количество Гейсов, которые маг может встроить в свою психику, определяется по формуле:<\/p><div class="f"><span class="fl">Максимум Гейсов<\/span> = <span class="fe">(Сумма Аспектов Эрудиции и Воли)/3<\/span><\/div><\/div><p class="txt">Лимит распространяется на всего персонажа, а не на каждое заклинание в отдельности.<\/p><h3 class="sh3" id="s76">Категории ограничений<\/h3><div class="keep"><p class="txt">Каждый Гейс должен затрагивать одну из следующих трех категорий:<\/p><ul class="bl"><li>Что — допустимые цели<\/li><li>Где — пространственные условия<\/li><li>Когда — временные или ситуационные условия<\/li><\/ul><\/div><p class="txt">Гейсы одного заклинания не могут повторять категорию друг друга. Повторяющиеся или однотипные ограничения не допускаются.<\/p><h3 class="sh3" id="s77">Балльная оценка Гейсов<\/h3><div class="keep"><p class="txt">Каждое ограничение оценивается по степени сужения множества допустимых применений:<\/p><ul class="bl"><li>1 балл — ограничивает до группы случаев (например: только ночью, только к объектам без движения).<\/li><li>2 балла — ограничивает до конкретного, редкого случая (например: только к объектам, на которых до этого мной использовалось «Укрепление»).<\/li><\/ul><\/div><p class="txt">Сумма баллов определяет эффективность упрощения.<\/p><h3 class="sh3" id="s78">Процедура установления Гейса<\/h3><p class="txt">Установка Гейса требует подготовки и уединенной медитации. Медитация может быть прервана и продолжена позже.<\/p><div class="f"><span class="fl">Время<\/span> = <span class="fe">Сумма Аспектов Эрудиции и Воли часов<\/span><\/div><p class="txt">Удаление Гейса требует трехкратно больших усилий, потому что нужно полностью перестроить нишу, которую занимает заклинание.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Магия<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">18 / 33<\/span><\/div><\/div><h2 class="sh2" id="s79">Стигматы<\/h2><div class="twocol"><p class="txt">Когда композиция переживает деформацию достаточной глубины, ее след может закрепиться на предмете, уже втянутом в это переживание. Стигмат — протез границы, а не магия, упакованная в предмет.<\/p><h3 class="sh3" id="s80">Условия создания и утраты<\/h3><p class="txt">Повседневный аффект недостаточен. Нужно изменение, которое само по себе перестраивает, кем является субъект.<\/p><p class="txt">Каждый стигмат связан только со своим создателем. Одно значимое изменение позволяет создать лишь один стигмат. Физические свойства предмета при этом не изменяются.<\/p><p class="txt">Темные стигматы возникают только на основе действующих физических или психических Патологий.<\/p><p class="txt">Светлые стигматы создаются только в результате получения Фундаментального просветления.<\/p><p class="txt">Исходный предмет должен быть прямо связан с переживанием в понимании героя. Например, темным стигматом может стать ботинок, надетый в момент заражения гангреной, а светлым — сорванный с одежды шеврон в момент дезертирства.<\/p><p class="txt">Процесс формирования требует проведения медитации в спокойной обстановке.<\/p><div class="f"><span
