 class="fe">Время=3×(Сумме Аспектов Эрудиции + Воли) часов<\/span><\/div><p class="txt">Стигмат существует, пока активно породившее его состояние. Если персонаж полностью излечивается от патологии или теряет уверенность в обретенном убеждении, вещь выпадает из границы и навсегда становится обычным предметом.<\/p><h3 class="sh3" id="s81">Темные стигматы<\/h3><p class="txt">Темный стигмат служит выносной точкой границы. Заклинатель применяет воздействие так, будто находится в точке нахождения предмета. Канал симметричен: через вещь можно бить и владельца. Патология, породившая стигмат, есть как раз та деформация, которая позволила границе протезироваться наружу; поэтому канал нельзя «включить только в одну сторону».<\/p><h3 class="sh3" id="s82">Светлые стигматы<\/h3><p class="txt">Светлый стигмат держит уникальный Гейс четвертой категории — «Зачем». Этот Гейс формулируется из сути пережитого просветления (например: «Только для защиты личной автономии»).<\/p><p class="txt">Гейс встроен в предмет. Если маг совершает заклинание, находясь в физическом контакте со светлым стигматом, и заявленное действие соответствует заложенной идеологии, он получает бонус к итоговому броску. Размер бонуса +2.<\/p><p class="txt">Этот бонус не занимает слот в формуле лимита Гейсов персонажа и применяется сверх него. «Зачем» нельзя назначить обычным Гейсом: цель как степень свободы границы не сужается волевым решением, она сужается только вместе с тем, кем субъект стал.<\/p><h3 class="sh3" id="s83">Обнаружение и идентификация<\/h3><p class="txt">Аура стигмата маскируется под индивидуальный отпечаток создателя. Без доступа к этой ауре или без специальной работы отделить стигмат от вещи с насыщенной историей сложно. Опытный маг может заподозрить его по косвенным признакам — необычной стабильности Изнанки вокруг вещи или странной реакции на чужое сопряжение — но для уверенного определения нужно исследование.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s84"><div class="pg-head"><div class="hl"><span class="k">Сторона Мастера<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">19 / 33<\/span><\/div><\/div><h2 class="sh2" id="s85">Проверки и сложность<\/h2><p class="txt">Оценка сложности — базовый механизм, через который Мастер контролирует вес и значимость действий персонажей. Фактически это ответ на вопрос: насколько трудно то, что пытается сделать герой? Установленная сложность определяет рамки результата.<\/p><h3 class="sh3" id="s86">Базовая сложность<\/h3><p class="txt">Каждая проверка начинается с установления ее сложности. Базовая шкала колеблется от 5 до 21:<\/p><table class="tb"><colgroup><col style="width:14%"><col style="width:86%"><\/colgroup><tr><th>Сложность<\/th><th>Значение<\/th><\/tr><tr><td class="">5<\/td><td class="L">простое действие, в рамках базовой подготовки<\/td><\/tr><tr><td class="">9<\/td><td class="L">стандартная задача, требующая концентрации<\/td><\/tr><tr><td class="">13<\/td><td class="L">сложная задача, под силу опытному специалисту<\/td><\/tr><tr><td class="">17<\/td><td class="L">исключительно трудное действие, доступное лишь мастерам своего дела<\/td><\/tr><tr><td class="">21+<\/td><td class="L">даже лучшие в мире специалисты не дают гарантии успеха<\/td><\/tr><\/table><p class="txt">Это значение задается для проверки по одному навыку. Однако многие действия требуют сразу нескольких компетенций. В этом случае выбирается желаемая степень сложности, от нее вычитается 7, результат умножается на количество навыков в проверке и к нему возвращается 7. К броску при этом прибавляется сумма результирующих значений всех навыков проверки — рост сложности компенсируется ростом бонуса.<\/p><p class="txt">Пример: сложная проверка на 3 навыка<\/p><div class="f"><span class="fl">(13 - 7) * 3 + 7<\/span> = <span class="fe">25<\/span><\/div><h3 class="sh3" id="s145">Матрица итоговой сложности<\/h3><div class="f"><span class="fl">Итоговая сложность<\/span> = <span class="fe">(Желаемая − 7) × N + 7<\/span>, где N — количество навыков в проверке<\/div><table class="tb mx"><colgroup><col style="width:22%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><\/colgroup><tr><th>Желаемая сложность<\/th><th>1 навык<\/th><th>2 навыка<\/th><th>3 навыка<\/th><th>4 навыка<\/th><th>5 навыков<\/th><th>6 навыков<\/th><\/tr><tr><td class="rh">5 — Простое<\/td><td>5<\/td><td class="dash">—<\/td><td class="dash">—<\/td><td class="dash">—<\/td><td class="dash">—<\/td><td class="dash">—<\/td><\/tr><tr><td class="rh">9 — Стандартное<\/td><td>9<\/td><td>11<\/td><td>13<\/td><td>15<\/td><td>17<\/td><td>19<\/td><\/tr><tr><td class="rh">13 — Сложное<\/td><td>13<\/td><td>19<\/td><td>25<\/td><td>31<\/td><td>37<\/td><td>43<\/td><\/tr><tr><td class="rh">17 — Экспертное<\/td><td>17<\/td><td>27<\/td><td>37<\/td><td>47<\/td><td>57<\/td><td>67<\/td><\/tr><tr><td class="rh">21 — Легендарное<\/td><td>21<\/td><td>35<\/td><td>49<\/td><td>63<\/td><td>77<\/td><td>91<\/td><\/tr><\/table><p class="txt">Простыми действиями могут быть только для однонавыковых проверки. Задача, требующая сразу нескольких компетенций, не бывает простой — поэтому многонавыковая проверка начинается со «стандартных».<\/p><h3 class="sh3" id="s101">Автоматический успех<\/h3><p class="txt">Проверка проводится только тогда, когда в сцене есть напряжение и неопределенность. Если исход очевиден или не важен, бросок лишь тормозит темп.<\/p><p class="txt">Если сложность меньше или равна итоговому бонусу к броску + 5 (результирующий навык равен 4, против сложности 8), то бросок автоматически успешен.<\/p><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Сторона Мастера<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">20 / 33<\/span><\/div><\/div><h2 class="sh2" id="s87">Модификаторы<\/h2><div class="twocol"><p class="txt">Проверка не всегда совершается в идеальных условиях, поэтому базовая сложность может быть скорректирована двумя (или тремя при учете опционального) модификаторами: условий и роли.<\/p><p class="txt">Итоговая сложность = Базовая + сумма модификаторов<\/p><p class="txt">Это позволяет усложнить задачу, если обстоятельства против героя, или, наоборот, дать ему возможность раскрыть характер в нужный момент.<\/p><h3 class="sh3" id="s143">Модификатор условий<\/h3><div class="keep"><p class="txt">Этот параметр описывает объективные обстоятельства действия: освещение, шум, наличие подходящих инструментов, санитарные условия и прочее. Оценивается по шкале:<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Общие условия<\/th><\/tr><tr><td class="">-2<\/td><td class="L">идеальные<\/td><\/tr><tr><td class="">-1<\/td><td class="L">благоприятные<\/td><\/tr><tr><td class="">0<\/td><td class="L">нейтральные<\/td><\/tr><tr><td class="">+1<\/td><td class="L">неблагоприятные<\/td><\/tr><tr><td class="">+2<\/td><td class="L">крайне неблагоприятные<\/td><\/tr><\/table><\/div><div class="keep"><p class="txt">В социальных сценах этот модификатор отражает силу аргумента или позиции персонажа:<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Социальные сцены: качество аргументации<\/th><\/tr><tr><td class="">-2<\/td><td class="L">речь выдающаяся, логичная, эмоционально выверенная<\/td><\/tr><tr><td class="">-1<\/td><td class="L">речь убедительная, последовательная и уместная<\/td><\/tr><tr><td class="">0<\/td><td class="L">нейтральная аргументация<\/td><\/tr><tr><td class="">+1<\/td><td class="L">аргументация слабая или неуместная<\/td><\/tr><tr><td class="">+2<\/td><td class="L">речь нелепа, противоречит логике или мотивации персонажа<\/td><\/tr><\/table><\/div><p class="txt">Так социальные сцены приравниваются к физическим: речь тоже инструмент, который может работать хорошо или плохо.<\/p><div class="keep"><p class="txt">Для расследований модификатор отражает доступность улики и характер анализа:<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Расследования: доступность улики и анализ<\/th><\/tr><tr><td class="">-2<\/td><td class="L">очевидная зацепка<\/td><\/tr><tr><td class="">-1<\/td><td class="L">нестандартное применение известного<\/td><\/tr><tr><td class="">0<\/td><td class="L">частично скрытая информация<\/td><\/tr><tr><td class="">+1<\/td><td class="L">вывод с опорой на несколько гипотез<\/td><\/tr><tr><td class="">+2<\/td><td class="L">сложная реконструкция по неполным данным<\/td><\/tr><\/table><\/div><h3 class="sh3" id="s88">Модификатор роли<\/h3><p class="txt">Этот параметр оценивает, насколько заявка персонажа согласуется с его характером, историей и типичным поведением<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Соответствие заявки образу персонажа<\/th><\/tr><tr><td class="">-2<\/td><td class="L">яркое и точное попадание в характер<\/td><\/tr><tr><td class="">-1<\/td><td class="L">логичное действие в рамках образа<\/td><\/tr><tr><td class="">0<\/td><td class="L">нейтрально<\/td><\/tr><tr><td class="">+1<\/td><td class="L">спорная или сомнительная заявка<\/td><\/tr><tr><td class="">+2<\/td><td class="L">действие полностью выбивается из образа<\/td><\/tr><\/table><h3 class="sh3" id="s89">Модификатор экипировки<sup class="fn"><a href="#fn12" id="fnref12">[12]<\/a><\/sup><\/h3><p class="txt">Если некий предмет — это необходимое условие выполнения заявки, то модификатор экипировки оценивает, насколько он соответствует задаче.<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Соответствие предмета задаче<\/th><\/tr><tr><td class="">-2<\/td><td class="L">идеальный инструмент для ситуации<\/td><\/tr><tr><td class="">-1<\/td><td class="L">подходящий инструмент<\/td><\/tr><tr><td class="">0<\/td><td class="L">пригодный<\/td><\/tr><tr><td class="">+1<\/td><td class="L">используется не по назначению<\/td><\/tr><tr><td class="">+2<\/td><td class="L">едва пригоден<\/td><\/tr><\/table><\/div><div class="twocol"><h2 class="sh2" id="s90">Разрешение противоречий<\/h2><p class="txt">Мир Arbor Echo существует как совместная воображаемая конструкция. Противоречия неизбежны: участники могут по-разному представить сцену или сформулировать несовместимые действия.<\/p><p class="txt">Задача Мастера — прояснить ситуацию и сохранить темп.<\/p><h3 class="sh3" id="s91">Типы противоречий<\/h3><ul class="bl"><li>Фактические — различия в представлении сцены (освещение, расположение объектов).<\/li><li>Внутриигровые — взаимоисключающие действия персонажей.<\/li><li>Нарративные — одно действие ломает темп или жанровую принадлежность сцены<\/li><\/ul><h3 class="sh3" id="s92">Уточнение намерений<\/h3><p class="txt">Попросите Игроков уточнить, что именно они хотят сделать. Часто конфликт исчезает после конкретизации: один хочет «войти первым», другой хочет «открыть дверь тихо» — эти действия могут сосуществовать.<\/p><p class="txt">Если намерения действительно несовместимы — переходите к распределению приоритета.<\/p><h3 class="sh3" id="s93">Назначение приоритета<\/h3><ul class="bl df"><li><b>Очевидность<\/b> — чья заявка логичнее вытекает из положения или последовательности действий<\/li><li><b>ОД<\/b> — приоритет получает персонаж с большим количеством ОД в текущем раунде.<\/li><li><b>Хронология<\/b> — приоритет получает тот, кто первым сформулировал заявку.<\/li><\/ul><h3 class="sh3" id="s94">Проверка вмешательства<\/h3><p class="txt">Если оба персонажа могут вмешаться в действие друг друга, применяется встречная проверка.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Сторона Мастера<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">21 / 33<\/span><\/div><\/div><h2 class="sh2" id="s95">Работа с Изнанкой<\/h2><div class="grid2"><div class="col"><p class="txt">Ступень эффекта «Ориентации в Изнанке» задает максимальный доступный слой. Если используется эта процедура, проверка ступени отдельно не бросается: ее роль играет проверка перехода. Ступень отвечает на вопрос «докуда маг может дойти в принципе», бросок — «дойдет ли он туда в этой сцене».<\/p><h3 class="sh3" id="s96">Модификатор моста<\/h3><div class="keep"><p class="txt">Оцените, что связывает Игрока и его цель:<\/p><table class="tb"><colgroup><col style="width:14%"><col style="width:86%"><\/colgroup><tr><th>Значение<\/th><th>Что связывает Игрока и цель<\/th><\/tr><tr><td class="">-2<\/td><td class="L">общий эпизод биографии: травма, событие, живая личная связь<\/td><\/tr><tr><td class="">-1<\/td><td class="L">общая среда: школа, Храм, Дом, полк, тюрьма, цех<\/td><\/tr><tr><td class="">0<\/td><td class="L">общий язык в широком смысле: национальный язык, эпоха, вера<\/td><\/tr><tr><td class="">+1<\/td><td class="L">только человеческая феноменальность — общая видовая основа<\/td><\/tr><tr><td class="">+2<\/td><td class="L">общего нет: конструкт, нечеловеческий паттерн, Запределье<\/td><\/tr><\/table><\/div><div class="keep"><p class="txt">Сложность в зависимости от слоя:<\/p><table class="tb"><colgroup><col style="width:14%"><col style="width:86%"><\/colgroup><tr><th>Сложность<\/th><th>Слой<\/th><\/tr><tr><td class="">9<\/td><td class="L">Аффект (быстропеременные состояния одной композиции: текущая мысль, вспышка)<\/td><\/tr><tr><td class="">13<\/td><td class="L">Биография (устойчивые бассейны одной жизни: память, привычки, травмы)<\/td><\/tr><tr><td class="">17<\/td><td class="L">Культура (высокоперекрытые аттракторы: Тени, духи мест, боги, Храмы)<\/td><\/tr><tr><td class="">21<\/td><td class="L">Запределье (области, не связанные ни с чьим восприятием)<\/td><\/tr><\/table><\/div><div class="keep"><p class="txt">Цена:<\/p><table class="tb"><colgroup><col style="width:46%"><col style="width:54%"><\/colgroup><tr><th>Цена<\/th><th>Стоимость<\/th><\/tr><tr><td class="L">активация ориентации<\/td><td class="">2 ОД и 1 Платон<\/td><\/tr><tr><td class="L">вход и каждая смена слоя<\/td><td class="">1 ОД и 1 Платон<\/td><\/tr><tr><td class="L">пребывание<\/td><td class="">1 ОД в раунд<\/td><\/tr><tr><td class="L">провал<\/td><td class="">+1 Платон сверх тарифа: шум съедает поток<\/td><\/tr><\/table><\/div><p class="txt">Время: 1 раунд внутри = 1 раунд снаружи. Изнанка не дает выигрыша времени.<\/p><h3 class="sh3" id="s97">Последствия броска<\/h3><table class="tb"><colgroup><col style="width:24%"><col style="width:76%"><\/colgroup><tr><th>Результат броска<\/th><th>Последствия<\/th><\/tr><tr><td class="">Успех<\/td><td class="L">прибытие<\/td><\/tr><tr><td class="">Ниже на 1<\/td><td class="L">задержка, +1 Платон, повтор броска без штрафа<\/td><\/tr><tr><td class="">Ниже на 2–3<\/td><td class="L">снос, попадание в ближайший бассейн, с целью не связанный; +1 к Сл всех дальнейших переходов в сцене<\/td><\/tr><tr><td class="">Ниже на 4+<\/td><td class="L">критический провал снос + отпечаток<\/td><\/tr><\/table><\/div><div class="col"><p class="txt">Отпечаток — одна чужая черта на сцену, которую Игрок отыгрывает как свою: манера, желание, страх, привязанность. Формулировка одной фразой. Расцепление: медитация 5–10 минут (как в правиле «Резонансного эха»), иными словами проверка Самообладания против Сл 13. Не расцепленный к концу сессии отпечаток — кандидат в патологию.<\/p><p class="txt">Возврат по пройденному маршруту — без броска и без Платонов, с той же ценой ОД. Если маршрут потерян из-за разрыва моста или сноса — новая проверка против Сл последнего достигнутого слоя, и каждый слой на пути наружу оплачивается заново.<\/p><h3 class="sh3" id="s98">Цепь (ретрансляция) — для Хроно-параллакса<\/h3><ul class="bl"><li>Цепь строится через связанные точки: каждое звено — проверка 2d6 + Хроно-параллакс против Сл 9 + 2 × (номер звена).<\/li><li>Провал звена — цепь рвется: уплаченные Платоны и ОД сгорают, цель не достигнута.<\/li><li>Успешная цепь снижает Сл финального перехода на 1 за звено, максимум −3.<\/li><\/ul><h2 class="sh2" id="s99">Платонный профиль<\/h2><p class="txt">Карточка духа места оформляется по аналогии с патологиями.<\/p><p class="txt">Восстановление Платонов в зависимости от места (множитель скорости относительно нормы):<\/p><table class="tb"><colgroup><col style="width:14%"><col style="width:86%"><\/colgroup><tr><th>Множитель<\/th><th>Характер места (скорость восстановления Платонов)<\/th><\/tr><tr><td class="">×2<\/td><td class="L">плотный профиль мысли: библиотека, архив, университет, «публикующаяся» лаборатория<\/td><\/tr><tr><td class="">×1,5<\/td><td class="L">обжитое место с устойчивой практикой: храм, казарма, цех, лазарет<\/td><\/tr><tr><td class="">×1<\/td><td class="L">нейтральное<\/td><\/tr><tr><td class="">×0,5<\/td><td class="L">пустошь, дикая природа, новостройка<\/td><\/tr><tr><td class="">×0<\/td><td class="L">место сильного коллективного аффекта: паника, побоище, лагерь<\/td><\/tr><\/table><h3 class="sh3" id="s144">Модификатор духа<\/h3><p class="txt">Характер места меняет сложность входа в Изнанку:<\/p><table class="tb"><colgroup><col style="width:16%"><col style="width:84%"><\/colgroup><tr><th>Значение<\/th><th>Дух места (сложность входа в Изнанку)<\/th><\/tr><tr><td class="">−2<\/td><td class="L">плотный профиль<\/td><\/tr><tr><td class="">−1<\/td><td class="L">обжитое место<\/td><\/tr><tr><td class="">0<\/td><td class="L">нейтральное<\/td><\/tr><tr><td class="">+1<\/td><td class="L">пустошь<\/td><\/tr><tr><td class="">+2<\/td><td class="L">место аффекта; тонкая работа там невозможна — Мастер вправе отклонить заявку, требующую точности<\/td><\/tr><\/table><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Сторона Мастера<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">22 / 33<\/span><\/div><\/div><div class="grid2"><div class="col"><h2 class="sh2" id="s100">Шаблоны действий<\/h2><p class="txt">Игрок может заранее сформировать перечень типичных действий персонажа, чтобы ускорить игровой процесс.<\/p><p class="txt">Мастер может составить аналогичные шаблоны для НПС или использовать их как подсказки при определении навыков и стоимости действий в ОД.<\/p><h2 class="sh2" id="s107">Распределенное авторство<\/h2><p class="txt">В Arbor Echo создание сюжета — совместный процесс. Мастер контролирует мир и общую канву, но Игроки тоже могут вносить вклад, предлагая сцены, добавляя элементы мира или беря на себя управление второстепенными персонажами.<\/p><p class="txt">Это снижает нагрузку на Мастера и делает темп устойчивее. Игроки лучше понимают контекст и чувствуют личное участие в формировании истории. Такой подход требует дисциплины: Игрок должен различать знания персонажа и знания автора. Персонаж действует исходя из собственного опыта, а не ради удобства сюжета.<\/p><h2 class="sh2" id="s103">Типы кампаний<\/h2><p class="txt">Система AE поддерживает два режима ведения кампаний. Они определяют, насколько глубоко работают дополнительные правила и как много внимания требуется к состоянию персонажа.<\/p><h3 class="sh3" id="s104">Спринтовый режим<\/h3><p class="txt">Подходит для кратких сюжетов и кампаний, ориентированных на действие.<\/p><ul class="bl"><li>Патологии не используются.<\/li><li>Лечение травм, установка модификаций и интеграция просветлений происходят ускоренно.<\/li><li>Последствия травм не используются.<\/li><\/ul><h3 class="sh3" id="s105">Марафонский режим<\/h3><p class="txt">Подходит для долгосрочных партий с акцентом на развитие персонажа и медленно разворачивающиеся последствия.<\/p><ul class="bl"><li>Патологии, модификации и психологические состояния работают полноценно.<\/li><li>Лечение и изучение нового требуют времени и средств.<\/li><li>Тайм-скипы — когда Мастер объявляет тайм-скип, персонаж получает разницу между строкой своей возрастной таблицы и строкой нового возраста (возьмите нижнюю границу диапазона или разницу в рамках диапазона при отсутствии перехода). Пул навыков Здоровья корректируется по той же таблице: если он уменьшается, Мастер снимает очки.<\/li><\/ul><\/div><div class="col"><h3 class="sh3" id="s106">Выбор режима<\/h3><p class="txt">Можно комбинировать элементы: включить часть марафонских правил в спринт или упростить отдельные аспекты долгой кампании. Главное — заранее согласовать список активных механик.<\/p><h2 class="sh2" id="s108">О ваншотах<\/h2><p class="txt">Arbor Echo не рассчитан на ваншоты как основной формат. Его механики раскрываются в длинной кампании, где Следы накапливаются и меняют персонажа постепенно. За одну сессию вы успеете провести несколько сцен и проверить базовые правила, но не увидите, как работает главный цикл игры — действие, последствие, изменение.<\/p><p class="txt">Тем не менее провести ваншот можно. Для этого используйте спринтовый режим, заранее подготовленных персонажей и карточки травм. Магию стоит либо сильно урезать — одно-два заклинания на персонажа, без Гейсов, Стигматов и сложной Изнанки, — либо не брать вовсе. Модификации брать можно, но лучше не совмещать их с магией на одном персонаже: игрок запутается в том, откуда какой бонус и штраф. Без магии система становится гораздо быстрее и лучше подходит для короткой игры.<\/p><h2 class="sh2" id="s109">Фрактальный субъект<\/h2><p class="txt">Формат, в котором несколько Игроков управляют одним персонажем. Каждый отвечает за часть его личности: логику, импульсы, страхи, желания или мораль.<\/p><div class="keep"><p class="txt">Перед игрой распределяются роли. В сцене каждый Игрок предлагает действия со своей позиции. Чтобы принять итоговое решение, используется заранее выбранный метод:<\/p><ul class="bl"><li>Игроки по очереди контролируют персонажа<\/li><li>Устраивают голосование<\/li><li>Мастер выбирает самый подходящий вариант<\/li><\/ul><\/div><p class="txt">Этот формат требует больше времени и концентрации, но зато Игроки учатся договариваться и слышать друг друга, потому что они вместе создают одного персонажа.<\/p><p class="txt">Формат требует от всех собранности и готовности жертвовать личным контролем ради общего замысла. Он подходит не для каждой группы и не для каждой ситуации.<\/p><\/div><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s110"><div class="pg-head"><div class="hl"><span class="k">Онтология<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">23 / 33<\/span><\/div><\/div><h2 class="sh2" id="s111">Изнанка<\/h2><div class="twocol"><p class="txt">Мы научились довольно точно предсказывать поведение частиц с помощью физических законов. Но сами эти законы — не материальные объекты, их нельзя потрогать. Единственный инструмент для их описания — математика, которая сама по себе является конструктом нашего разума.<\/p><p class="txt">Это похоже на то, как мы объясняем наше сознание и ощущения (квалиа). Мы можем описать их как цепочку сигналов в мозге. Например, активация нейронов, связанных с образом крыла самолета, позволяет нам его вспомнить и осознать.<\/p><p class="txt">Но такое объяснение показывает лишь как работает восприятие, а не почему оно сопровождается внутренним, субъективным переживанием. Почему мы — не просто автоматы, механически реагирующие на раздражители?<\/p><p class="txt">Есть два базовых допущения.<\/p><p class="txt">Первое. То, что физика извлекает в виде законов, само не является материальной частностью. Закон не лежит среди частиц. Он задает, какие конфигурации допустимы и с какой мерой. Можно спорить, являются ли законы необходимыми связями в устройстве мира или сжатым описанием регулярностей. Для магии неважно, необходимость это или описание. Важно другое: у структуры должен быть онтический вес — иначе не на что воздействовать.<\/p><p class="txt">Второе. Для некоторых областей той же структуры есть нечто, каково это — ими быть. Квалиа не добавляются к физическому описанию отдельным актом. Они суть то, чем структура является изнутри; физика описывает ту же структуру снаружи — через отношения. Мыслящего гомункулуса над космосом нет.<\/p><p class="txt">Изнанка — мир, взятый без привилегии пространственно-временного сечения, которым пользуется обычное восприятие.<\/p><h3 class="sh3" id="s112">Следствия, на которых стоит механика<\/h3><p class="txt">Философский зомби в этом мире не собирается. Нельзя вычесть опыт, оставив структуру: опыта как отдельного факта нет. Наивный панпсихизм («электрон чувствует») также не имеет смысла. Не всякая структура есть субъект. Субъект — композиция: область, удерживающая границу, то есть устойчивое различие внутреннего и внешнего, сохраняющееся при возмущениях и допускающее контрфактическое действие. Проблема комбинации этим не решена. Критерий границы неполный. Школы магов расходятся в том, с какого порога устойчивость границы считается субъектностью, и это расхождение имеет практическую цену — в этике воздействия, в статусе конструктов, в том, остается ли Резонансное эхо.<\/p><p class="txt">Формальные системы и физическая устройство черпают из одного инвентаря отношений. Это допущение, а не разгадка непостижимой эффективности математики.<\/p><p class="txt">Изнанка не слоена временем так, как слоено пространство-время. Обычное «сейчас» — сечение, удобное телу. В Изнанке присутствуют только реализованные и нереализованные корреляции (то, что уже сцеплено с чьими-то композициями). На этом стоят Хроно-параллакс и Чтение памяти мира.<\/p><p class="txt">Каузальная замкнутость обычной физики в этом мире — хорошее эффективное описание вне ауры и плохой абсолют. Внутри ауры у ограничений появляется источник и сток на границе композиции. Учет этого потока есть цена магии: если бы поток не учитывался, Материя была бы вечным двигателем, и мира с промышленностью, войной и дефицитом не существовало бы в том виде, в каком его играет стол.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Онтология<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">24 / 33<\/span><\/div><\/div><div class="twocol"><h2 class="sh2" id="s113">Аура<\/h2><p class="txt">Субъект не совпадает с объемом черепа. Череп — самая устойчивая проекция границы композиции на обычное пространство. Аура — расхождение: область, где граница выходит за ткань.<\/p><p class="txt">Почему тогда череп вообще важен, если сознание «не в голове»? Потому что биологическое тело — машина, непрерывно подтверждающая, что считается внутренним. Без этой машины композиция расползается в окружающую структуру и перестает быть кем-либо. Смерть ткани — не обязательно смерть композиции, но почти всегда потеря машины, без которой композиция не держит форму на человеческих масштабах времени. Исключения редки, дороги и составляют отдельный класс явлений<sup class="fn"><a href="#fn13" id="fnref13">[13]<\/a><\/sup>.<\/p><p class="txt">Обычные органы снимают реляционный срез, а Аура открывает внутренний аспект тех же структур. Поэтому она всегда паразитирует на наличной сенсорике. Этим объясняется, зачем в шаблонах Ауры сидят Проприоцепция и навыки восприятия, а не один только «магический глаз».<\/p><h2 class="sh2" id="s114">Материя<\/h2><p class="txt">Воздействие на вещество есть локальная деформация эффективных ограничений внутри ауры. Маг не нарушает физику в том смысле, в каком нарушает ее чудо. Он меняет, какая эффективная теория сидит в ограниченном объеме ниже масштаба обрезания.<\/p><p class="txt">Локальная «смена константы» — описание изнутри эффективной теории. Оно не обязано быть безопасным. Вакуум области, устойчивость ядер, причинность сигналов, согласованность чужих измерений — все это может не пережить неаккуратность модели. То, что заклинания в справочнике выглядят как управляемые приемы, есть результат отбора: приемы, которые регулярно взрывают лабораторию, не доживают до распространения в качестве шаблона.<\/p><p class="txt">Почему без науки нельзя? Интенция («хочу, чтобы стало светлее») не выбирает между фотонами, тепловым излучением, фосфенами цели и порчей собственного зрительного нерва.<\/p><p class="txt">Для недеформированной теории соответствующие токи бессточны. Внутри ауры — нет. Формулы стола грубы; онтология требует только, чтобы цена в Платонах была и связана с удержанием границы.<\/p><p class="txt">Имена приемов часто старше моделей. Номенклатура консервирует историю ошибок так же, как любая инженерия.<\/p><h2 class="sh2" id="s115">Тени<\/h2><p class="txt">Изнанка хранит не только индивидуальные композиции, но и корреляционную схему наблюдений. Когда много композиций устойчиво отслеживают одну сущность, в пространстве состояний наблюдателей образуется аттрактор — Тень.<\/p><p class="txt">У Тени есть причинная сила, потому что композиции физичны. Большинство Теней субъектами не являются: у них нет границы, которая удерживалась бы изнутри, зато есть бассейн, в который сходятся чужие композиции, когда те думают «об этом».<\/p><p class="txt">Два полюса, отражающие асимметрию живого и неживого.<\/p><ul class="bl df"><li><b>Дух<\/b> — тень сущности без собственной конкурирующей композиции: вещи, места, института, абстракции, ремесла. Она относительно стабильна и безлична. Ее характер — характер накопленных способов с ней обращаться.<\/li><li><b>Демон<\/b> — тень субъекта. У субъекта уже есть своя композиция, поэтому демон — второй аттрактор, которому не обязательно совпадать с оригиналом. Образ человека в других может уйти сколь угодно далеко от того, каково это — им быть. Демон наследует черты образа, не человека. Путать их — обычная и иногда роковая ошибка менталиста.<\/li><\/ul><p class="txt">Между полюсами возможен синтез. Когда демон сцеплен с духом, возникает Бог: антропоморфизированное явление, к которому можно обратиться как к агенту. Агентность бога равна мере поддерживаемости сцепки.<\/p><h2 class="sh2" id="s116">Запределье<\/h2><p class="txt">Поскольку Изнанка является пространством фундаментальных законов и субъективного опыта, классическое линейное время теряет в ней свою упорядочивающую роль. Она содержит в себе не только актуальное состояние вселенной, но и полную информацию о всех возможных вариантах развития событий. Это порождает области Изнанки, которые не являются и не могут быть связаны с чьим-либо восприятием — ни человеческим, ни каким-либо иным — Запределье.<\/p><p class="txt">Контакт с Запредельем опасен тем, что граница композиции начинает складываться с паттерном, у которого нет совместной истории с человеческой феноменальностью, искажая ее под свою мертворожденную или и вовсе никогда не существовавшую логику.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page" id="s117"><div class="pg-head"><div class="hl"><span class="k">Каноничный сеттинг Arbor Echo<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">25 / 33<\/span><\/div><\/div><div class="twocol"><h2 class="sh2" id="s118">Регионы<\/h2><p class="txt">Мир состоит из самостоятельных регионов, отличающихся политикой, уровнем технологий и отношением к магии. Создавайте регионы по тем же принципам, что и реальные страны: иерархия власти, интересы ключевых игроков, главная точка напряжения. Остальное вторично, пока не противоречит базовой логике. Точка напряжения почти всегда имеет изнаночную проекцию: спор о земле есть спор и о духе места; спор о престоле — и о демоне династии.<\/p><h2 class="sh2" id="s119">Наука и магия<\/h2><p class="txt">Науку развивают отдельные исследователи и небольшие мастерские. Университеты — профессиональные сообщества, где основой репутации служат воспроизводимость методов и признание коллег.<\/p><p class="txt">Магия позволяет поставить эксперимент над веществом раньше, чем построен прибор, который задал бы его вслепую. Она не ставит вмешательство на место доказательства и не избавляет от модели. Маг, получивший эффект, который не может повторить его вне привычной среды, не сделал открытия.<\/p><p class="txt">Отсюда местная форма кризиса воспроизводимости. Лаборатория имеет дух: накопленный профиль отслеживания, привычных процедур, страхов и ожиданий. Результат, достигнутый под его влиянием, не обязан воспроизводиться в другом месте. Школы, которые контролируют платонный профиль места наравне с чистотой реактивов, публикуются чаще. Школы, которые считают это мистикой, получают приоритет за удачные эксперименты и потом его теряют, когда у остальных не получается его повторить.<\/p><p class="txt">Онтология стала экспериментально поддающейся проверке достаточно поздно, чтобы промышленная цивилизация уже существовала. Поэтому мир выглядит как альтернативное начало XX века, а не как магократия. Телеграф, точная механика и химия появились рядом и теперь зависят от того, кто умеет сцеплять одно с другим.<\/p><h3 class="sh3" id="s120">Промышленное развитие<\/h3><p class="txt">Технологии второй промышленной революции — источник зависимости отсталых регионов от метрополий. Магия не демократизирует это автоматически. Она повышает отдачу там, где уже есть культура передачи моделей, мастерская и люди, уже способные к производству в промышленных масштабах. На фронтире она лишь дает отдельных сильных практиков и не строит заводов.<\/p><h3 class="sh3" id="s121">Медицина<\/h3><p class="txt">Базовый уровень включает антисептику, анестезию и полевую хирургию. Фармацевтика обслуживает повседневные нужды. Антибиотики существуют и примитивны. Сложные вмешательства — нейрохирургия, эндокринные манипуляции, работа с наследственным материалом — требуют специалистов с применением магии.<\/p><p class="txt">Причина в том, что резать ее как вещество можно, а вот заставить ее согласиться с новой конфигурацией, не разрушив композицию, — задача на стыке сразу Материи и Менталистики, поэтому нейрохирургия без мага в этом мире категориально неполная.<\/p><h3 class="sh3" id="s122">Психология и практика<\/h3><p class="txt">Бытовая психология решает повседневные задачи и часто права ровно настолько, насколько права любая народная теория. Профессионалы при наличии ресурсов работают с Изнанкой напрямую.<\/p><h3 class="sh3" id="s123">Магическая одаренность<\/h3><p class="txt">Врожденный фенотип того, как в развитии канализировалась связь трех вещей:сосредоточения, интероцептивной регуляции и предрасположенности к формальным (в том числе математическим) представлениям. У одаренного эти три контура сцеплены так, что у границы композиции появляются степени свободы, воздействующие не только на сенсоры тела, но и систему ограничений.<\/p><p class="txt">Специализированной «магической ткани» нет. Есть нервная система, более приспособленная к обучению и специфическому мировосприятию.<\/p><h2 class="sh2" id="s123a">Магия и социальный статус<\/h2><p class="txt">Умение понимать Изнанку и работать с ней связано с интеллектуальной и харизматической деятельностью. Масштаб магических возможностей обычно коррелирует с компетентностью и признанием в профессиональном сообществе. Выдающиеся физики часто являются сильнейшими магами Материи; сходного уровня в Менталистике достигают исследователи психики и мастера работы с людьми. Большинство аспирантов и рядовых специалистов редко выходят за базовые рамки эффектов и используют магию в пределах повседневной профессиональной практики.<\/p><p class="txt">Модификации по доступности и статусному значению сопоставимы с качественной техникой. Рабочая артель может собрать деньги на несложную модификацию рук для одного из своих участников. Армия снабжает офицеров модификациями под задачи службы. Доступ к более сложным усовершенствованиям зависит от личных средств или поддержки организации. При оценке достатка владельца приходится учитывать, кто оплатил модификацию и на каких условиях она ему предоставлена.<\/p><h2 class="sh2" id="s123b">Магическая безопасность<\/h2><p class="txt">Промышленный и политический шпионаж — обычная часть устройства общества. Магия расширяет его инструменты, позволяя вмешиваться в память и менять образ человека в чужом восприятии. Влияние удается удерживать в той мере, в какой его обладатель способен постоянно проверять окружение и защищаться от вмешательства. Паранойя влиятельных людей имеет практическое основание: доверенный сотрудник может сам не знать, что стал проводником чужого воздействия. Практическая сила законов и соглашений зависит от возможности обнаружить нарушение и ответить на него.<\/p><p class="txt">Относительную устойчивость обеспечивают ограничения масштаба заклинаний и скорости восстановления Платонов. Абсорбция позволяет восполнять запас за счет чужой ауры. Способные к ней маги сравнительно редки и следят друг за другом, поскольку чужое усиление меняет условия безопасности для остальных. Дома сотрудничают с государствами, отслеживая опасные практики и вмешиваясь при угрозе общей катастрофы. Угроза существованию всех участников поддерживает такое сотрудничество даже между соперниками. Взаимный шпионаж продолжается и внутри этих соглашений.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">Каноничный сеттинг Arbor Echo<\/span><\/div><div class=hr><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">26 / 33<\/span><\/div><\/div><div class="twocol"><h2 class="sh2" id="s124">Тайные организации<\/h2><p class="txt">Эти группы действуют поверх границ и законов. При создании определите иерархию власти (пирамида, сеть, рой), что они предлагают и требуют взамен.<\/p><h2 class="sh2" id="s125">Великие Дома<\/h2><p class="txt">Это результат длительной евгенической программы, направляемой магией. Целью была стабильная канализация одаренности плюс сопутствующие физиологические качества: когнитивная выносливость, долголетие, развитое восприятие.<\/p><p class="txt">Физиологические изменения достаточно глубоки, чтобы репродуктивная изоляция стала фактом. С обычными людьми Дома не дают жизнеспособного потомства. Усиленный потенциал не гарантирует моральных качеств.<\/p><p class="txt">Каждый Дом держит собственную культуру воздействия: разные рабочие модели, разные допустимые операторы, разные запреты как Гейсы на уровне традиции. Они накапливают знание и влияют на политику длинным рычагом: финансирование исследований, контроль узких мест производства, обучение специалистов, работа с информацией — средой, из которой собираются Тени.<\/p><p class="txt">То, что программа заняла историческое, а не геологическое время, само по себе неправдоподобно без магической канализации развития. Это слабое место канона, и внутри мира его оспаривают (но редко живут счастливо после открытых заявлений).<\/p><h2 class="sh2" id="s126">Хашаш<\/h2><p class="txt">Наркотик вызывает кратковременную эйфорию и субъективное «расширение» — то есть временный сдвиг границы и расшатывание ее критериев. Основное действие накопительное: он повышает скорость и глубину адаптации ткани к текущему состоянию композиции: проще говоря, тело подстраивается под психику быстрее, но без внешнего направляющего стимула процесс неуправляем и вырождается в случайные деформации.<\/p><p class="txt">Отсюда традиционная подготовка воинов: Хашаш плюс жестко заданный режим переживаний. Биомодификации в сеттинге исторически старше медицинской генетики именно поэтому. Естественные источники существуют; сейчас его синтезируют. Дома используют выверенные методики и рафинированное вещество, чтобы добиваться максимальной эффективности от слуг и избегать конвейерного производства кроненберговских чудовищ.<\/p><h2 class="sh2" id="s127">Храмы<\/h2><p class="txt">Храм — профессиональная артель, объединенная единым символом. Храм активно поддерживает существование своего бога, культивируя конкретную интерпретацию образа и защищая ее от конкурирующих вариантов. Его основная функция — сохранение баланса между двумя компонентами бога: если демон-компонент доминирует, бог развивает личностные черты, могущие идти вразрез с интересами Храма, если дух-компонент доминирует, то паства уходит, ведь нельзя молиться абстракции. Ересь в этом контексте — попытка привить к духу другого демона, то есть сменить лицо бога.<\/p><h2 class="sh2" id="s128">Локации<\/h2><p class="txt">Локации описываются через платонный профиль — характер накопленных корреляций, то есть дух места.<\/p><p class="txt">Топология нервной системы и ее текущая активность отражены в Изнанке как сторона той же композиции. Дух локации не «включает» зону Брока. Он делит общий каркас с некоторыми когнитивными траекториями и тем удешевляет их: посетителю дешевле сойтись к тем бассейнам, которые уже плотно зафиксированы ассоциативными связями с этим местом. Библиотека упрощает работу с текстами не метафорически и не телекинезом извилин. Ее дух перекрывается с траекториями чтения и анализа; соответствующие реконструкции сходятся охотнее, уже имеющиеся связи строятся легче. Человек без уже существующих связей не станет филологом от одного входа в читальный зал, зато с ними — сделает за день то, на что дома ушла бы неделя.<\/p><p class="txt">В местах интенсивной умственной деятельности восстановление Платонов идет быстрее: граница композиции опирается на готовую корреляционную схему и тратит меньше ресурсов внимания на то, чтобы собрать ее самой. В местах, где следов человеческой мысли почти нет, маг вынужден формировать опору самостоятельно — восстановление медленнее.<\/p><p class="txt">Доступ к Изнанке сбивается сильными коллективными аффектами. Массовая паника — согласованная деформация множества границ сразу, дух места сдвигается в сторону этого аттрактора, тонкая работа становится невозможной. Храмы и памятные места, наоборот, упрощают доступ, но эффекты наследуют характер духа. Лечить в храме войны можно, правда это будет по характеру ближе к фронтовой медицине.<\/p><h2 class="sh2" id="s129">Ходящие среди грез<\/h2><p class="txt">Утраченная культура, научившаяся переносить границу композиции целиком в Изнанку, используя накопленное теневое устройство мира как несущую среду. Идентичность воспроизводится как композиция, чья машина удержания больше не биологическая.<\/p><p class="txt">Считается, что биологических носителей не осталось. Следы Ходящих искажают пространственно-временной проекции ограничений. В таких зонах вещество ведет себя так, будто эффективная теория места собрана по правилам сна: причинность дырява, геометрия местами врет, сновидение получает меру, которой у него не должно быть.<\/p><\/div><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">ОПРЕДЕЛЕНИЯ ХАРАКТЕРИСТИК, АСПЕКТОВ И НАВЫКОВ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">27 / 33<\/span><\/div><\/div><h2 class="sh2" id="s130">ПРИЛОЖЕНИЕ 1: ОПРЕДЕЛЕНИЯ ХАРАКТЕРИСТИК, АСПЕКТОВ И НАВЫКОВ<\/h2><h3 class="sh3" id="s131">Эрудиция<\/h3><p class="txt">Способность находить, анализировать и применять сырые знания. Эрудит умеет соединять информацию из разных областей для решения поставленных задач<\/p><table class="tb sk"><colgroup><col style="width:17%"><col style="width:38%"><col style="width:45%"><\/colgroup><tr><th>Аспект<\/th><th>Описание<\/th><th>Навыки<\/th><\/tr><tr><td class="rh">Культурология<\/td><td class="L">знания о нормах и практиках разных сообществ; полезно при работе с традициями, табу и ритуалами<\/td><td class="L"><div class="skl"><b>История<\/b> — понимание жизненного цикла институтов: причины возникновения, механизмы развития, причины упадка; помогает реконструировать прошлое и проверять легенды<\/div><div class="skl"><b>Визуальная культура<\/b> — чтение символов, стилей и художественных кодов; анализ произведений, архитектуры, модных сигналов и визуальной пропаганды<\/div><div class="skl"><b>Лингвистика<\/b> — работа с языком: грамматика, этимология, стиль; перевод, дешифровка и атрибуция текста по авторскому почерку<\/div><\/td><\/tr><tr><td class="rh">Медицина<\/td><td class="L">практические знания для диагностики и лечения<\/td><td class="L"><div class="skl"><b>Нейрофизиология<\/b> — принципы работы нервной системы<\/div><div class="skl"><b>Биохимия<\/b> — молекулярные механизмы жизни; создание препаратов и управление метаболизмом<\/div><div class="skl"><b>Анатомия<\/b> — точное знание строения тела; необходимо для хирургии, лечения и прицельных повреждений<\/div><\/td><\/tr><tr><td class="rh">Физика<\/td><td class="L">фундаментальная наука о наиболее общих законах природы, о материи, ее устройстве, движении и правилах трансформации<\/td><td class="L"><div class="skl"><b>Классическая физика<\/b> — механика, гидродинамика, термодинамика; работа с макросистемами<\/div><div class="skl"><b>Электроморфизм<\/b> — поведение электромагнитных полей, индукция, распространение волн; управление электрическими и оптическими эффектами<\/div><div class="skl"><b>Квантовая теория<\/b> — принципы микромира; применение при работе с квантовыми эффектами<\/div><\/td><\/tr><tr><td class="rh">Биология<\/td><td class="L">наука о живых существах и их взаимодействии со средой обитания<\/td><td class="L"><div class="skl"><b>Генетика<\/b> — наследственность, вариации и манипуляции генетическим материалом<\/div><div class="skl"><b>Микроструктуры<\/b> — клеточные процессы, инфекции, симбиозы, внутриклеточные механизмы<\/div><div class="skl"><b>Макроорганизмы<\/b> — анатомия, физиология и поведение многоклеточных; экология и жизненные циклы<\/div><\/td><\/tr><tr><td class="rh">Химия<\/td><td class="L">наука о свойствах веществ и их превращениях<\/td><td class="L"><div class="skl"><b>Реактивная химия<\/b> — неорганические реакции и разрушающие процессы<\/div><div class="skl"><b>Синтетическая химия<\/b> — создание и модификация молекул, проектирование материалов и соединений<\/div><div class="skl"><b>Материаловедение<\/b> — свойства твердых и жидких материалов, поведение при внешних воздействиях<\/div><\/td><\/tr><tr><td class="rh">Математика<\/td><td class="L">инструмент для строгого моделирования и работы с абстрактными системами<\/td><td class="L"><div class="skl"><b>Пространственная логика<\/b> — анализ связности, топологии и организации пространства<\/div><div class="skl"><b>Теория вероятностей<\/b> — работа с риском, прогнозирование и статистика<\/div><div class="skl"><b>Формальный анализ<\/b> — моделирование динамики и непрерывных процессов, оптимизация систем<\/div><\/td><\/tr><\/table><h3 class="sh3" id="s132">Воля<\/h3><p class="txt">Умение целенаправленно управлять собственным поведением и ресурсами психики.<\/p><table class="tb sk"><colgroup><col style="width:17%"><col style="width:38%"><col style="width:45%"><\/colgroup><tr><th>Аспект<\/th><th>Описание<\/th><th>Навыки<\/th><\/tr><tr><td class="rh">Самоконтроль<\/td><td class="L">удержание внимания и управление эмоциями<\/td><td class="L"><div class="skl"><b>Независимость<\/b> — устойчивость ценностей и способность противостоять давлению<\/div><div class="skl"><b>Концентрация<\/b> — длительное удержание фокуса на задаче<\/div><div class="skl"><b>Самообладание<\/b> — стабильность поведения и мышления в экстремальных условиях<\/div><\/td><\/tr><tr><td class="rh">Изнанка<\/td><td class="L">форма волеизъявления, воздействующая на действительность<\/td><td class="L"><div class="skl"><b>Материя<\/b> — направление магии по управлению физическим миром<\/div><div class="skl"><b>Менталистика<\/b> — направление магии по работе с когнитивной реальностью<\/div><div class="skl"><b>Хроно-параллакс<\/b> — мера купирования задержки восприятия<\/div><\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">ОПРЕДЕЛЕНИЯ ХАРАКТЕРИСТИК, АСПЕКТОВ И НАВЫКОВ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">28 / 33<\/span><\/div><\/div><h3 class="sh3" id="s133">Харизма<\/h3><p class="txt">Умение влиять на людей<\/p><table class="tb sk"><colgroup><col style="width:17%"><col style="width:38%"><col style="width:45%"><\/colgroup><tr><th>Аспект<\/th><th>Описание<\/th><th>Навыки<\/th><\/tr><tr><td class="rh">Эмпатия<\/td><td class="L">распознавание эмоций и состояний других<\/td><td class="L"><div class="skl"><b>Манипулирование<\/b> — скрытое поведенческое воздействие<\/div><div class="skl"><b>Актерство<\/b> — воспроизведение образов и состояний для передачи нужного впечатления<\/div><div class="skl"><b>Чтение замысла<\/b> — предугадывание намерений через поведенческие сигналы<\/div><\/td><\/tr><tr><td class="rh">Лидерство<\/td><td class="L">управление группой и координация действий<\/td><td class="L"><div class="skl"><b>Влияние<\/b> — умение вести аудиторию через речь и поведение<\/div><div class="skl"><b>Администрирование<\/b> — распределение ресурсов, делегирование и организация работы<\/div><div class="skl"><b>Чувство конфликта<\/b> — выявление и прогноз межличностных противоречий<\/div><\/td><\/tr><tr><td class="rh">Дипломатия<\/td><td class="L">искусство переговоров<\/td><td class="L"><div class="skl"><b>Убеждение<\/b> — изменение мнений через аргументацию и эмоциональную подачу<\/div><div class="skl"><b>Запугивание<\/b> — демонстрация силы или угрозы для достижения цели<\/div><div class="skl"><b>Обман<\/b> — создание ложного впечатления путем искажения информации<\/div><\/td><\/tr><\/table><h3 class="sh3" id="s134">Телосложение<\/h3><p class="txt">Физические возможности тела<\/p><table class="tb sk"><colgroup><col style="width:17%"><col style="width:38%"><col style="width:45%"><\/colgroup><tr><th>Аспект<\/th><th>Описание<\/th><th>Навыки<\/th><\/tr><tr><td class="rh">Сила<\/td><td class="L">преодоление сопротивления и применение мышечной мощи<\/td><td class="L"><div class="skl"><b>Атлетика<\/b> — перемещение и преодоление препятствий<\/div><div class="skl"><b>Контроль<\/b> — точная изоляция и оценка необходимых усилий<\/div><div class="skl"><b>Выносливость<\/b> — поддержание эффективности при длительной нагрузке<\/div><\/td><\/tr><tr><td class="rh">Здоровье<\/td><td class="L">благополучие физического состояния организма<\/td><td class="L"><div class="skl"><b>Нейромоторика<\/b> — интеграция нервной и двигательной систем для точных реакций<\/div><div class="skl"><b>Гомеостаз<\/b> — поддержание внутреннего равновесия<\/div><div class="skl"><b>Метаболизм<\/b> — эффективность обмена веществ и устойчивость к физиологическим стрессам<\/div><\/td><\/tr><tr><td class="rh">Моторика<\/td><td class="L">двигательные навыки<\/td><td class="L"><div class="skl"><b>Точная моторика<\/b> — работа руками и пальцами в условиях высокой точности<\/div><div class="skl"><b>Общая моторика<\/b> — крупные движения, баланс и мобилизация тела<\/div><div class="skl"><b>Проприоцепция<\/b> — ощущение положения и движения частей тела без визуального контроля<\/div><\/td><\/tr><\/table><h3 class="sh3" id="s135">Восприятие<\/h3><p class="txt">Система сбора и обработки сенсорной информации<\/p><table class="tb sk"><colgroup><col style="width:17%"><col style="width:38%"><col style="width:45%"><\/colgroup><tr><th>Аспект<\/th><th>Описание<\/th><th>Навыки<\/th><\/tr><tr><td class="rh">Дистанционное восприятие<\/td><td class="L">получение данных на расстоянии<\/td><td class="L"><div class="skl"><b>Зрение<\/b> — анализ визуальной информации<\/div><div class="skl"><b>Обоняние<\/b> — распознавание летучих химических следов и запахов<\/div><div class="skl"><b>Слух<\/b> — интерпретация звуков<\/div><\/td><\/tr><tr><td class="rh">Контактное восприятие<\/td><td class="L">получение данных через непосредственное взаимодействие с объектом<\/td><td class="L"><div class="skl"><b>Осязание<\/b> — свойства поверхностей: текстура, температура, плотность<\/div><div class="skl"><b>Интероцепция<\/b> — ощущение внутренних состояний (голод, боль, температура)<\/div><div class="skl"><b>Вкус<\/b> — химический анализ через рецепторы<\/div><\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">ТАБЛИЦА ОЧКОВ НАВЫКОВ В ЗАВИСИМОСТИ ОТ ВОЗРАСТА<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">29 / 33<\/span><\/div><\/div><h2 class="sh2" id="s136">ПРИЛОЖЕНИЕ 2: ТАБЛИЦА ОЧКОВ НАВЫКОВ В ЗАВИСИМОСТИ ОТ ВОЗРАСТА<\/h2><p class="txt">Первый столбец — возраст вашего персонажа<\/p><p class="txt">Второй столбец — количество очков навыков, которые он может свободно распределить (куда угодно, кроме навыков аспекта Здоровье)<\/p><p class="txt">Третий столбец — количество очков навыков, которые можно распределить в аспекте Здоровья.<\/p><table class="tb"><colgroup><col style="width:34%"><col style="width:33%"><col style="width:33%"><\/colgroup><tr><th>Возраст<\/th><th>Свободные навыки<\/th><th>Навыки Здоровья<\/th><\/tr><tr><td class="">10-14<\/td><td class="">19-26<\/td><td class="">9<\/td><\/tr><tr><td class="">15-24<\/td><td class="">27-40<\/td><td class="">8<\/td><\/tr><tr><td class="">25-34<\/td><td class="">42-51<\/td><td class="">7<\/td><\/tr><tr><td class="">35-44<\/td><td class="">51-56<\/td><td class="">6<\/td><\/tr><tr><td class="">45-54<\/td><td class="">57-59<\/td><td class="">5<\/td><\/tr><tr><td class="">55-64<\/td><td class="">59<\/td><td class="">4<\/td><\/tr><tr><td class="">65-74<\/td><td class="">59-58<\/td><td class="">3<\/td><\/tr><tr><td class="">75-84<\/td><td class="">58-56<\/td><td class="">2<\/td><\/tr><\/table><p class="txt">Магическая одаренность — врожденная особенность: решение принимает Мастер, исходя из логики партии и сеттинга. Рекомендуемая точка отсчета: при создании одаренный персонаж получает отдельный пул Изнанки — 2-6 очков (не более 3 в один навык) и один Гейс на стартовое заклинание.<\/p><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ АУРЫ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">30 / 33<\/span><\/div><\/div><h2 class="sh2" id="s137">ПРИЛОЖЕНИЕ 3: СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ АУРЫ<\/h2><p class="txt">Ступень эффекта определяется средним результирующим значением опорных навыков заклинания (пороги: I — до 5, II — 6, III — 10, IV — 14). Сложность проверки равна 9 / 13 / 17 / 21 соответственно.<\/p><table class="tb mx"><colgroup><col style="width:16%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><\/colgroup><tr><th>Заклинание<\/th><th>Ступень I<br>(Базовый)<\/th><th>Ступень II<br>(Продвинутый)<\/th><th>Ступень III<br>(Мастерский)<\/th><th>Ступень IV<br>(Легендарный)<\/th><\/tr><tr><td class="rh">Чувствительность<\/td><td class="L ">Пассивное ощущение сильных аур рядом<\/td><td class="L ">Выявление активных заклинаний низкого уровня.<\/td><td class="L ">Обнаружение скрытых/пассивных эффектов.<\/td><td class="L ">Видение "аурных следов" давних событий.<\/td><\/tr><tr><td class="rh">Накопление<\/td><td class="L ">Сеанс до 3 часов в сутки, восстановление ×3<\/td><td class="L ">Сеанс до 6 часов в сутки, восстановление ×3<\/td><td class="L ">Сеанс до 9 часов в сутки, восстановление ×3; можно поддерживать во время легкой работы<\/td><td class="L ">Сеанс до 12 часов в сутки, восстановление ×3; не требует неподвижности<\/td><\/tr><tr><td class="rh">Дистанционный контроль<\/td><td class="L dash">-<\/td><td class="L ">Отделение небольшого фрагмента (до 40% максимального объема).<\/td><td class="L ">Отделение фрагментов (до 60% в совокупности). Возможность перемещать фрагмент со своей базовой скоростью<\/td><td class="L ">Отделение крупных фрагментов (до 80% в совокупности)<\/td><\/tr><tr><td class="rh">Диффузия<\/td><td class="L ">Вход в ауру цели на 1 раунд; цель немедленно замечает вторжение<\/td><td class="L ">Удержание 3 раунда; одно свое заклинание внутри ауры цели за вход<\/td><td class="L ">Удержание сцены; несколько заклинаний внутри ауры цели, цель теряет право на Диффузию в ответ<\/td><td class="L ">Удержание без ограничения по времени, пока платится стоимость; цель не может вытолкнуть фрагмент<\/td><\/tr><tr><td class="rh">Сонастройка<\/td><td class="L dash">-<\/td><td class="L ">Мимикрия на 1 раунд; цель распознает подмену при любой своей проверке Чувствительности<\/td><td class="L ">Мимикрия на сцену; цель замечает только провал вашей проверки<\/td><td class="L ">Мимикрия неразличима для цели; работает даже если цель активно ищет вторжение<\/td><\/tr><tr><td class="rh">Подавление<\/td><td class="L dash">-<\/td><td class="L ">Выделенный резерв выталкивает чужую ауру на 1 раунд; цель не применяет Ауру в этот раунд<\/td><td class="L ">Цель не применяет Ауру, пока держится резерв; ее запас не восстанавливается<\/td><td class="L ">Аура цели схлопнута: заклинания цели внутри ее собственной ауры невозможны, Платоны цели не восстанавливаются<\/td><\/tr><tr><td class="rh">Абсорбция<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">Поглощение фрагментов чужой ауры.<\/td><td class="L dash">-<\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ МАТЕРИИ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">31 / 33<\/span><\/div><\/div><h2 class="sh2" id="s138">ПРИЛОЖЕНИЕ 4: СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ МАТЕРИИ<\/h2><table class="tb mx"><colgroup><col style="width:16%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><\/colgroup><tr><th>Заклинание<\/th><th>Ступень I<br>(Базовый)<\/th><th>Ступень II<br>(Продвинутый)<\/th><th>Ступень III<br>(Мастерский)<\/th><th>Ступень IV<br>(Легендарный)<\/th><\/tr><tr><td class="rh">Фотокинез<\/td><td class="L ">Рассеянный свет, "фонарик"<\/td><td class="L ">Фокусировка луча, ослепление<\/td><td class="L ">Лазер<\/td><td class="L ">Голограммы, поляризация света<\/td><\/tr><tr><td class="rh">Термокинез<\/td><td class="L ">Нагрев/охлаждение простых веществ<\/td><td class="L ">Точечный нагрев, работа со сплавами<\/td><td class="L ">Градиентный нагрев, работа с газами и жидкостями<\/td><td class="L ">Управление энтропией, плазменные состояния<\/td><\/tr><tr><td class="rh">Телекинез<\/td><td class="L ">Перемещение легких предметов<\/td><td class="L ">Сложные траектории, метание<\/td><td class="L ">Точные манипуляции, остановка снарядов<\/td><td class="L ">Силовые поля, контроль множества объектов одновременно<\/td><\/tr><tr><td class="rh">Восстановление структуры<\/td><td class="L ">Ремонт простых материалов<\/td><td class="L ">Восстановление простых тканей<\/td><td class="L ">Регенерация нервной ткани, наноматериалы<\/td><td class="L ">Мгновенная регенерация, биотрансмутация, ДНК-коррекция<\/td><\/tr><tr><td class="rh">Телепортация<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">В любое доступное место<\/td><\/tr><tr><td class="rh">Море Дирака<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">Пространственные ловушки, карманы<\/td><\/tr><tr><td class="rh">Ядерный распад<\/td><td class="L dash">-<\/td><td class="L ">Цепные реакции, разрушение<\/td><td class="L ">Синтез элементов<\/td><td class="L ">Трансмутация вещества, микро-звезды<\/td><\/tr><tr><td class="rh">Укрепление/аморфизация<\/td><td class="L ">Изменение твердости ±2 ед. Мооса<\/td><td class="L ">Изменение твердости ±4 ед. Мооса, локальная аморфизация небольшого объема<\/td><td class="L ">Изменение плотности и жесткости в широком диапазоне; вязкие и сыпучие среды<\/td><td class="L ">Полная аморфизация или сверхтвердость крупного объема; изменение упругости и хрупкости<\/td><\/tr><tr><td class="rh">Виброкинез<\/td><td class="L ">Управление звуком<\/td><td class="L ">ЭМИ-помехи<\/td><td class="L dash">-<\/td><td class="L ">Контроль световых волн<\/td><\/tr><tr><td class="rh">Материагенез<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">Простое вещество<\/td><\/tr><tr><td class="rh">Нагнетание разности потенциалов<\/td><td class="L ">Статическое электричество<\/td><td class="L ">Выжигание электроники<\/td><td class="L ">Молнии<\/td><td class="L ">Магнитные поля, искусственные силовые линии<\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ МЕНТАЛИСТИКИ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">32 / 33<\/span><\/div><\/div><h2 class="sh2" id="s139">ПРИЛОЖЕНИЕ 5: СТУПЕНЧАТАЯ МАТРИЦА ЭФФЕКТОВ МЕНТАЛИСТИКИ<\/h2><table class="tb mx"><colgroup><col style="width:16%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><col style="width:21%"><\/colgroup><tr><th>Заклинание<\/th><th>Ступень I<br>(Базовый)<\/th><th>Ступень II<br>(Продвинутый)<\/th><th>Ступень III<br>(Мастерский)<\/th><th>Ступень IV<br>(Легендарный)<\/th><\/tr><tr><td class="rh">Ментальное считывание<\/td><td class="L ">Чтение текущих эмоций, самых очевидных намерений (голод, агрессия). Кратковременные образы.<\/td><td class="L ">Чтение текущих мыслей, сильных желаний. Понимание основных мотиваторов.<\/td><td class="L ">Глубокое сканирование мыслей, доступ к недавним воспоминаниям, выявление скрытых мотивов.<\/td><td class="L ">"Прямая трансляция" потока сознания цели, чтение подсознательных импульсов в реальном времени.<\/td><\/tr><tr><td class="rh">Фиксация/форматирование памяти<\/td><td class="L ">Стирание/подтверждение очень свежих (&lt;1 мин), незначительных воспоминаний.<\/td><td class="L ">Стирание/изменение недавних (&lt;1 час) воспоминаний средней важности. Фиксация ярких текущих событий.<\/td><td class="L ">Глубокое редактирование важных воспоминаний, создание простых ложных эпизодов. Избирательное стирание периодов времени.<\/td><td class="L ">Полная перезапись биографии, создание сложных ложных воспоминаний, затрагивающих личность. Массовое "форматирование" у групп.<\/td><\/tr><tr><td class="rh">Де/шифровка памяти<\/td><td class="L ">Скрытие/раскрытие очень поверхностных, неэмоциональных воспоминаний.<\/td><td class="L ">Надежное сокрытие/раскрытие воспоминаний средней значимости<\/td><td class="L ">Работа с глубоко вытесненными или травматичными воспоминаниями. Создание сложных ложных слоев поверх реальных воспоминаний.<\/td><td class="L ">Полная криптография сознания: шифрование целых пластов личности, создание самораскрывающихся воспоминаний по триггерам.<\/td><\/tr><tr><td class="rh">Замена приоритетов<\/td><td class="L ">Временное усиление/ослабление простых предпочтений (любимая еда, цвет).<\/td><td class="L ">Изменение среднесрочных мотиваций (желание учиться, работать). Формирование простых фобий/привязанностей.<\/td><td class="L ">Глубокое перепрограммирование ценностей, изменение долгосрочных целей, внедрение сложных убеждений.<\/td><td class="L ">Коренная перестройка личности, создание фанатичной преданности или абсолютного отвращения.<\/td><\/tr><tr><td class="rh">Внушение<\/td><td class="L dash">-<\/td><td class="L ">Простые, односложные команды ("стой", "беги"<\/td><td class="L ">Более сложные команды ("защищай меня", "принеси то"), действующие минуты.<\/td><td class="L ">Создание "ментальных бомб".<\/td><\/tr><tr><td class="rh">Ориентация в Изнанке<\/td><td class="L ">Кратковременное ощущение "присутствия" в Изнанке, видение сильнейших эхо.<\/td><td class="L ">Уверенная навигация в знакомых областях Изнанки, поиск по ярким ассоциациям.<\/td><td class="L ">Свободное перемещение в Изнанке, создание ментальных карт, поиск по тонким ассоциациям.<\/td><td class="L ">Полное "слияние" с Изнанкой, мгновенная ориентация в любом месте<\/td><\/tr><tr><td class="rh">Ассоциативная сигнализация<\/td><td class="L dash">-<\/td><td class="L ">Создание устойчивой метки (часы) или простой сигнальной ловушки.<\/td><td class="L ">Создание сложных сигнальных систем, долговременных маяков (дни).<\/td><td class="L ">Создание сложных сетей сигнализации, охватывающих области Изнанки.<\/td><\/tr><tr><td class="rh">Рекомбинация следа<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">Создание массовых ложных воспоминаний.<\/td><\/tr><tr><td class="rh">Чтение памяти мира<\/td><td class="L dash">-<\/td><td class="L dash">-<\/td><td class="L ">Мимолетные образы, обрывки мыслей из прошлого/будущего без контекста.<\/td><td class="L ">Получение конкретной, но простой информации (дата, имя, внешность) с привязкой ко времени/месту.<\/td><\/tr><\/table><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><div class="page"><div class="pg-head"><div class="hl"><span class="k">ПРАВОВАЯ ИНФОРМАЦИЯ · ПРИМЕЧАНИЯ<\/span><\/div><div class="hr"><span class="sub">Arbor Echo · Книга правил<\/span><span class="pgn">33 / 33<\/span><\/div><\/div><h2 class="sh2" id="s141">ПРАВОВАЯ ИНФОРМАЦИЯ<\/h2><p class="txt">Arbor Echo — авторская настольная ролевая игра.<\/p><p class="txt">Все материалы данной игры, включая правила, термины, концепции и оригинальные механики, распространяются на условиях лицензии Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0).<\/p><p class="txt">Это означает, что вы можете:<\/p><ul class="bl"><li>Свободно копировать и распространять материалы игры;<\/li><li>Адаптировать и перерабатывать их под собственные нужды;<\/li><li>Создавать производные произведения (например, модули, дополнения или сценарии),<\/li><\/ul><p class="txt">при условии соблюдения следующих требований:<\/p><p class="txt">Указание авторства: вы должны явно указывать, что оригинальный материал принадлежит системе Arbor Echo и ее автору.<\/p><p class="txt">Некоммерческое использование: вы не можете использовать материалы или производные от них работы в коммерческих целях без отдельного письменного разрешения.<\/p><p class="txt">Для получения лицензии на коммерческое использование, а также по вопросам сотрудничества, обратной связи и предложений, обращайтесь к разработчику: <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a>.<\/p><p class="txt">© Arbor Echo. Все права защищены, кроме прямо переданных по лицензии.<\/p><p class="tx title="к тексту">↑<\/a><\/li><li id="fn13"><b>[13]<\/b><a class="sec" href="#s129">Ходящие среди грез<\/a><a class="up" href="#fnref13" title="к тексту">↑<\/a><\/li><\/ol><div class="pg-foot">Arbor Echo · Книга правил · CC BY-NC 4.0 · <a class="mail" href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><script>( function (){ var btns = Array.prototype.slice.call(document.querySelectorAll('.navbtn')); function closeAll(){document.querySelectorAll('.panel.open').forEach( function (p){p.classList.remove('open');});btns.forEach( function (b){b.classList.remove('active');});}btns.forEach( function (btn){btn.addEventListener('click', function (e){e.stopPropagation(); var p = document.getElementById(btn.getAttribute('data-panel')); var was = p.classList.contains('open');closeAll(); if (!was){p.classList.add('open');btn.classList.add('active');}});});document.querySelectorAll('.panel a').forEach( function (a){a.addEventListener('click', function (){closeAll();});});document.addEventListener('click', function (e){ if (!e.target.closest('.topwrap')) closeAll();});document.addEventListener('keydown', function (e){ if (e.key === 'Escape') closeAll();});})();<\/script><\/body><\/html></script><script type="text/html" id="src-sheet"><\!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arbor Echo — Лист персонажа<\/title><style>:root{--bg:#111510;--bg2:#181d16;--bg3:#1e2519;--border:#354533;--brite:#506a4c;--gold:#c8a84b;--green:#7ab870;--teal:#4a9080;--text:#d5ccbc;--dim:#7a7268;--red:#b05040;--orange:#c07840;--yellow:#c8a84b;--head:'Cinzel',Georgia,serif;--body:'IM Fell English',Georgia,serif;--mono:'Share Tech Mono','Courier New',monospace}*{box-sizing:border-box;margin:0;padding:0}body{background:#0d100b;font-family:var(--body);font-size:13px;color:var(--text);padding:10px 0}.toolbar{width:297mm;margin:0 auto 8px;display:flex;gap:6px;justify-content:flex-end;font-family:var " placeholder="тек." aria-label="Текущие Платоны"> / <span id="v_pl">0<\/span><\/span><\/td><\/tr><tr class="sec"><td class="lb" colspan="2">Порог биоагрессивности<\/td><td class="val" colspan="3" id="v_bio">0<\/td><\/tr><tr class="sec"><td class="lb" colspan="2">Скорость восполнения Платонов<\/td><td class="val" colspan="3"><span id="v_rate">0<\/span><span class="u">в сутки<\/span><\/td><\/tr><tr class="sec"><td class="lb" colspan="2">Дальность поля ауры<\/td><td class="val" colspan="3"><span id="v_rng">0<\/span><span class="u">м<\/span><\/td><\/tr><\/table><\/div><\/div><div class="note">ИЗН — первичное значение (потолок 5 при создании, 10 в игре; выше 5 поле оранжевое). ЗС — значение следа: бонусы и штрафы от Просветлений, Гейсов, модификаций, травм. РЗН — результирующее значение: ИЗН + аспект + характеристика + ЗС. Значения аспектов и характеристик (под названиями) — средние арифметические без промежуточного округления (в интерфейсе показываются с точностью до 2 знаков для справки). Округляются только РЗН навыков и вторичные характеристики (0,5 → 1). Порог биоагрессивности считается по сумме ИЗН навыков Здоровья и аспекта Силы. Если «тек.» Платонов не заполнено, дальность считается по полному запасу.<\/div><div class="pg-foot">Arbor Echo · Лист персонажа · CC BY-NC 4.0 · <a href="mailto:duleba2018@gmail.com">duleba2018@gmail.com<\/a><\/div><\/div><script>( function (){ var KEY = 'arborEchoSheet_v1'; function $(id){ return document.getElementById(id);} function num(v){ var n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : 0;} function rnd(x){ return Math.floor(x + 0.5);} function fmt(x){ return String(rnd(x));} function fmtNum(x){ if (!isFinite(x)) return '0'; return String(Math.round(x * 100) / 100);} function sum(a){ return a.reduce( function (s,x){ return s + x;},0);} function calc(){ var rows = Array.prototype.slice.call(document.querySelectorAll('tr[data-a]')); var A ={},CM ={};rows.forEach( function (tr){(A[tr.dataset.a] = A[tr.dataset.a] || []).push(num(tr.querySelector('.iz').value));CM[tr.dataset.a] = tr.dataset.c;}); var av ={},cl ={},cv ={};Object.keys(A).forEach( function (k){av[k] = sum(A[k]) / A[k].length;(cl[CM[k]] = cl[CM[k]] || []).push(av[k]);});Object.keys(cl).forEach( function (k){cv[k] = sum(cl[k]) / cl[k].length;});document.querySelectorAll('[data-av]').forEach( function (e){e.textContent = fmtNum(av[e.dataset.av] || 0);});document.querySelectorAll('[data-cv]').forEach( function (e){e.textContent = fmtNum(cv[e.dataset.cv] || 0);}); var tIz = 0,tMd = 0,tRz = 0,bio = 0;rows.forEach( function (tr){ var n = tr.dataset.n; var iz = rnd(num(tr.querySelector('.iz').value)); var md = rnd(num(tr.querySelector('.md').value)); var rz = rnd(iz + (av[tr.dataset.a] || 0) + (cv[tr.dataset.c] || 0) + md);$('rz' + n).textContent = fmt(rz);tIz += iz;tMd += md;tRz += rz; if (tr.dataset.a === 'te_hp') bio += iz;});bio += (av.te_str || 0);$('t_iz').textContent = fmt(tIz);$('t_md').textContent = fmt(tMd);$('t_rz').textContent = fmt(tRz); var sk = av.vo_sk || 0,hp = av.te_hp || 0,mot = av.te_mot || 0; var od = rnd(2 + sk + mot + Math.max(av.pe_dist || 0,av.pe_kont || 0)); var pl = rnd(sk * 5 + hp * 2); var rate = rnd(sk * 3 + hp); var curRaw = $('cur_pl').value; var cur = curRaw === '' ? pl : Math.min(num(curRaw),pl); var rng = pl > 0 ? rnd(((av.vo_izn || 0) + sk) * cur / pl) : 0;$('v_od').textContent = fmt(od);$('v_pl').textContent = fmt(pl);$('v_bio').textContent = fmt(bio);$('v_rate').textContent = fmt(rate);$('v_rng').textContent = fmt(rng);} function clampInputs(e){ var t = e && e.target; if (t && t.classList && t.classList.contains('iz')){ if (t.value !== ''){ var v = num(t.value); if (v > 10) t.value = 10; if (v < 0) t.value = 0;}}document.querySelectorAll('input.iz').forEach( function (i){i.classList.toggle('over',num(i.value) > 5);});} function collect(){ var d ={};document.querySelectorAll('input[id]').forEach( function (i){ if (i.type !== 'file') d[i.id] = i.value;}); return d;} function apply(d){document.querySelectorAll('input[id]').forEach( function (i){ if (i.type === 'file') return ;i.value = (d && d[i.id] != null) ? d[i.id] : '';});clampInputs();calc();} function save(){ try {localStorage.setItem(KEY,JSON.stringify(collect()));} catch (e){}}document.addEventListener('input', function (e){clampInputs(e);calc();save();});$('b_print').addEventListener('click', function (){window.print();});$('b_export').addEventListener('click', function (){ var name = ($('t_name').value || 'character').replace(/[^\wА-Яа-яЕе-]+/g,'_'); var blob = new Blob([JSON.stringify(collect(),null,1)],{type: 'application/json'}); var a = document.createElement('a');a.href = URL.createObjectURL(blob);a.download = 'arbor-echo-' + name + '.json';document.body.appendChild(a);a.click();a.remove();setTimeout( function (){URL.revokeObjectURL(a.href);},1000);});$('b_import').addEventListener('click', function (){$('f_import').click();});$('f_import').addEventListener('change', function (e){ var f = e.target.files[0]; if (!f) return ; var r = new FileReader();r.onload = function (){ try {apply(JSON.parse(r.result));save();} catch (x){alert('Не удалось прочитать файл.');}};r.readAsText(f);e.target.value = '';});$('b_reset').addEventListener('click', function (){ if (confirm('Очистить все поля листа?')){apply({});save();}}); var saved = null; try {saved = JSON.parse(localStorage.getItem(KEY) || 'null');} catch (e){}apply(saved ||{});})();<\/script><\/body><\/html></script><script type="text/html" id="src-screen"><\!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arbor Echo — Шпаргалка Мастера<\/title><style>:root{--bg:#111510;--bg2:#181d16;--bg3:#1e2519;--border:#354533;--brite:#506a4c;--gold:#c8a84b;--green:#7ab870;--teal:#4a9080;--text:#d5ccbc;--dim:#7a7268;--red:#b05040;--orange:#c07840;--yellow:#c8a84b;--head:'Cinzel',Georgia,serif;--body:'IM Fell English',Georgia,serif;--mono:'Share Tech Mono','Courier N
